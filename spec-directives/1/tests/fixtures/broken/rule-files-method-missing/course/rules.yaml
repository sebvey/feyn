# fixture: the rules of a course; a group whose rules have no method
groups:
  - title: course.yaml
    purpose: The map of the course.
    category: structure
    rules:
      - id: course-yaml-valid-against-schema
        level: requirement
        check: course-yaml
        text: "`course.yaml` shall be valid against `course/schemas/course.schema.yaml`."
      - id: course-id-equals-folder
        level: requirement
        check: course-yaml
        text: The course `id` shall equal the folder name.
  - id: cases
    title: The cases
    purpose: The prepared questions of the loop.
    category: pedagogy
    rules:
      - id: leaf-has-a-case
        level: requirement
        method: test
        check: case-contract
        text: Every leaf sub-concept shall have at least one case.
      - id: case-restates-storyline-facts-only
        level: requirement
        method: inspection
        text: A case shall restate only the storyline facts.
        criterion: Each fact a case states is a fact of the storyline.
      - id: case-asks-what-was-taught
        level: recommendation
        method: analysis
        check: taught-check
        text: A case should ask only what the learner has been taught before it.
        why: A case asks what a later concept teaches.
