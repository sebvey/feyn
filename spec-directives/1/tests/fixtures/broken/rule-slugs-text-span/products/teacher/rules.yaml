# fixture: the rules of the teacher, in two families; the group onboarding follows its family,
# session-start; a rule of the second family has a why
groups:
  - id: session-start
    title: Démarrage
    purpose: Comment une session démarre.
    category: session-start
    method: demonstration
    rules:
      - id: first-rule
        level: requirement
        text: Le premier message part sans appel d'outil.
  - id: onboarding
    title: Accueil
    purpose: Le professeur accueille un nouvel apprenant.
    category: session-start
    method: demonstration
    rules:
      - id: second-rule
        level: requirement
        text: Le premier message présente le cours ; puis `ghost-rule` vaut encore.
  - id: learner-memory
    title: Mémoire
    purpose: Le professeur écrit la mémoire de l'apprenant.
    category: learner-memory
    method: demonstration
    rules:
      - id: save-points
        level: requirement
        text: >-
          Après l'accueil (groupe `onboarding`), les points de sauvegarde (règles `first-rule` et
          `second-rule`).
      - id: save-next-step
        level: requirement
        text: Sous « {phrases.example} », écris où on en est (règle `save-points`).
        why: sans elle, tu oublies où on en est.
