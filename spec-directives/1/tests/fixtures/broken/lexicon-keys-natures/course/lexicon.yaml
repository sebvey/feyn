# A lexicon with one defect: no natures group (natures.fact). Otherwise the course lexicon of the
# spec fixture (valid/course/lexicon.yaml).

# Section titles of the course files.
headings:
  essentials: "L'essentiel"
  stances: "Consensus et choix d'école"
  deepening: "Approfondissement"
  landmarks: "Se vérifier"
  instruction: "Consigne"
  head: "Ouverture"
  foot: "Clôture"
  claims: "Affirmations"
  references: "Références"
  unverified: "Non vérifié"
  problem: "Le problème"
  crossing_case: "Un cas qui traverse le domaine"
  audience: "Public cible"
  onboarding: "Accueil"
  progression: "Progression"
  fixed_facts: "Faits fixés"
  avoid: "Termes à éviter"
  unreleased: "Non publié"

# The kind words that open the headings of a concept file (course/form.yaml): `# Concept 4 : <titre>`,
# `# Annexe A1 : <titre>`, `## Section 4a : <titre>`, `### Unité 4a1 : <titre>`.
block_kinds:
  concept: "Concept"
  annex: "Annexe"
  section: "Section"
  unit: "Unité"
  stock: "En stock"
  separator: " : "

# Labels of the fields of a unit of a concept file and of its supplementary cases
# (course/form.yaml).
unit_fields:
  matter: "Matière"
  anchor: "Ancrage"
  question: "Question"
  expected_answer: "Réponse attendue"
  misconceptions: "Pièges"
  instruction: "Consigne"

# The words of the two blocks of a unit that hold labelled fields (course/form.yaml, `unit`); a
# block of one unlabelled field takes its label as its word: « Pièges » (`unit_fields.misconceptions`),
# « Consigne » (`unit_fields.instruction`).
unit_blocks:
  lesson: "Leçon"
  exercise: "Exercice"

# Who reads a block of a unit or a supplementary case, the word in parentheses in its heading
# (course/form.yaml): `all`, the site, the teacher and the learner; `teacher`, never published,
# what the learner hears of it the teacher chooses and says.
readers:
  all: "pour tous"
  teacher: "teacher seulement"

# The stance markers of the published text: `[cours]`, `[école]`, `[consensus]`.
markers:
  consensus: "consensus"
  school: "école"
  course: "cours"

# The qualifiers a case heading may carry, at most one, and no other word (course/README.md 3.3).
qualifiers:
  fallback: "rechange"
  practice: "entraînement"
  aside: "aparté"

# The words of a concept reference in reader text: « concept 4 », « concepts 5 et 7b »,
# « annexe A2 » (course/README.md 3.5).
concept_refs:
  concept: "concept"
  concepts: "concepts"
  and: "et"
  annex: "annexe"

source_types:
  primary: "primaire"
  secondary: "secondaire"
  marketing: "marketing"

# `rules`: what the teacher does, as a clause of a sentence (no final period). `banned`: the
# characters course text never uses, the em-dash and the arrows (the ASCII `->`, `<-` and `=>` included).
typography:
  rules: "espace avant « : », « ; », « ? » et « ! » ; guillemets « »"
  banned: ["—", "→", "←", "↔", "↑", "↓", "↕", "↗", "↘", "↖", "↙", "↦", "↳", "↪", "⇒", "⇐", "⇔", "⇨", "⟶", "⟵", "⟷", "⟹", "⟸", "⟺", "➜", "➔", "➝", "➞", "➡", "⬅", "⬆", "⬇", "->", "<-", "=>"]
