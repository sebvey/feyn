# fixture: the manifest of a spec MAJOR in its alpha, which declares the files the fixture holds; its map has no entry for the role course.schemas
name: fixture-fr
major: 1
directives: 1
version: 1.0.0-alpha
language: fr

spec:
  manifest: spec.yaml
  readme: README.md
  changelog: CHANGELOG.md
  decisions: decisions
course:
  readme: course/README.md
  rules: course/rules.yaml
  lexicon: course/lexicon.yaml
  schemas: course/schemas
products:
  site:
    lexicon: products/site/lexicon.yaml
  teacher:
    readme: products/teacher/README.md
    rules: products/teacher/rules.yaml
    lexicon: products/teacher/lexicon.yaml
    composition: products/teacher/composition.yaml
    tests: products/teacher/tests
lists:
  categories: [structure, pedagogy, writing, sources, diagrams]
  families: [session-start, domain-presentation, loop, message-form, storyline, stances-and-sources, practice-skip-asides, learner-memory, stop]
  lexicons:
    course:
      headings: {essentials: string, stances: string, deepening: string, landmarks: string, instruction: string, foot: string, claims: string, references: string, unverified: string, problem: string, crossing_case: string, audience: string, onboarding: string, progression: string, fixed_facts: string, avoid: string, unreleased: string}
      block_kinds: {concept: string, annex: string, section: string, unit: string, case: string, separator: string}
      unit_fields: {matter: string, misconceptions: string, root: string, correction: string, anchor: string, question: string, expected_answer: string, misconceptions_in_play: string, instruction: string}
      unit_blocks: {lesson: string, cases: string}
      markers: {consensus: string, school: string, course: string}
      natures: {fact: string}
      concept_refs: {concept: string, concepts: string, and: string, annex: string}
      source_types: {primary: string, secondary: string, marketing: string}
      typography: {banned: list}
    site:
      nav: {domains: string, storyline: string, glossary: string}
map:
  spec:
    manifest: {holds: "the manifest", readers: [builder, verifier, spec writer]}
    readme: {holds: "the entry to the spec", readers: [creator, builder, verifier, spec writer]}
    changelog: {holds: "the changes of the spec", readers: [spec writer]}
    decisions: {holds: "the decisions of the spec", readers: [spec writer]}
  course:
    readme: {holds: "what a course is", readers: [creator, builder]}
    rules: {holds: "the rules of a course", readers: [verifier, spec writer]}
    lexicon: {holds: "the lexicon of the course files", readers: [creator, builder]}
  products:
    site:
      lexicon: {holds: "the lexicon of the site", readers: [builder]}
    teacher:
      readme: {holds: "the protocol, described", readers: [builder]}
      rules: {holds: "the rules of the protocol", readers: [builder, verifier]}
      lexicon: {holds: "the lexicon of the teacher", readers: [builder]}
      composition: {holds: "the composition of the teacher", readers: [builder]}
      tests: {holds: "the test scenarios of the teacher", readers: [verifier]}
