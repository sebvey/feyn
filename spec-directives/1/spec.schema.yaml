# The form of a spec MAJOR's manifest, its spec.yaml (README.md section 1): its identity, then
# its own files, the files of its course and of each of its products, each by role, then its own
# lists, then `files:`, what each role holds and who reads it. A role maps to one path, relative to
# the spec MAJOR, a file or a folder. lib/manifest.js reads the
# manifest for every test of check-spec, and spec-yaml validates it against this schema through
# Ajv2020 (decision checks-use-ajv-and-yaml); what the schema does not say (the version against
# CHANGELOG.md, the name against the language, `major` and `directives` written as integers) is
# spec-yaml's. `directives` and `language` stay top-level keys: the builds and the course checks
# read them by a line pattern (`directives: <MAJOR>`, `language: <code>`) before they know which
# directives to load. A description of a scalar is what its value must be, for spec-yaml's
# failures (« language "french" is not an ISO 639-1 code »).
$schema: https://json-schema.org/draft/2020-12/schema
title: spec.yaml
type: object
required: [name, major, directives, version, language, course]
additionalProperties: false
properties:
  name:
    description: a slug (lowercase words joined by hyphens)
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
  major:
    description: a positive integer
    type: integer
    minimum: 1
  directives:
    description: a positive integer, the MAJOR of spec-directives/ the spec follows
    type: integer
    minimum: 1
  version:
    description: MAJOR.MINOR.PATCH with an optional -alpha
    type: string
    pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-alpha)?$'
  language:
    description: an ISO 639-1 code (two lowercase letters), the language of the spec
    type: string
    pattern: '^[a-z]{2}$'
  spec:
    description: the spec MAJOR's own files, by role, at the paths the directives fix; optional
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      manifest: { const: spec.yaml, description: "spec.yaml, the manifest" }
      readme: { const: README.md, description: "README.md, the entry to the MAJOR" }
      changelog: { const: CHANGELOG.md, description: "CHANGELOG.md, the changes of the spec" }
      decisions: { const: decisions, description: "decisions, the folder of the decisions of the spec" }
  course:
    description: the files of the course, the input of the builds of the products, by role
    type: object
    required: [readme, rules]
    additionalProperties: false
    properties:
      readme: { $ref: '#/$defs/path', description: "a path, the description of a course" }
      rules: { $ref: '#/$defs/path', description: "a path, the rules of a course" }
      lexicon: { $ref: '#/$defs/path', description: "a path, the lexicon of the course files" }
      form: { $ref: '#/$defs/path', description: "a path, the form of the files of a course" }
      schemas: { $ref: '#/$defs/path', description: "a path, the folder of the schemas of a course" }
      checks: { $ref: '#/$defs/path', description: "a path, the folder of the checks of a course" }
      parser: { $ref: '#/$defs/path', description: "a path, the parser of the files of a course, which its checks and the builds of the products load" }
      refs: { $ref: '#/$defs/path', description: "a path, the reader of the references between concepts in the text of a course, which its checks and the builds of the products load" }
      glossary: { $ref: '#/$defs/path', description: "a path, the reader of the glossary of a course, which its checks and the builds of the products load" }
      templates: { $ref: '#/$defs/path', description: "a path, the folder of the course templates" }
      samples: { $ref: '#/$defs/path', description: "a path, the folder of the spec's sample courses" }
  products:
    description: the products the spec defines, each by its name with its files by role, the roles each product's own; none required
    type: object
    minProperties: 1
    propertyNames: { $ref: '#/$defs/name', not: { enum: [course, spec] }, description: "a slug, the name of a product, neither course nor spec" }
    additionalProperties:
      type: object
      minProperties: 1
      propertyNames: { $ref: '#/$defs/name', description: "a slug, a role" }
      additionalProperties: { $ref: '#/$defs/path', description: "a path, a file or a folder of the product" }
  lists:
    description: the closed lists of the spec, which its tests hold its files to; optional
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      classifications:
        description: the classifications of the rules, by the owner of the rule file, the course or a product, each key with its values
        type: object
        minProperties: 1
        propertyNames: { $ref: '#/$defs/name', description: "a slug, course or the name of a product" }
        additionalProperties:
          type: object
          minProperties: 1
          propertyNames:
            description: a slug that is not a key of the rule model (rules.schema.yaml)
            $ref: '#/$defs/name'
            not: { enum: [id, title, purpose, rules, text, why, method, check, criterion] }
          additionalProperties:
            description: a non-empty list of distinct slugs, the values of a classification
            $ref: '#/$defs/slugs'
      lexicons:
        description: the keys each lexicon holds, by its owner, the course or a product
        type: object
        minProperties: 1
        propertyNames: { $ref: '#/$defs/name', description: "a slug, course or the name of a product" }
        additionalProperties: { $ref: '#/$defs/keys' }
  files:
    description: the files of the spec MAJOR, what each role holds and who reads it, which the README.md of the spec MAJOR points to; optional; when present, the test spec-yaml requires an entry for every role declared and none for a role not declared
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      spec: { $ref: '#/$defs/entries' }
      course: { $ref: '#/$defs/entries' }
      products:
        type: object
        minProperties: 1
        propertyNames: { $ref: '#/$defs/name', description: "a slug, the name of a product" }
        additionalProperties: { $ref: '#/$defs/entries' }
      undeclared:
        description: the products the manifest does not declare, each by its name with one line saying why
        type: object
        minProperties: 1
        propertyNames: { $ref: '#/$defs/name', description: "a slug, the name of a product" }
        additionalProperties: { $ref: '#/$defs/line' }
$defs:
  name:
    description: a slug (lowercase words joined by hyphens)
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
  line:
    description: a non-empty string on one line
    type: string
    pattern: '^[^\n]*\S[^\n]*$'
  entries:
    description: the entries of `files:` for the roles of one owner, keyed by role
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      required: [holds, readers]
      additionalProperties: false
      properties:
        holds: { $ref: '#/$defs/line', description: "a non-empty string on one line, what the file or folder holds" }
        readers:
          description: a non-empty list of distinct readers of a spec, each defined in spec-directives/README.md (« The readers »), whose bullets the directives' own tests (tests/test-fixtures) hold the enum below to
          type: array
          minItems: 1
          uniqueItems: true
          items:
            description: a reader of a spec, one of those spec-directives/README.md defines (« The readers »)
            enum: [creator, builder, verifier, spec writer]
  path:
    description: a path relative to the spec MAJOR, a file or a folder, with no leading or trailing slash and no . or .. segment
    type: string
    pattern: '^(?!\.\.?(/|$))(?!.*/\.\.?(/|$))[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$'
  slugs:
    description: a non-empty list of distinct slugs
    type: array
    minItems: 1
    uniqueItems: true
    items:
      description: a slug (lowercase words joined by hyphens)
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
  keys:
    description: the groups of a lexicon, each a map of its keys to their kind
    type: object
    minProperties: 1
    propertyNames: { pattern: '^[a-z_]+$', description: "lowercase words joined by underscores" }
    additionalProperties:
      type: object
      minProperties: 1
      propertyNames: { pattern: '^[a-z_]+$', description: "lowercase words joined by underscores" }
      additionalProperties:
        description: a kind of key, string (a non-empty string) or list (a non-empty list of strings)
        enum: [string, list]
