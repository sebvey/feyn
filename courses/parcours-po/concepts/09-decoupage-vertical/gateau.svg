<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="gateau-titre gateau-desc" fill="currentColor" font-family="system-ui, sans-serif">
  <title id="gateau-titre">Le gâteau en couches : une tranche horizontale contre trois tranches verticales</title>
  <desc id="gateau-desc">Un gâteau de quatre couches empilées. De bas en haut : ingestion, transformation, données prêtes, restitution. La couche de transformation, prise en entier, est grisée et légendée : tranche horizontale, ne sert pas seule. Trois parts verticales, tranche 1, tranche 2 et tranche 3, traversent les quatre couches de haut en bas. Légende : une tranche verticale contient un peu de chaque couche et sert seule.</desc>

  <g id="9a1-couches">
    <g class="secondary" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5">
      <rect x="158" y="78" width="432" height="240"/>
      <path d="M158 138 H590 M158 198 H590 M158 258 H590" fill="none"/>
    </g>
    <g font-size="19" font-weight="600" text-anchor="end">
      <text x="148" y="115">Restitution</text>
      <text x="148" y="175">Données prêtes</text>
      <text x="148" y="235">Transformation</text>
      <text x="148" y="295">Ingestion</text>
    </g>
  </g>

  <g id="9a1-tranche-horizontale" class="muted">
    <rect x="158" y="198" width="432" height="60" fill-opacity="0.25"/>
  </g>

  <g id="9a1-tranches-verticales">
    <g id="9a1-tranche-1" class="primary" fill-opacity="0.85">
      <rect x="172" y="70" width="92" height="67" rx="4"/>
      <rect x="172" y="139" width="92" height="58" rx="2"/>
      <rect x="172" y="199" width="92" height="58" rx="2"/>
      <rect x="172" y="259" width="92" height="67" rx="4"/>
    </g>
    <g id="9a1-tranche-2" class="primary" fill-opacity="0.6">
      <rect x="276" y="70" width="92" height="67" rx="4"/>
      <rect x="276" y="139" width="92" height="58" rx="2"/>
      <rect x="276" y="199" width="92" height="58" rx="2"/>
      <rect x="276" y="259" width="92" height="67" rx="4"/>
    </g>
    <g id="9a1-tranche-3" class="primary" fill-opacity="0.4">
      <rect x="380" y="70" width="92" height="67" rx="4"/>
      <rect x="380" y="139" width="92" height="58" rx="2"/>
      <rect x="380" y="199" width="92" height="58" rx="2"/>
      <rect x="380" y="259" width="92" height="67" rx="4"/>
    </g>
    <g font-size="18" font-weight="650" text-anchor="middle">
      <text x="218" y="58">tranche 1</text>
      <text x="322" y="58">tranche 2</text>
      <text x="426" y="58">tranche 3</text>
    </g>
  </g>

  <g id="9a1-couche-entiere">
    <rect class="muted" x="158" y="198" width="432" height="60" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="532" y="234" text-anchor="middle" font-size="16" font-weight="600">couche entière</text>
  </g>

  <g id="9a1-legende" transform="translate(22 346)" font-size="18.5">
    <g class="muted">
      <rect width="34" height="22" fill-opacity="0.25"/>
      <rect width="34" height="22" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="5 3"/>
    </g>
    <text x="48" y="17"><tspan font-weight="650">tranche horizontale</tspan><tspan fill-opacity="0.8"> : ne sert pas seule</tspan></text>
    <rect class="primary" y="40" width="34" height="22" rx="4" fill-opacity="0.85"/>
    <text x="48" y="57"><tspan font-weight="650">tranche verticale</tspan><tspan fill-opacity="0.8"> : un peu de chaque couche, sert seule</tspan></text>
  </g>
</svg>
