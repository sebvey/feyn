<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 395" fill="currentColor" role="img" aria-labelledby="part-recoupee-titre part-recoupee-desc" font-family="sans-serif">
  <title id="part-recoupee-titre">Une part trop grosse recoupée en parts verticales plus fines</title>
  <desc id="part-recoupee-desc">
    En haut, une part en pointillés : une vue des vélos en panne pour Étienne, trop grosse pour un sprint.
    Elle est recoupée en trois morceaux. Morceau a, les stations du centre-ville seulement : une part verticale qui traverse les quatre couches ;
    patron : D de SPIDR (Mike Cohn), ou Variations in Data (Richard Lawrence), même idée sous deux noms.
    Morceau c, les vélos signalés, confirmés ou non par un technicien : une part verticale qui traverse les quatre couches ;
    patron : R de SPIDR (Mike Cohn), assouplir d'abord une règle.
    Morceau b, une table des signalements prête, sans vue : une simple lamelle horizontale au niveau des données prêtes, les autres couches restent vides ;
    c'est une couche, pas une tranche, et il n'a pas de patron.
    Les trois morceaux sont inventés pour l'illustration.
  </desc>
  <g id="9b1-part-origine">
    <rect class="muted" x="20" y="18" width="560" height="46" rx="8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text class="primary" x="300" y="47" text-anchor="middle" font-size="18" font-weight="600">Une vue des vélos en panne : trop gros pour un sprint</text>
    <path class="muted" d="M115 68 V92" fill="none" stroke="currentColor" stroke-width="2"/>
    <path class="muted" d="M325 68 V92" fill="none" stroke="currentColor" stroke-width="2"/>
    <path class="muted" d="M510 68 V92" fill="none" stroke="currentColor" stroke-width="2"/>
  </g>
  <g id="9b1-morceau-a">
    <text class="primary" x="115" y="108" text-anchor="middle" font-size="17" font-weight="650">a. les stations du</text>
    <text class="primary" x="115" y="127" text-anchor="middle" font-size="17" font-weight="650">centre-ville seulement</text>
    <path class="primary" d="M20 178.5 V148 A6 6 0 0 1 26 142 H204 A6 6 0 0 1 210 148 V178.5 Z" fill-opacity="0.85"/>
    <rect class="primary" x="20" y="181.5" width="190" height="35" fill-opacity="0.85"/>
    <rect class="primary" x="20" y="219.5" width="190" height="35" fill-opacity="0.85"/>
    <path class="primary" d="M20 257.5 H210 V288 A6 6 0 0 1 204 294 H26 A6 6 0 0 1 20 288 Z" fill-opacity="0.85"/>
  </g>
  <g id="9b1-morceau-c">
    <text class="primary" x="325" y="108" text-anchor="middle" font-size="17" font-weight="650">c. les vélos signalés,</text>
    <text class="primary" x="325" y="127" text-anchor="middle" font-size="17" font-weight="650">confirmés ou non</text>
    <path class="secondary" d="M230 178.5 V148 A6 6 0 0 1 236 142 H414 A6 6 0 0 1 420 148 V178.5 Z" fill-opacity="0.6"/>
    <rect class="secondary" x="230" y="181.5" width="190" height="35" fill-opacity="0.6"/>
    <rect class="secondary" x="230" y="219.5" width="190" height="35" fill-opacity="0.6"/>
    <path class="secondary" d="M230 257.5 H420 V288 A6 6 0 0 1 414 294 H236 A6 6 0 0 1 230 288 Z" fill-opacity="0.6"/>
  </g>
  <g id="9b1-morceau-b">
    <text class="primary" x="510" y="108" text-anchor="middle" font-size="17" font-weight="650">b. la table des</text>
    <text class="primary" x="510" y="127" text-anchor="middle" font-size="17" font-weight="650">signalements</text>
    <rect class="muted" x="440" y="142" width="140" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.5"/>
    <rect class="muted" x="440" y="218" width="140" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.5"/>
    <rect class="muted" x="440" y="256" width="140" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.5"/>
    <rect class="muted" x="440" y="180" width="140" height="38" fill-opacity="0.4" stroke="none"/>
    <rect class="muted" x="440" y="180" width="140" height="38" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="7 5"/>
  </g>
  <g id="9b2-patron-a" class="primary" text-anchor="middle" font-size="16">
    <text x="115" y="328"><tspan font-weight="700">D</tspan> de SPIDR (Cohn)</text>
    <text x="115" y="350">ou Variations in Data</text>
    <text x="115" y="372">(Lawrence)</text>
  </g>
  <g id="9b2-patron-c" class="primary" text-anchor="middle" font-size="16">
    <text x="325" y="328"><tspan font-weight="700">R</tspan> de SPIDR (Cohn)</text>
    <text x="325" y="350">assouplir d'abord</text>
    <text x="325" y="372">une règle</text>
  </g>
  <g id="9b1-note-b" class="primary" text-anchor="middle" font-size="16">
    <text x="510" y="328"><tspan font-weight="700">une couche</tspan></text>
    <text x="510" y="350">pas une tranche :</text>
    <text x="510" y="372">pas de patron</text>
  </g>
</svg>
