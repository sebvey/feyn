<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 395" role="img" aria-labelledby="part-recoupee-titre part-recoupee-desc" fill="currentColor" font-family="system-ui, sans-serif">
  <title id="part-recoupee-titre">Une part trop grosse recoupée en parts verticales plus fines</title>
  <desc id="part-recoupee-desc">En haut, une part en pointillés : une vue des vélos en panne pour Étienne, trop grosse pour un sprint. Elle est recoupée en trois morceaux. Morceau a, les stations du centre-ville seulement : une part verticale qui traverse les quatre couches ; patron : D de SPIDR (Mike Cohn), ou Variations in Data (Richard Lawrence), même idée sous deux noms. Morceau c, les vélos signalés, confirmés ou non par un technicien : une part verticale qui traverse les quatre couches ; patron : R de SPIDR (Mike Cohn), assouplir d'abord une règle. Morceau b, une table des signalements prête, sans vue : une simple lamelle horizontale au niveau des données prêtes, les autres couches restent vides ; c'est une couche, pas une tranche, et il n'a pas de patron. Les trois morceaux sont inventés pour l'illustration.</desc>

  <g id="9b1-part-origine">
    <rect class="muted" x="20" y="18" width="560" height="46" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="300" y="47" text-anchor="middle" font-size="18" font-weight="600">Une vue des vélos en panne : trop gros pour un sprint</text>
    <g class="muted" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="2">
      <path d="M115 68 V92"/>
      <path d="M325 68 V92"/>
      <path d="M510 68 V92"/>
    </g>
  </g>

  <g id="9b1-morceau-a">
    <g text-anchor="middle" font-size="17" font-weight="650">
      <text x="115" y="108">a. les stations du</text>
      <text x="115" y="127">centre-ville seulement</text>
    </g>
    <g class="primary" fill-opacity="0.85">
      <rect x="20" y="142" width="190" height="37" rx="4"/>
      <rect x="20" y="181" width="190" height="36" rx="2"/>
      <rect x="20" y="219" width="190" height="36" rx="2"/>
      <rect x="20" y="257" width="190" height="37" rx="4"/>
    </g>
  </g>

  <g id="9b1-morceau-c">
    <g text-anchor="middle" font-size="17" font-weight="650">
      <text x="325" y="108">c. les vélos signalés,</text>
      <text x="325" y="127">confirmés ou non</text>
    </g>
    <g class="primary" fill-opacity="0.6">
      <rect x="230" y="142" width="190" height="37" rx="4"/>
      <rect x="230" y="181" width="190" height="36" rx="2"/>
      <rect x="230" y="219" width="190" height="36" rx="2"/>
      <rect x="230" y="257" width="190" height="37" rx="4"/>
    </g>
  </g>

  <g id="9b1-morceau-b">
    <g text-anchor="middle" font-size="17" font-weight="650">
      <text x="510" y="108">b. la table des</text>
      <text x="510" y="127">signalements</text>
    </g>
    <g class="secondary" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 4">
      <rect x="440" y="142" width="140" height="38"/>
      <rect x="440" y="218" width="140" height="38"/>
      <rect x="440" y="256" width="140" height="38"/>
    </g>
    <g class="muted">
      <rect x="440" y="180" width="140" height="38" fill-opacity="0.25"/>
      <rect x="440" y="180" width="140" height="38" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="2.5" stroke-dasharray="7 5"/>
    </g>
  </g>

  <g id="9b2-patrons" text-anchor="middle" font-size="16">
    <text x="115" y="328"><tspan font-weight="700">D</tspan> de SPIDR (Cohn)</text>
    <text x="115" y="350">ou Variations in Data</text>
    <text x="115" y="372">(Lawrence)</text>

    <text x="325" y="328"><tspan font-weight="700">R</tspan> de SPIDR (Cohn)</text>
    <text x="325" y="350">assouplir d'abord</text>
    <text x="325" y="372">une règle</text>

    <text x="510" y="328"><tspan font-weight="700">une couche</tspan></text>
    <text x="510" y="350">pas une tranche :</text>
    <text x="510" y="372">pas de patron</text>
  </g>
</svg>
