<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" fill="currentColor" role="img" aria-labelledby="sprint-duree-increment-etat-titre sprint-duree-increment-etat-desc" font-family="sans-serif">
  <title id="sprint-duree-increment-etat-titre">Un sprint est une durée, un incrément est un état du produit</title>
  <desc id="sprint-duree-increment-etat-desc">
    En haut, un escalier de quatre marches qui montent de gauche à droite : chaque marche est un incrément, ajouté aux précédents.
    Les marches tombent à des moments variés : une dans le premier sprint, deux dans le deuxième, une dans le troisième.
    Sous l'escalier, une frise de trois sprints de même longueur, collés les uns aux autres, sans pause entre eux : le sprint est une durée.
    Plus bas, un sprint détaillé : le Sprint Planning ouvre le sprint, le Daily Scrum a lieu chaque jour, puis la revue de sprint, puis la rétrospective qui clôt le sprint.
    En bas, un tableau de trois lignes qui associe chaque artefact à son engagement :
    le backlog produit à l'objectif produit, le backlog de sprint à l'objectif de sprint, l'incrément à la Definition of Done.
  </desc>
  <g id="0b-escalier">
    <text x="30" y="40" class="muted" font-size="17">Chaque marche est un incrément,</text>
    <text x="30" y="62" class="muted" font-size="17">ajouté aux précédents</text>
    <rect x="60" y="162" width="510" height="34" class="primary" fill-opacity="0.4" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="68" y="154" class="primary" font-size="19" font-weight="700">1</text>
    <rect x="232" y="128" width="338" height="68" class="primary" fill-opacity="0.6" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="240" y="120" class="primary" font-size="19" font-weight="700">2</text>
    <rect x="318" y="94" width="252" height="102" class="primary" fill-opacity="0.85" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="326" y="86" class="primary" font-size="19" font-weight="700">3</text>
    <rect x="456" y="60" width="114" height="136" class="primary" fill-opacity="0.85" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="464" y="52" class="primary" font-size="19" font-weight="700">4</text>
  </g>
  <g id="0b-frise">
