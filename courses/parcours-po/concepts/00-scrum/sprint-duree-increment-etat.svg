    <rect x="30" y="568" width="230" height="38" rx="6" class="secondary" fill-opacity="0.15" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="145" y="593" text-anchor="middle" class="primary" font-size="18">Incrément</text>
    <line x1="264" x2="318" y1="587" y2="587" class="muted" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="2.5" marker-end="url(#sprint-duree-increment-etat-fleche)"/>
    <rect x="324" y="568" width="246" height="38" rx="6" class="secondary" fill-opacity="0.15"/>
    <rect x="324" y="568" width="246" height="38" rx="6" class="primary" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="2.5"/>
