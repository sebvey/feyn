    <text x="120" y="233" text-anchor="middle" class="primary" font-size="19" font-weight="600">sprint</text>
    <rect x="210" y="204" width="180" height="46" class="secondary" fill-opacity="0.15" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="300" y="233" text-anchor="middle" class="primary" font-size="19" font-weight="600">sprint</text>
    <rect x="390" y="204" width="180" height="46" class="secondary" fill-opacity="0.15" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="480" y="233" text-anchor="middle" class="primary" font-size="19" font-weight="600">sprint</text>
    <text x="30" y="276" class="muted" font-size="16">Sprint : une durée, le suivant commence aussitôt.</text>
  </g>
