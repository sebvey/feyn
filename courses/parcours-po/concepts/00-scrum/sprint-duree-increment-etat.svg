    <rect x="30" y="352" width="80" height="40" class="primary" fill-opacity="0.85"/>
    <line x1="126" x2="126" y1="360" y2="384" class="muted" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
    <line x1="154" x2="154" y1="360" y2="384" class="muted" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
    <line x1="182" x2="182" y1="360" y2="384" class="muted" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
    <line x1="210" x2="210" y1="360" y2="384" class="muted" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
    <line x1="238" x2="238" y1="360" y2="384" class="muted" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
    <line x1="266" x2="266" y1="360" y2="384" class="muted" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
