    <text x="255" y="340" text-anchor="middle" class="primary" font-size="17" font-weight="600">Daily Scrum, chaque jour</text>
    <text x="445" y="340" text-anchor="middle" class="primary" font-size="17" font-weight="600">Revue</text>
    <text x="30" y="416" class="primary" font-size="17" font-weight="600">Sprint Planning</text>
    <text x="30" y="436" class="muted" font-size="16">ouvre le sprint</text>
    <text x="570" y="416" text-anchor="end" class="primary" font-size="17" font-weight="600">Rétrospective</text>
    <text x="570" y="436" text-anchor="end" class="muted" font-size="16">clôt le sprint</text>
  </g>
