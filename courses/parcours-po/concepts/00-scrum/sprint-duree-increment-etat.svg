    <rect x="324" y="524" width="246" height="38" rx="6" class="secondary" fill-opacity="0.15"/>
    <rect x="324" y="524" width="246" height="38" rx="6" class="primary" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="2.5"/>
