    <rect class="muted" x="8" y="188" width="118" height="30" rx="15" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text class="primary" x="67" y="209" text-anchor="middle" font-size="17" font-weight="600" fill="currentColor" fill-opacity="1">Charlotte</text>
    <rect class="muted" x="8" y="226" width="118" height="30" rx="15" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
