    <defs>
      <marker id="backlog-produit-colonne-ordonnee-fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path class="secondary" d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.8"/>
      </marker>
    </defs>
    <rect class="muted" x="190" y="6" width="190" height="38" rx="6" fill="currentColor" fill-opacity="0.15" stroke="none"/>
    <rect class="primary" x="190" y="6" width="190" height="38" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="3.5"/>
    <text class="primary" x="285" y="31" text-anchor="middle" font-size="19" font-weight="700" fill="currentColor" fill-opacity="1">Objectif produit</text>
    <path class="secondary" d="M285 46 V86" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="2.2" marker-end="url(#backlog-produit-colonne-ordonnee-fleche)"/>
    <text class="secondary" x="297" y="72" font-size="17" font-style="italic" fill="currentColor" fill-opacity="0.8">justifie l'ordre</text>
  </g>
  <g id="3a2-colonne">
    <path class="primary" fill-rule="evenodd" fill="currentColor" fill-opacity="0.85" d="M206 90 H364 A6 6 0 0 1 370 96 V116 A6 6 0 0 1 364 122 H206 A6 6 0 0 1 200 116 V96 A6 6 0 0 1 206 90 Z M239 95 H331 V119 H239 Z"/>
    <text x="285" y="112" text-anchor="middle" font-size="18" font-weight="700">1  précis</text>
    <path class="primary" fill-rule="evenodd" fill="currentColor" fill-opacity="0.85" d="M206 130 H364 A6 6 0 0 1 370 136 V156 A6 6 0 0 1 364 162 H206 A6 6 0 0 1 200 156 V136 A6 6 0 0 1 206 130 Z M276 135 H294 V159 H276 Z"/>
    <text x="285" y="152" text-anchor="middle" font-size="18" font-weight="700">2</text>
    <path class="primary" fill-rule="evenodd" fill="currentColor" fill-opacity="0.85" d="M206 170 H364 A6 6 0 0 1 370 176 V204 A6 6 0 0 1 364 210 H206 A6 6 0 0 1 200 204 V176 A6 6 0 0 1 206 170 Z M276 178 H294 V202 H276 Z"/>
    <text x="285" y="196" text-anchor="middle" font-size="18" font-weight="700">3</text>
    <rect class="muted" x="200" y="218" width="170" height="54" rx="6" fill="currentColor" fill-opacity="0.15" stroke="none" opacity="0.95"/>
    <rect class="secondary" x="200" y="218" width="170" height="54" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="7 5" opacity="0.95"/>
    <text class="primary" x="285" y="251" text-anchor="middle" font-size="18" font-weight="600" fill="currentColor" fill-opacity="1">4</text>
    <rect class="muted" x="200" y="280" width="170" height="70" rx="6" fill="currentColor" fill-opacity="0.15" stroke="none" opacity="0.8"/>
    <rect class="secondary" x="200" y="280" width="170" height="70" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="7 5" opacity="0.8"/>
    <text class="primary" x="285" y="321" text-anchor="middle" font-size="18" font-weight="600" fill="currentColor" fill-opacity="1">5</text>
    <rect class="muted" x="200" y="358" width="170" height="86" rx="6" fill="currentColor" fill-opacity="0.15" stroke="none" opacity="0.65"/>
    <rect class="secondary" x="200" y="358" width="170" height="86" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="7 5" opacity="0.65"/>
    <text class="primary" x="285" y="407" text-anchor="middle" font-size="18" font-weight="600" fill="currentColor" fill-opacity="1">6  vague</text>
  </g>
  <g id="3a2-sprint-planning">
