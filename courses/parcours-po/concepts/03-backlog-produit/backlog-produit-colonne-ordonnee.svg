    <path class="secondary" d="M380 244 C424 244 424 280 382 280" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="2.2" marker-end="url(#backlog-produit-colonne-ordonnee-fleche)"/>
    <text class="primary" x="452" y="258" font-size="18" font-weight="600" fill="currentColor" fill-opacity="1">préciser</text>
    <text class="primary" x="452" y="278" font-size="18" font-weight="600" fill="currentColor" fill-opacity="1">et découper</text>
    <path class="secondary" d="M380 318 C424 318 424 354 382 354" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="2.2" marker-end="url(#backlog-produit-colonne-ordonnee-fleche)" marker-start="url(#backlog-produit-colonne-ordonnee-fleche)"/>
    <text class="primary" x="452" y="342" font-size="18" font-weight="600" fill="currentColor" fill-opacity="1">réordonner</text>
    <path class="secondary" d="M382 398 Q410 376 436 394" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="2.2" marker-end="url(#backlog-produit-colonne-ordonnee-fleche)"/>
