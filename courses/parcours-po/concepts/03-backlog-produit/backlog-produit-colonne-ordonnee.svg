  <g id="3a2-legende">
    <text class="secondary" x="300" y="472" text-anchor="middle" font-size="17.5" fill="currentColor" fill-opacity="0.8">le haut précis, le bas vague : <tspan class="primary" font-weight="700" fill="currentColor" fill-opacity="1">choix d'école (DEEP)</tspan></text>
  </g>
  <g id="3b-cahier-des-charges" transform="translate(14 490)">
