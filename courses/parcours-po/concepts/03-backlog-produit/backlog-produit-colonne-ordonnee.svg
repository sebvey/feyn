    <rect class="secondary" x="3" y="26" width="46" height="14" rx="2" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect class="muted" x="0" y="12" width="46" height="14" rx="2" fill="currentColor" fill-opacity="0.35" stroke="none"/>
