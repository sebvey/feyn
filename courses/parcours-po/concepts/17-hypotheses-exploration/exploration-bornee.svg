<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" fill="currentColor" role="img" aria-labelledby="exploration-bornee-titre exploration-bornee-desc" font-family="system-ui, sans-serif" font-size="15">
  <title id="exploration-bornee-titre">Une exploration bornée : une question, une durée, une décision</title>
  <desc id="exploration-bornee-desc">La question du PO entre dans une boîte dont la largeur est la durée fixée avant ; les Developers y explorent ; elle donne une réponse, qui mène à une décision dite d'avance.</desc>
  <g id="17b1-question" class="muted">
    <rect x="10" y="70" width="110" height="60" rx="6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="65" y="97" text-anchor="middle" fill="currentColor">le PO pose</text>
    <text x="65" y="117" text-anchor="middle" fill="currentColor">la question</text>
    <path d="M122 100 H156 M148 94 L156 100 L148 106" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>
  <g id="17b1-boite-bornee" class="primary">
    <rect x="160" y="50" width="200" height="100" rx="6" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="2.5"/>
    <text x="260" y="95" text-anchor="middle" fill="currentColor">les Developers</text>
    <text x="260" y="117" text-anchor="middle" fill="currentColor">explorent</text>
  </g>
  <g id="17b1-largeur-duree" class="muted">
    <path d="M160 168 V180 H360 V168 M260 180 V190" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="260" y="210" text-anchor="middle" fill="currentColor">durée fixée avant</text>
  </g>
  <g id="17b1-reponse" class="muted">
    <path d="M362 100 H406 M398 94 L406 100 L398 106" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="410" y="70" width="180" height="60" rx="6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="500" y="106" text-anchor="middle" fill="currentColor">une réponse</text>
  </g>
  <g id="17b1-decision" class="muted">
    <path d="M500 132 V184 M492 176 L500 184 L508 176" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="410" y="190" width="180" height="60" rx="6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="500" y="226" text-anchor="middle" fill="currentColor">décision dite d'avance</text>
  </g>
</svg>
