    <path d="M20 347 H30" class="muted" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2.2" stroke-dasharray="5 4"/>
    <path d="M20 389 H30" class="muted" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2.2" stroke-dasharray="5 4"/>
  </g>

