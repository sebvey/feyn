    <rect x="20" y="36" width="540" height="54" rx="6" class="primary" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="3.5"/>
    <text x="290" y="68" text-anchor="middle" class="primary" fill-opacity="1" font-size="17" font-weight="600">Prévenir les vols</text>
  </g>

