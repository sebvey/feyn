    <rect x="39" y="134" width="150" height="54" rx="6" class="secondary" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="3.5"/>
    <text x="114" y="158" text-anchor="middle" class="primary" fill-opacity="1" font-size="17" font-weight="600">Alerter</text>
    <text x="114" y="178" text-anchor="middle" class="primary" fill-opacity="1" font-size="17" font-weight="600">les agents</text>
    <rect x="263" y="134" width="150" height="54" rx="6" class="muted" fill-opacity="0.12" stroke="none"/>
    <rect x="263" y="134" width="150" height="54" rx="6" class="secondary" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="3.5"/>
