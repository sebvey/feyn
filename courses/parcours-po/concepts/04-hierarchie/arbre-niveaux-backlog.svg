    <path d="M290 112 H506 V232" class="muted" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="2.2"/>
    <path d="M114 188 V210 H58 V232" class="muted" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="2.2"/>
    <path d="M114 210 H170 V232" class="muted" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="2.2"/>
    <path d="M338 188 V210 H282 V232" class="muted" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="2.2"/>
    <path d="M338 210 H394 V232" class="muted" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="2.2"/>
  </g>

  <g id="4a1-liens-taches">
