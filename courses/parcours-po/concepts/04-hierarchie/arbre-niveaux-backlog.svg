    <rect x="454" y="232" width="104" height="58" rx="6" class="muted" fill-opacity="0.12" stroke="none"/>
    <rect x="454" y="232" width="104" height="58" rx="6" class="secondary" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="3.5"/>
    <text x="506" y="257" text-anchor="middle" class="primary" fill-opacity="1" font-size="15" font-weight="600">Marquer un</text>
    <text x="506" y="277" text-anchor="middle" class="primary" fill-opacity="1" font-size="15" font-weight="600">vélo volé</text>
