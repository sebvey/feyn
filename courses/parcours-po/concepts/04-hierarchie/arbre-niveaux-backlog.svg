    <rect x="342" y="232" width="104" height="58" rx="6" class="secondary" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="3.5"/>
    <text x="394" y="257" text-anchor="middle" class="primary" fill-opacity="1" font-size="15" font-weight="600">Marquer un</text>
