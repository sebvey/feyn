    <text x="194" y="361" class="muted" fill-opacity="0.85" font-size="16" font-style="italic">plan des Developers,</text>
    <text x="194" y="381" class="muted" fill-opacity="0.85" font-size="16" font-style="italic">backlog de sprint</text>
  </g>

  <g id="4b-compte">
    <text x="600" y="51" class="primary" fill-opacity="0.85" font-size="16" font-weight="800" letter-spacing="0.04em">EPIC</text>
    <text x="600" y="70" class="primary" fill-opacity="1" font-size="15.5">plusieurs groupes,</text>
    <text x="600" y="89" class="primary" fill-opacity="1" font-size="15.5">ou pas tous écrits</text>
    <text x="600" y="149" class="secondary" fill-opacity="0.6" font-size="16" font-weight="800" letter-spacing="0.04em">FEATURE</text>
