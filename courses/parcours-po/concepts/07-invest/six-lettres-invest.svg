<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 495" fill="currentColor" font-family="system-ui, sans-serif" role="img" aria-labelledby="six-lettres-invest-titre six-lettres-invest-desc">
  <title id="six-lettres-invest-titre">Les six lettres d'INVEST</title>
  <desc id="six-lettres-invest-desc">Six lettres en rang, I, N, V cochées, E, S, T marquées d'un point d'interrogation. Les trois lettres douteuses pointent vers un seul mot de la phrase d'une story, rapidement. L'utilisateur concerné précise le mot avant le sprint, alors E, S et T se tranchent.</desc>

  <g id="7a1-lettres-tenues" class="secondary" text-anchor="middle">
    <rect x="14" y="10" width="92" height="156" rx="6" fill="none" stroke="currentColor" stroke-width="2" stroke-opacity="0.6"/>
    <rect x="110" y="10" width="92" height="156" rx="6" fill="none" stroke="currentColor" stroke-width="2" stroke-opacity="0.6"/>
    <rect x="206" y="10" width="92" height="156" rx="6" fill="none" stroke="currentColor" stroke-width="2" stroke-opacity="0.6"/>
    <g class="muted">
      <text x="60" y="54" font-size="32" font-weight="bold">I</text>
      <text x="60" y="82" font-size="14">Independent</text>
      <text x="60" y="114" font-size="26">✓</text>
      <text x="60" y="140" font-size="14">la lettre</text>
      <text x="60" y="157" font-size="14">se tient</text>
      <text x="156" y="54" font-size="32" font-weight="bold">N</text>
      <text x="156" y="82" font-size="14">Negotiable</text>
      <text x="156" y="114" font-size="26">✓</text>
      <text x="156" y="140" font-size="14">la lettre</text>
      <text x="156" y="157" font-size="14">se tient</text>
      <text x="252" y="54" font-size="32" font-weight="bold">V</text>
      <text x="252" y="82" font-size="14">Valuable</text>
      <text x="252" y="114" font-size="26">✓</text>
      <text x="252" y="140" font-size="14">la lettre</text>
      <text x="252" y="157" font-size="14">se tient</text>
    </g>
  </g>

  <g id="7a1-lettres-douteuses" class="primary" text-anchor="middle">
    <rect x="302" y="10" width="92" height="156" rx="6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2.5" stroke-dasharray="7 5"/>
    <rect x="398" y="10" width="92" height="156" rx="6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2.5" stroke-dasharray="7 5"/>
    <rect x="494" y="10" width="92" height="156" rx="6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="348" y="54" font-size="32" font-weight="bold">E</text>
    <text x="348" y="82" font-size="14">Estimable</text>
    <text x="444" y="54" font-size="32" font-weight="bold">S</text>
    <text x="444" y="82" font-size="14">Small</text>
    <text x="540" y="54" font-size="32" font-weight="bold">T</text>
    <text x="540" y="82" font-size="14">Testable</text>
    <g class="muted">
      <text x="348" y="114" font-size="26">?</text>
      <text x="348" y="140" font-size="14">elle est</text>
      <text x="348" y="157" font-size="14">douteuse</text>
      <text x="444" y="114" font-size="26">?</text>
      <text x="444" y="140" font-size="14">elle est</text>
      <text x="444" y="157" font-size="14">douteuse</text>
      <text x="540" y="114" font-size="26">?</text>
      <text x="540" y="140" font-size="14">elle est</text>
      <text x="540" y="157" font-size="14">douteuse</text>
    </g>
  </g>

  <g id="7a2-fleches-vers-le-mot" class="primary" fill="none" stroke="currentColor" stroke-width="2" stroke-opacity="0.6">
    <path d="M348 170 L432 268"/>
    <path d="M444 170 L446 268"/>
    <path d="M540 170 L462 268"/>
    <path d="M420.5 262 L432 268 L428.1 255.6" stroke-linejoin="round"/>
    <path d="M441 256 L446 268 L451 256" stroke-linejoin="round"/>
    <path d="M473.4 261.7 L462 268 L465.6 255.5" stroke-linejoin="round"/>
  </g>

  <g id="7a2-phrase-exemple" class="muted" font-size="16">
    <text x="14" y="262" font-size="14">La phrase est un exemple inventé pour l'illustration</text>
    <text x="392" y="304" text-anchor="end">« … je veux une vue qui s'affiche</text>
    <text x="508" y="304">… »</text>
  </g>

  <g id="7a2-mot-flou" class="primary">
    <rect x="396" y="278" width="108" height="36" rx="6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="450" y="303" text-anchor="middle" font-size="18" font-weight="bold">rapidement</text>
  </g>

  <g id="7a2-note-racine" class="muted">
    <text x="300" y="346" text-anchor="middle" font-size="15">un seul mot non fixé, trois lettres douteuses</text>
  </g>

  <g id="7a2-precision-utilisateur" class="primary">
    <path d="M300 356 L300 380 M293 372 L300 382 L307 372" fill="none" stroke="currentColor" stroke-width="2" stroke-opacity="0.6" stroke-linejoin="round"/>
    <rect x="50" y="388" width="500" height="40" rx="6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2.5"/>
    <text x="300" y="413" text-anchor="middle" font-size="16" font-weight="bold">l'utilisateur concerné précise le mot, avant le sprint</text>
  </g>

  <g id="7a2-resultat-tranche" class="muted">
    <path d="M300 432 L300 456 M293 448 L300 458 L307 448" fill="none" stroke="currentColor" stroke-width="2" stroke-opacity="0.6" stroke-linejoin="round"/>
    <text x="300" y="482" text-anchor="middle" font-size="16">alors E, S et T se tranchent</text>
  </g>
</svg>
