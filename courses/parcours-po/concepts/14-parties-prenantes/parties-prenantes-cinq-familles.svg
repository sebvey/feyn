<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="currentColor" role="img" aria-labelledby="parties-prenantes-cinq-familles-titre parties-prenantes-cinq-familles-desc" font-family="system-ui, sans-serif" font-size="14">
  <title id="parties-prenantes-cinq-familles-titre">Le produit comme un tuyau</title>
  <desc id="parties-prenantes-cinq-familles-desc">Le produit au centre, comme un tuyau : les fournisseurs de données à gauche, les utilisateurs à droite, le financeur et le sponsor au-dessus, l'équipe voisine en dessous. Des pointillés relient l'équipe voisine aux fournisseurs et aux utilisateurs.</desc>

  <g id="14a-financeur" class="muted">
    <rect x="145" y="14" width="170" height="62" rx="4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="230" y="40" text-anchor="middle" font-weight="bold">Financeur</text>
    <text x="230" y="62" text-anchor="middle">paie le service</text>
  </g>
  <g id="14a-sponsor" class="muted">
    <rect x="325" y="14" width="170" height="62" rx="4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="410" y="40" text-anchor="middle" font-weight="bold">Sponsor</text>
    <text x="410" y="62" text-anchor="middle">porte le budget</text>
  </g>
  <g id="14a-liens-budget" class="muted">
    <line x1="280" y1="76" x2="280" y2="148" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="360" y1="76" x2="360" y2="148" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <g id="14a-fournisseurs" class="muted">
    <rect x="10" y="148" width="190" height="76" rx="4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="105" y="172" text-anchor="middle" font-weight="bold">Fournisseurs de données</text>
    <text x="105" y="194" text-anchor="middle">ceux dont le produit</text>
    <text x="105" y="212" text-anchor="middle">tire ses données</text>
  </g>
  <g id="14a-produit" class="muted">
    <rect x="250" y="148" width="140" height="76" rx="4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="320" y="192" text-anchor="middle" font-weight="bold">Le produit</text>
  </g>
  <g id="14a-utilisateurs" class="muted">
    <rect x="440" y="148" width="190" height="76" rx="4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="535" y="180" text-anchor="middle" font-weight="bold">Utilisateurs</text>
    <text x="535" y="202" text-anchor="middle">consommateurs de données</text>
  </g>
  <g id="14a-flux-donnees" class="muted">
    <line x1="200" y1="186" x2="240" y2="186" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
    <polygon points="250,186 238,179 238,193" fill-opacity="0.5"/>
    <line x1="390" y1="186" x2="430" y2="186" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
    <polygon points="440,186 428,179 428,193" fill-opacity="0.5"/>
  </g>
  <g id="14a-lien-voisine" class="muted">
    <line x1="320" y1="224" x2="320" y2="296" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <g id="14a-equipe-voisine" class="primary">
    <rect x="250" y="296" width="140" height="62" rx="4" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="2.5"/>
    <text x="320" y="322" text-anchor="middle" font-weight="bold">Équipe voisine</text>
    <text x="320" y="344" text-anchor="middle">travaille à côté</text>
  </g>
  <g id="14a-pointilles" class="primary">
    <path d="M250 327 H105 V232" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="6 5"/>
    <path d="M97 238 L105 226 L113 238 Z"/>
    <path d="M390 327 H535 V232" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="6 5"/>
    <path d="M527 238 L535 226 L543 238 Z"/>
  </g>

  <g id="14a-cle" class="muted">
    <line x1="10" y1="396" x2="60" y2="396" stroke="currentColor" stroke-opacity="0.8" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="72" y="401">pointillé : un même acteur</text>
  </g>
</svg>
