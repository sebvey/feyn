<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="currentColor" role="img" aria-labelledby="dire-non-titre dire-non-desc" font-family="system-ui, sans-serif" font-size="14">
  <title id="dire-non-titre">Dire non : pas maintenant, pourquoi, où est la demande</title>
  <desc id="dire-non-desc">Le backlog est une colonne de quatre places ; la demande de la partie prenante est à la troisième. Une flèche mène de la demande à la réponse, qui tient en trois cases : pas maintenant, pourquoi, où est la demande. La troisième case renvoie à la demande, à sa place dans le backlog.</desc>
  <g id="14b-backlog" class="muted">
    <text x="10" y="40" font-weight="bold">le backlog</text>
    <rect x="10" y="56" width="190" height="288" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>
  <g id="14b-place-1" class="muted">
    <rect x="22" y="70" width="166" height="56" rx="4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>
  <g id="14b-place-2" class="muted">
    <rect x="22" y="138" width="166" height="56" rx="4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>
  <g id="14b-demande" class="muted">
    <rect x="22" y="206" width="166" height="56" rx="4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="105" y="239" text-anchor="middle" font-weight="bold">la demande</text>
  </g>
  <g id="14b-place-4" class="muted">
    <rect x="22" y="274" width="166" height="56" rx="4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>
  <g id="14b-lien-reponse" class="muted">
    <path d="M188 234 H241" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M250 234 l-10 -6 v12 z" fill-opacity="0.5"/>
  </g>
  <g id="14b-reponse" class="primary">
    <rect x="250" y="50" width="340" height="272" rx="6" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="266" y="74" font-size="16" font-weight="bold">la réponse</text>
  </g>
  <g id="14b-case-maintenant" class="primary">
    <rect x="266" y="90" width="308" height="64" rx="4" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="2.5"/>
    <text x="280" y="116" font-size="16" font-weight="bold">Pas maintenant</text>
    <text x="280" y="140" class="muted">pas « jamais »</text>
  </g>
  <g id="14b-case-pourquoi" class="primary">
    <rect x="266" y="166" width="308" height="64" rx="4" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="2.5"/>
    <text x="280" y="192" font-size="16" font-weight="bold">Pourquoi</text>
    <text x="280" y="216" class="muted">l'objectif produit, ce qui est prêt</text>
  </g>
  <g id="14b-case-ou" class="primary">
    <rect x="266" y="242" width="308" height="64" rx="4" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="2.5"/>
    <text x="280" y="268" font-size="16" font-weight="bold">Où est la demande</text>
    <text x="280" y="292" class="muted">au backlog, à sa place</text>
  </g>
  <g id="14b-lien-retour" class="muted">
    <path d="M266 284 H226 V252 H199" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M190 252 l10 -6 v12 z" fill-opacity="0.5"/>
  </g>
</svg>
