# The rules on the spec itself (SPEC.md section 3; decision spec-files-and-alpha-version, amended
# by #329): its language packs, its protocol's slugs, its rule files and schemas. The language
# pack is not a product: these rules count toward no course's conformance and no teacher's.
# Their category is `spec`. check-spec (rule-files) verifies this file.
groups:
  - title: The language packs (COURSE.md section 7)
    category: spec
    method: test
    rules:
      - id: language-pack-holds-keys
        level: requirement
        check: language-pack-keys
        text: >-
          The language pack of the course language shall hold every key of `COURSE.md` section
          7, `checks.anaphora` excepted, and every key `PROTOCOL.md` uses: a key a non-empty
          string, a list a non-empty list of strings.

  - title: The slugs of the protocol (decisions rules-named-by-slug, rule-groups-replace-ranges)
    category: spec
    method: test
    rules:
      - id: protocol-rules-named-by-slug
        level: requirement
        check: rule-slugs
        text: >-
          Every rule and every group of rules of `PROTOCOL.md` shall be named by a slug,
          defined once in one namespace.
      - id: rules-cited-by-defined-slug
        level: requirement
        check: rule-slugs
        text: >-
          A rule or a group cited in `PROTOCOL.md`, `SPEC.md`, `COURSE.md` and `decisions/`
          shall be cited by a slug that is defined, a group as a group and a rule as a rule.
      - id: no-rule-number-or-range
        level: requirement
        check: rule-slugs
        text: >-
          No rule shall be named or cited by a number, and no set of rules by a range « `a` à
          `b` » in `PROTOCOL.md`, `SPEC.md` or `COURSE.md`.

  - title: The rule files and the schemas
    category: spec
    method: test
    rules:
      - id: rule-required-fields
        level: requirement
        check: rule-files
        text: >-
          A rule of `rules/*.yaml` shall have an `id` (a slug), a `level`, a `category`, a
          `method` and a `text`, `category` and `method` declared on the rule or on its group;
          a rule of `rules/protocol.yaml` also has an `origin`.
      - id: rule-values-from-closed-lists
        level: requirement
        check: rule-files
        text: >-
          The level, method and category of a rule shall be values of the closed lists of
          `SPEC.md` sections 4 to 6: for a rule of the protocol, a family; for a rule on the
          spec itself, `spec`.
      - id: rule-ids-unique
        level: requirement
        check: rule-files
        text: A rule id shall be unique across the rule files, group ids included.
      - id: rule-check-exists
        level: requirement
        check: rule-files
        text: >-
          The `check` of a rule shall name a check that exists: a script of `checks/` or an
          agent workflow of `.claude/workflows/`.
      - id: check-one-category-one-level
        level: requirement
        check: rule-files
        text: A check shall verify rules of one category and one level.
      - id: schema-compiles
        level: requirement
        check: rule-files
        text: >-
          Each schema of `schemas/` shall compile as JSON Schema 2020-12 under ajv's class
          `Ajv2020`.
      - id: schema-is-one-rule
        level: requirement
        check: rule-files
        text: >-
          Each schema of `schemas/` shall be named by the text of one rule of
          `rules/course.yaml`.
