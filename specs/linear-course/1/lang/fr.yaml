# French language pack of `linear-course`: everything that depends on the language spoken to the
# learner, and nothing else. The keys are those of SPEC.md section 9 and of the "Keys and
# parameters" tables of PROTOCOL.md (`language-pack-keys` verifies them); `site` holds the labels
# of the site, read by the site engine. A value with a slot, `{n}`, `{title}`, is filled by whoever
# reads it. Typography of these values: space before « : », « ; », « ? », « ! », quotes « »;
# no em-dash, no arrow (the list under `typography.banned` names them).

# Literal phrases the teacher says (PROTOCOL.md "Language pack, groups the protocol adds").
phrases:
  concept_title: "Concept {n} : {title}"
  domain_title: "Domaine {n} : {title}"
  site_link: "le site web"
  domains_map_link: "la carte des domaines"
  concept_page_link: "la page du concept {n}"
  example_lead: "Exemple :"
  question_lead: "Question pour toi :"
  next_lead: "La suite :"
  continue_prompt: "Des questions ? J'enchaîne ?"
  questions_announce: "J'ai {count} questions pour toi, voici la première :"  # {count} in words
  why: "pourquoi ?"
  banned_check: "as-tu compris ?"
  reference_model: "{name}, au concept {n}"  # a model: « la DoD, au concept 11 »
  waiting_example: "Parfait {nickname}, je prépare le concept {n}."  # a model
  onboarding_setup: "Je mets en place le cours."
  onboarding_ready: "C'est prêt, on démarre."
  resume_opening: "Je retrouve où on en était, un instant."
  stop_opening: "Je sauvegarde ta progression, un instant."

# What the learner says and the teacher reacts to (lists: models, not fixed strings).
learner_says:
  faster: "plus vite"
  slower: "plus lent"
  example: "exemple"
  exercise: "exercice"
  continue: ["on continue", "la suite"]
  resume: ["on reprend"]
  stop: ["on s'arrête", "fin de session", "je dois y aller", "on reprendra"]
  hurry: ["je dois filer", "vite"]

# Section titles of the course files.
headings:
  objective: "Objectif"
  essentials: "L'essentiel"
  stances: "Consensus et choix d'école"
  pitfalls: "Pièges"
  quick_test: "Le test rapide"
  deepening: "Approfondissement"
  instructions: "Consignes"
  storyline_facts: "Faits du fil rouge utilisés"
  bank: "Banque d'exemples"
  drawing: "Schéma"
  claims: "Affirmations"
  references: "Références"
  unverified: "Non vérifié"
  problem: "Le problème"
  concept_thread: "Le fil des concepts"
  from_to: "D'où l'on vient, où l'on va"
  crossing_case: "Un cas qui traverse le domaine"
  audience: "Public cible"
  onboarding: "Accueil"
  avoid: "Termes à éviter"
  unreleased: "Non publié"

# Labels of the fields of a case of `teaching.md`.
case_fields:
  usage: "Usage"
  explanation: "Explication"
  situation: "Situation"
  question: "Question"
  expected_answer: "Réponse attendue"
  common_mistakes: "Erreurs fréquentes"
  what_works: "Ce qui marche"

# Words of the reader text: the storyline lead `**Fil rouge :**` and the stance markers `[cours]`,
# `[école]`, `[consensus]`.
markers:
  storyline: "Fil rouge"
  consensus: "consensus"
  school: "école"
  course: "cours"

# The qualifiers a case heading may carry, at most one, and no other word (SPEC.md 4.3).
qualifiers:
  fallback: "rechange"
  practice: "entraînement"
  aside: "aparté"

# The words of a concept reference in reader text: « concept 4 », « concepts 5 et 7b »,
# « annexe A2 » (SPEC.md 4.5).
concept_refs:
  concept: "concept"
  concepts: "concepts"
  and: "et"
  annex: "annexe"

source_types:
  primary: "primaire"
  secondary: "secondaire"
  marketing: "marketing"

# Headings of the learner memory files; those of templates/learner/.
memory_headings:
  next_step: "Prochaine étape"
  concepts: "Concepts"
  announced: "Points annoncés pour plus tard"
  journal: "Journal"
  levers: "Leviers"
  vigilances: "Vigilances actives"
  acquired: "Acquis"
  preferences: "Préférences"

# Concept statuses in `learner/parcours.md`.
status:
  validated: "validé"
  in_progress: "en cours"
  skipped: "sauté"
  to_review: "à revoir"

# Line formats written to learner memory and to the commit messages.
memory:
  observation_line: "date, [concept], fait : action"
  acquired_line: "[concept] fait (date)"
  profile_line: "- {label} : {answer}"
  journal_line: "{date}, session {k} : {events}."  # date YYYY-MM-DD
  minirecap_entry: "mini-récap {from}-{to}"
  commit_message: "{nickname} : {what}"
  commit_validated: "concept {n} validé"
  commit_stop: "arrêt"
  onboarding: "accueil"

# `rules`: what the teacher does, as a clause of a sentence (no final period). `banned`: the
# characters course text never uses, the em-dash and the arrows (the ASCII `->`, `<-` and `=>` included).
typography:
  rules: "espace avant « : », « ; », « ? » et « ! » ; guillemets « »"
  banned: ["—", "→", "←", "↔", "↑", "↓", "↕", "↗", "↘", "↖", "↙", "↦", "↳", "↪", "⇒", "⇐", "⇔", "⇨", "⟶", "⟵", "⟷", "⟹", "⟸", "⟺", "➜", "➔", "➝", "➞", "➡", "⬅", "⬆", "⬇", "->", "<-", "=>"]

# Words a domain paragraph's first sentence does not open with (`domain-first-sentence-standalone`,
# a quality check; optional).
checks:
  anaphora: ["Il", "Elle", "Ils", "Elles", "Ce", "Cet", "Cette", "Ces", "Puis", "Celui", "Celle", "Ceux", "Celles", "Cela", "Ça"]

