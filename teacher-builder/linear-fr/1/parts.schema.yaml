# The shape of what render-parts prints (README.md, this folder): the five parts of
# composition.yaml (this folder) rendered as text for one course, the contract between the
# rendering of the teacher implementation of linear-fr@1 and build-teacher, which validates the
# document against this schema before it writes a classroom. Every text is final: no {group.key}, {course.<name>} nor {classroom.<name>} is left;
# a slot without a dot ({n}, {title}) is the teacher's to fill and stays.
$schema: https://json-schema.org/draft/2020-12/schema
title: the rendered parts of composition.yaml
type: object
required: [spec, permanent, moments, learner_templates, permissions, params]
additionalProperties: false
properties:
  spec:
    description: "<name>@<MAJOR>: the spec MAJOR that rendered the parts"
    type: string
    pattern: '^linear-fr@1$'
  permanent:
    description: the part permanent, present at every message of the teacher
    type: object
    required: [instructions, posture, course_map]
    additionalProperties: false
    properties:
      instructions:
        description: every group of instructions.yaml no moment loads, in its order, each under its heading with its purpose, then its instructions, never their serves (Markdown)
        $ref: '#/$defs/text'
      posture:
        description: the paragraph of the course's plan.md under its onboarding heading
        $ref: '#/$defs/text'
      course_map:
        description: the course map, a file of the classroom's root that CLAUDE.md imports
        type: object
        required: [file, text]
        additionalProperties: false
        properties:
          file:
            description: its name at the classroom's root
            type: string
            pattern: '^[a-z0-9-]+\.md$'
          text:
            description: each domain, its title, objective and file, then its concepts; then the annexes under a heading of their own; each concept and annex with its title, objective, prerequisites, folder and files and its « L'essentiel » verbatim; then the other course files, as paths in the classroom's course/ (Markdown)
            $ref: '#/$defs/text'
  moments:
    description: the part on-demand, one entry per moment of composition.yaml, in its order
    type: array
    minItems: 1
    items:
      type: object
      required: [id, when, draws, slots, instructions]
      additionalProperties: false
      properties:
        id:
          description: the moment's id in composition.yaml
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        when:
          description: when the moment comes, from its `when`
          $ref: '#/$defs/text'
        draws:
          description: what the moment reads, from the course and learner memory
          type: array
          items:
            type: object
            required: [path, what]
            additionalProperties: false
            properties:
              path:
                description: the path in the classroom, under course/ or learner/, a slot of `slots` included
                type: string
                pattern: '^(course|learner)/'
              what:
                $ref: '#/$defs/text'
              text:
                description: the section of the course file under the heading the draw names, given so that the moment needs no read; present when the draw names a heading of a course file whose path holds no slot
                $ref: '#/$defs/text'
        slots:
          description: the slots the paths of `draws` hold (<dir>, <file>), each with what it stands for
          type: array
          items:
            type: object
            required: [slot, meaning]
            additionalProperties: false
            properties:
              slot:
                type: string
                pattern: '^<[a-z]+>$'
              meaning:
                $ref: '#/$defs/text'
        instructions:
          description: the groups of instructions the moment loads, each under its heading with its purpose, then its instructions, never their serves (Markdown); empty when the moment loads no group
          type: string
          not:
            $ref: '#/$defs/placeholder'
  learner_templates:
    description: the part learner-memory, the learner templates, each the text learner memory starts from
    type: array
    minItems: 1
    items:
      type: object
      required: [name, text]
      additionalProperties: false
      properties:
        name:
          description: the file name in learner/
          type: string
          pattern: '^[a-z0-9-]+\.md$'
        text:
          type: string
  permissions:
    description: the part permissions, folders of the classroom
    type: object
    required: [writable, read_only, commit, push]
    additionalProperties: false
    properties:
      writable:
        description: the folders the teacher may write
        $ref: '#/$defs/folders'
      read_only:
        description: the folders the teacher never writes
        $ref: '#/$defs/folders'
      commit:
        description: whether what is written is committed to the classroom's git
        type: boolean
      push:
        description: whether the classroom's git may be pushed
        type: boolean
  params:
    description: the parameters the rendering used
    type: object
    required: [course, classroom]
    additionalProperties: false
    properties:
      course:
        description: the course parameters, from course.yaml (those instructions.yaml cites), and the course id
        type: object
        required: [id, title, domain_count, storyline, glossary]
        additionalProperties: false
        properties:
          id: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
          title: { $ref: '#/$defs/text' }
          domain_count: { type: string, pattern: '^\d+$' }
          storyline: { $ref: '#/$defs/text' }
          glossary: { $ref: '#/$defs/text' }
      classroom:
        description: the classroom parameters (those instructions.yaml cites), « (site non publié) » with no site address, and the channel
        type: object
        required: [site_url, domains_url, storyline_url, domain_url, concept_url, diagram_url, channel]
        additionalProperties: false
        properties:
          site_url: { $ref: '#/$defs/text' }
          domains_url: { $ref: '#/$defs/text' }
          storyline_url: { $ref: '#/$defs/text', description: "the storyline page, <base>fil-rouge/" }
          domain_url: { $ref: '#/$defs/text' }
          concept_url: { $ref: '#/$defs/text' }
          diagram_url: { $ref: '#/$defs/text', description: "a diagram on its concept page, <base>concepts/{nn}/#schema-{file}, {file} its file name without .svg" }
          channel: { $ref: '#/$defs/text' }
$defs:
  placeholder:
    description: a text that keeps a placeholder of the spec, {group.key}
    type: string
    pattern: '\{[a-z_]+\.[a-z_]+\}'
  text:
    type: string
    minLength: 1
    not:
      $ref: '#/$defs/placeholder'
  folders:
    type: array
    items:
      type: string
      pattern: '^[a-z0-9-]+/$'
