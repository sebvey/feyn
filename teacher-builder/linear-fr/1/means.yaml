# The means of the teacher implementation of linear-fr@1 that have no text of their own, each with
# the protocol rules it serves, and the protocol rules left with no means on purpose. The means
# written as text are the instructions of instructions.yaml (this folder), each with its own
# `serves`. teacher-builder/test-build reads both files and the spec's protocol rules
# (product-lines/linear-fr/1/products/teacher/rules.yaml): every slug a `serves` names is a
# protocol rule; every protocol rule is served by a means or listed under `declared`; no means has
# an empty `serves`. The frame, the teacher template CLAUDE.template.md (this folder), and the
# loading by moment of composition.yaml are how the means reach the teacher, not means: they serve
# no rule of their own.
#
# A means: `id` (a slug, unique here and in instructions.yaml), `kind`, `source` (the file or the
# setting), `serves` (never empty). `kind`, one of:
#   template    a learner template, the form learner memory starts from
#   permission  a setting of the classroom that allows or forbids an act
#   hook        a command Claude Code runs at an event of the session (none yet)
#   script      a program the teacher runs (none yet)
#   build       a preparation at build time, given to the teacher in its CLAUDE.md or a skill
# A rule left with no means on purpose, under `declared`: `rule` (its slug), `reason`, `decided`
# (`by`, who decided it, and `date`).
means:
  - id: learner-templates
    kind: template
    source: templates/learner/
    serves: [profile-written, concept-status-written, cases-and-recaps-written, observations-written, preferences-written, memory-holds-the-resume]
  - id: course-read-only
    kind: permission
    source: "composition.yaml, part permissions: course/ en lecture seule (settings.json denies Edit and Write under course/)"
    serves: [course-never-changed]
  - id: learner-writable-committed
    kind: permission
    source: "composition.yaml, part permissions: learner/ peut s'écrire, se commite, ne se pousse jamais (settings.json allows git add learner/ and git commit, denies git push)"
    serves: [saved-at-the-latest]
  - id: learner-memory-at-start
    kind: build
    source: "CLAUDE.template.md: learner/apprenant.md and learner/observations.md imported at the start of every session"
    serves: [new-or-returning-learner, profile-used, observations-used]
  - id: posture-given
    kind: build
    source: "render-parts, permanent.posture: the posture paragraph of plan.md in CLAUDE.md"
    serves: [teacher-posture-from-plan]
  - id: course-map-given
    kind: build
    source: "render-parts, permanent.course_map, written by build-teacher to carte-du-cours.md at the classroom's root and imported by @ in CLAUDE.md (CLAUDE.template.md): the storyline, its title, file and the text under its H1 (the world and the learner's role in it); each domain, its title, objective and file, then its concepts; the annexes as annexes; each concept and annex with its title, number, objective, prerequisites, folder and files and its « L'essentiel »; the other course files"
    serves: [onboarding-closing-sentence, onboarding-ready-message, domain-title-link, concept-title-link, concept-reference-form, resume-on-greeting, missing-prerequisite-told, later-concept-acknowledged, annex-unit-offered, course-end]
  - id: onboarding-questions-given
    kind: build
    source: "composition.yaml, moment onboarding: the onboarding questions of plan.md written into the skill feyn-teacher-onboarding"
    serves: [onboarding-questions-order, says-before-waiting]
  - id: site-addresses-given
    kind: build
    source: "render-parts, params.classroom: the site addresses filled into the instructions from --site-url"
    serves: [first-message-site-and-requests, descriptive-site-links, onboarding-ready-message, validated-concept-page-link, domain-title-link, concept-title-link, resume-on-greeting, diagram-not-displayable]

declared:
  - rule: course-language-typography
    reason: >-
      No means up front: the maintainer's teaching session on the bench course sees first whether
      the teacher holds the typography of the spec unaided, French spaces and quotes, no em-dash
      and no arrow; a means comes (an instruction, or a hook that rereads a message before it is
      sent) if it does not.
    decided:
      by: the maintainer
      date: "2026-11-09"
