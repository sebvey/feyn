<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="currentColor" role="img" aria-labelledby="gateau-titre gateau-desc" font-family="system-ui, sans-serif" font-size="15">
  <title id="gateau-titre">Le gâteau en couches : une tranche horizontale contre trois tranches verticales</title>
  <desc id="gateau-desc">Un gâteau de quatre couches empilées : l'ingestion en bas, puis la transformation, les données prêtes, et la restitution en haut. La couche de transformation, prise en entier, est grisée : couche entière. Trois tranches verticales, tranche 1, tranche 2 et tranche 3, traversent chacune les quatre couches de haut en bas. Une clé nomme les deux formes.</desc>

  <g id="9a1-gateau-ingestion">
    <rect class="muted" x="160" y="210" width="310" height="50" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text class="muted" x="148" y="240" text-anchor="end">Ingestion</text>
  </g>

  <g id="9a1-gateau-transformation">
    <rect class="muted" x="160" y="160" width="310" height="50" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text class="muted" x="148" y="190" text-anchor="end">Transformation</text>
  </g>

  <g id="9a1-gateau-donnees-pretes">
    <rect class="muted" x="160" y="110" width="310" height="50" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text class="muted" x="148" y="140" text-anchor="end">Données prêtes</text>
  </g>

  <g id="9a1-gateau-restitution">
    <rect class="muted" x="160" y="60" width="310" height="50" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <text class="muted" x="148" y="90" text-anchor="end">Restitution</text>
  </g>

  <g id="9a1-couche-entiere">
    <rect class="secondary" x="160" y="160" width="310" height="50" fill="currentColor" fill-opacity="0.3" stroke="none"/>
    <path class="secondary" d="M478 162 H484 V208 H478" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
    <text class="muted" x="490" y="190">couche entière</text>
  </g>

  <g id="9a1-part-1">
    <rect class="primary" x="190" y="54" width="50" height="212" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="3"/>
    <text class="primary" x="215" y="42" text-anchor="middle">tranche 1</text>
  </g>

  <g id="9a1-part-2">
    <rect class="primary" x="290" y="54" width="50" height="212" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="3"/>
    <text class="primary" x="315" y="42" text-anchor="middle">tranche 2</text>
  </g>

  <g id="9a1-part-3">
    <rect class="primary" x="390" y="54" width="50" height="212" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="3"/>
    <text class="primary" x="415" y="42" text-anchor="middle">tranche 3</text>
  </g>

  <g id="9a1-cle-gateau">
    <rect class="secondary" x="40" y="300" width="44" height="16" fill="currentColor" fill-opacity="0.3" stroke="none"/>
    <text class="muted" x="100" y="313">tranche horizontale : ne sert pas seule</text>
    <rect class="primary" x="53" y="334" width="18" height="34" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="3"/>
    <text class="muted" x="100" y="356">tranche verticale : un peu de chaque couche, sert seule</text>
  </g>
</svg>
