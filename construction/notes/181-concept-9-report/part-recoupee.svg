<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 416" fill="currentColor" role="img" aria-labelledby="part-recoupee-titre part-recoupee-desc" font-family="system-ui, sans-serif">
  <title id="part-recoupee-titre">Une part trop grosse, recoupée</title>
  <desc id="part-recoupee-desc">En haut, une large part en quatre couches : une vue des vélos en panne, trop grosse pour un sprint. Trois flèches la recoupent en trois morceaux. À gauche, le morceau a, une part étroite et pleine qui traverse les quatre couches ; sous lui, D de SPIDR (Cohn) ou Variations in Data (Lawrence). Au milieu, le morceau b, la table des signalements : une seule couche remplie sur toute la largeur, la deuxième en partant du haut, les trois autres vides ; sous lui, une couche, pas une tranche : pas de patron. À droite, le morceau c, une part étroite et pleine qui traverse les quatre couches ; sous lui, R de SPIDR (Cohn), assouplir d'abord une règle.</desc>

  <g id="9b1-part-trop-grosse" class="muted">
    <text x="300" y="30" font-size="15" text-anchor="middle">Une vue des vélos en panne : trop gros pour un sprint</text>
    <rect x="150" y="44" width="300" height="16" fill-opacity="0.15" stroke="currentColor" stroke-opacity="0.5"/>
    <rect x="150" y="62" width="300" height="16" fill-opacity="0.15" stroke="currentColor" stroke-opacity="0.5"/>
    <rect x="150" y="80" width="300" height="16" fill-opacity="0.15" stroke="currentColor" stroke-opacity="0.5"/>
    <rect x="150" y="98" width="300" height="16" fill-opacity="0.15" stroke="currentColor" stroke-opacity="0.5"/>
  </g>

  <g id="9b1-recoupe-en-trois" class="muted" opacity="0.6">
    <line x1="240" y1="120" x2="117.65" y2="157.65" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="110,160 118.83,161.47 116.47,153.83"/>
    <line x1="300" y1="120" x2="300" y2="152" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="300,160 296,152 304,152"/>
    <line x1="360" y1="120" x2="482.35" y2="157.65" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="490,160 481.17,161.47 483.53,153.83"/>
  </g>

  <g id="9b1-quatre-couches" class="muted">
    <rect x="20" y="168" width="160" height="28" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5"/>
    <rect x="20" y="199" width="160" height="28" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5"/>
    <rect x="20" y="230" width="160" height="28" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5"/>
    <rect x="20" y="261" width="160" height="28" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5"/>
    <rect x="220" y="168" width="160" height="28" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5"/>
    <rect x="220" y="199" width="160" height="28" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5"/>
    <rect x="220" y="230" width="160" height="28" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5"/>
    <rect x="220" y="261" width="160" height="28" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5"/>
    <rect x="420" y="168" width="160" height="28" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5"/>
    <rect x="420" y="199" width="160" height="28" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5"/>
    <rect x="420" y="230" width="160" height="28" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5"/>
    <rect x="420" y="261" width="160" height="28" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5"/>
  </g>

  <g id="9b1-morceau-a" class="primary">
    <rect x="65" y="168" width="70" height="28"/>
    <rect x="65" y="199" width="70" height="28"/>
    <rect x="65" y="230" width="70" height="28"/>
    <rect x="65" y="261" width="70" height="28"/>
    <text x="100" y="318" font-size="15" font-weight="600" text-anchor="middle"><tspan x="100">a. les stations</tspan><tspan x="100" dy="18">du centre-ville seulement</tspan></text>
  </g>

  <g id="9b1-morceau-b">
    <rect class="secondary" x="220" y="199" width="160" height="28" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/>
    <text class="muted" x="300" y="318" font-size="15" text-anchor="middle"><tspan x="300">b. la table</tspan><tspan x="300" dy="18">des signalements</tspan></text>
  </g>

  <g id="9b1-morceau-c" class="primary">
    <rect x="465" y="168" width="70" height="28"/>
    <rect x="465" y="199" width="70" height="28"/>
    <rect x="465" y="230" width="70" height="28"/>
    <rect x="465" y="261" width="70" height="28"/>
    <text x="500" y="318" font-size="15" font-weight="600" text-anchor="middle"><tspan x="500">c. les vélos signalés,</tspan><tspan x="500" dy="18">confirmés ou non</tspan></text>
  </g>

  <g id="9b2-patron-du-morceau-a" class="muted">
    <text x="100" y="368" font-size="14" text-anchor="middle">D de SPIDR (Cohn)</text>
    <text x="100" y="386" font-size="14" text-anchor="middle"><tspan x="100">ou Variations in Data</tspan><tspan x="100" dy="18">(Lawrence)</tspan></text>
  </g>

  <g id="9b1-sans-patron" class="muted">
    <text x="300" y="368" font-size="14" text-anchor="middle">une couche</text>
    <text x="300" y="386" font-size="14" text-anchor="middle"><tspan x="300">pas une tranche :</tspan><tspan x="300" dy="18">pas de patron</tspan></text>
  </g>

  <g id="9b2-patron-du-morceau-c" class="muted">
    <text x="500" y="368" font-size="14" text-anchor="middle">R de SPIDR (Cohn)</text>
    <text x="500" y="386" font-size="14" text-anchor="middle"><tspan x="500">assouplir d'abord</tspan><tspan x="500" dy="18">une règle</tspan></text>
  </g>
</svg>
