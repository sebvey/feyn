# The fields of course.yaml, to which course/README.md section 2 and `course_map` of
# course/form.yaml point: those of the course, of a domain entry and of a concept entry, their
# presence and their form. course.yaml is the map, nothing below a concept: the tree of a concept
# is the headings of its concept.md (section 3; decision course-map-and-concept-tree); nor whom
# the course is for, which « Public cible » of plan.md says. course-yaml validates course.yaml
# against this schema through Ajv2020. What the schema does not say (unique numbers, course order, the
# partition into domains, paths that exist) is a rule of course/rules.yaml, verified by
# course-yaml.
$schema: https://json-schema.org/draft/2020-12/schema
title: course.yaml
type: object
required: [id, spec, title, site, storyline, glossary, domains, concepts]
additionalProperties: false
properties:
  id:
    description: the course id, lowercase ASCII words joined by hyphens, equal to the folder name
    $ref: '#/$defs/slug'
  spec:
    description: "linear-course@<MAJOR>: the spec MAJOR the course follows"
    type: string
    pattern: '^linear-course@\d+$'
  title:
    description: the course title
    $ref: '#/$defs/text'
  subtitle:
    description: one line under the title on the site
    $ref: '#/$defs/text'
  site:
    description: >-
      how the course looks on its site, never whether it has one: every course has a site; the
      logo is no key here, it is the file logo.svg at the root of the course folder
    type: object
    required: [accent_color]
    additionalProperties: false
    properties:
      accent_color:
        description: >-
          the course's accent colour, one #rrggbb: the site paints the logo in it and derives from
          its hue the accent of each theme, with its own lightness
        type: string
        pattern: '^#[0-9a-fA-F]{6}$'
  storyline:
    description: path of the storyline file
    const: storyline.md
  glossary:
    description: path of the course glossary
    const: glossary.md
  domains:
    description: the domains, in course order
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/domain'
  concepts:
    description: every numbered concept and annex, in course order
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/concept'
  annexes:
    description: numbers of the concepts that are annexes; absent means none
    type: array
    items:
      type: string
      pattern: '^A\d+$'
$defs:
  text:
    type: string
    pattern: '\S'
  slug:
    description: lowercase ASCII words joined by hyphens
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
  minutes:
    description: minutes of conversation with the teacher, low estimate
    type: integer
    minimum: 1
  concept-number:
    description: >-
      0, 1... for a numbered concept, A1, A2... for an annex; an unquoted integer is read as
      its decimal string
    anyOf:
      - type: integer
        minimum: 0
      - type: string
        pattern: '^(\d+|A\d+)$'
  domain:
    type: object
    required: [number, slug, title, objective, duration_min, file, concepts]
    additionalProperties: false
    properties:
      number:
        description: integer; the domains are numbered 1, 2, 3... in list order
        type: integer
        minimum: 1
      slug:
        $ref: '#/$defs/slug'
      title:
        description: the domain title
        $ref: '#/$defs/text'
      objective:
        description: what the learner can do at the end of the domain, one sentence
        $ref: '#/$defs/text'
      duration_min:
        $ref: '#/$defs/minutes'
      file:
        description: "domains/<number>-<slug>.md"
        type: string
        pattern: '^domains/\d+-[a-z0-9]+(-[a-z0-9]+)*\.md$'
      concepts:
        description: the numbers of the domain's concepts, in course order
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/concept-number'
  concept:
    type: object
    required: [number, slug, title, objective, prerequisites, dir]
    additionalProperties: false
    properties:
      number:
        $ref: '#/$defs/concept-number'
      slug:
        $ref: '#/$defs/slug'
      title:
        description: the concept title
        $ref: '#/$defs/text'
      objective:
        description: what the learner can do after the concept, one sentence
        $ref: '#/$defs/text'
      prerequisites:
        description: numbers of the concepts the learner must have validated first; [] for none
        type: array
        items:
          $ref: '#/$defs/concept-number'
      duration_min:
        $ref: '#/$defs/minutes'
      dir:
        description: "concepts/<NN>-<slug>, NN the number on two digits; an annex keeps its number"
        type: string
        pattern: '^concepts/(\d{2,}|A\d+)-[a-z0-9]+(-[a-z0-9]+)*$'
