# The rules of a course of linear-course (decisions rules-with-level-and-method and
# spec-files-by-product): every rule of a course, those the checks verify, taught-check
# included, and those verified by inspection, the review; one group per section or sub-section
# of course/README.md that points to rules, in its order (section 6 points to the groups of 6.1 and
# 6.2; section 7 states no rule of a course). A course conforms when it holds every requirement of
# this file, whatever its method (spec-directives/1/README.md section 2). The tables of fields are
# the schemas of course/schemas/, each one rule here (decision field-tables-as-schemas).
#
# A group: title, purpose (what the group is for), category and method (declared once for its
# rules; a rule may override them), rules. A rule: id (a slug), level, category, method, check
# (the check that implements the method, when one exists), text, why (optional: what a competent
# model does without the rule, as observed). The texts are French, the language of the spec
# (decision language-policy).
# check-spec (rule-files) verifies this file.
groups:
  - title: Le dossier du cours (course/README.md section 1)
    purpose: >-
      L'arborescence dont un cours est fait : chaque build et chaque check trouve un fichier par
      sa place dans cette arborescence, et la section que chaque ligne nomme donne la forme du
      fichier.
    category: structure
    method: test
    rules:
      - id: course-yaml-present
        level: requirement
        check: course-yaml
        text: "`course.yaml` doit exister à la racine du dossier du cours."
      - id: course-files-present
        level: requirement
        check: course-files
        text: "`plan.md`, `glossary.md`, `storyline.md` et `CHANGELOG.md` doivent exister."
      - id: course-decisions-folder
        level: permission
        method: inspection
        text: >-
          Un cours peut avoir un dossier `decisions/`, ses propres décisions ; aucun build ne le
          lit.
      - id: plain-markdown
        level: requirement
        category: writing
        check: conventions
        text: >-
          Le Markdown d'un cours doit être du CommonMark simple : pas de HTML, pas d'`import` ni
          d'`export` MDX, pas de directive `:::` ; un fichier de concept n'a pas de titre plus
          profond que `####`, et un titre `####` est un bloc d'une unité ou un cas supplémentaire,
          dans une unité (son seul H1, son titre, est la règle `concept-file-title`).
      - id: no-banned-character
        level: recommendation
        category: writing
        check: typography
        text: >-
          Il convient que le texte d'un cours n'emploie pas les caractères interdits du lexique
          (`typography.banned`).

  - title: Le fichier course.yaml (course/README.md section 2)
    purpose: >-
      La carte du cours : son identité, ses domaines, ses concepts dans l'ordre du cours avec
      leurs prérequis, rien sous le concept (l'arbre d'un concept est dans les titres de son
      `concept.md`), et les identifiants que citent la mémoire de l'apprenant et les adresses du
      site.
    category: structure
    method: test
    rules:
      - id: course-yaml-valid-against-schema
        level: requirement
        check: course-yaml
        text: >-
          `course.yaml` doit être valide selon `course/schemas/course.schema.yaml` : les champs
          du cours, d'une entrée de domaine et d'une entrée de concept, leur présence et leur
          forme ; une entrée de concept ne tient ni les sections ni les unités du concept.
      - id: course-id-equals-folder
        level: requirement
        check: course-yaml
        text: L'`id` du cours doit être égal au nom de son dossier.
      - id: course-yaml-paths-exist
        level: requirement
        check: course-yaml
        text: >-
          Les chemins de `course.yaml` doivent exister dans le dossier du cours : `site.icon`,
          `storyline`, `glossary`, le `file` de chaque domaine et le `dir` de chaque concept.
      - id: domain-file-named-by-number
        level: requirement
        check: course-yaml
        text: >-
          Le `file` d'un domaine doit être `domains/<number>-<slug>.md`, de son propre numéro et
          de son propre slug.
      - id: domains-numbered-in-order
        level: requirement
        check: course-yaml
        text: Les domaines doivent être numérotés 1, 2, 3… dans l'ordre de la liste.
      - id: concept-dir-named-by-number
        level: requirement
        check: course-yaml
        text: >-
          Le `dir` d'un concept doit être `concepts/<NN>-<slug>`, `NN` son numéro sur deux
          chiffres ; une annexe garde son numéro (`concepts/A1-<slug>`).
      - id: course-identifiers-unique
        level: requirement
        check: course-yaml
        text: Les numéros de concept doivent être uniques.
      - id: concepts-in-course-order
        level: requirement
        check: course-yaml
        text: >-
          Les concepts doivent venir dans l'ordre du cours : les concepts numérotés par numéro
          croissant, puis les annexes.
      - id: concept-in-one-domain
        level: requirement
        check: course-yaml
        text: >-
          Chaque concept numéroté doit appartenir à exactement un domaine, et un domaine ne doit
          lister que des concepts de `concepts`.
      - id: domain-concepts-consecutive
        level: requirement
        check: course-yaml
        text: >-
          Les concepts de chaque domaine doivent être consécutifs et suivre ceux du domaine
          précédent.
      - id: annexes-in-no-domain
        level: requirement
        check: course-yaml
        text: Les annexes ne doivent appartenir à aucun domaine.
      - id: annexes-are-a-numbers
        level: requirement
        check: course-yaml
        text: "`annexes` doit lister exactement les numéros `A` des concepts."
      - id: prerequisite-comes-earlier
        level: requirement
        check: course-yaml
        text: >-
          Un prérequis doit être un concept numéroté existant qui vient avant (n'importe quel
          concept numéroté pour une annexe).
      - id: concept-folders-listed
        level: requirement
        check: course-yaml
        text: Chaque dossier de `concepts/` doit être le `dir` d'une entrée de concept.
      - id: summaries-in-one-sentence
        level: requirement
        category: writing
        method: inspection
        text: >-
          L'`objective` d'un domaine et l'`objective` d'un concept doivent tenir chacun en une
          phrase.

  - title: Le dossier de concept (course/README.md section 3)
    purpose: >-
      Les fichiers dont un concept est fait, son titre et l'arbre du concept, ses sections et ses
      unités, que tiennent les titres de `concept.md`, chacun ouvert par son type : chaque concept
      est une source, que le site construit et que le professeur lit, sans réécriture, et qu'un
      humain qui l'ouvre lit sans connaître la spec.
    category: structure
    method: test
    rules:
      - id: concept-folder-files
        level: requirement
        check: concept-file
        text: >-
          Un dossier de concept doit tenir `concept.md`, `sources.md` et ses schémas `.svg`, et
          rien d'autre (`folder` de `course/form.yaml`).
      - id: concept-file-title
        level: requirement
        check: concept-file
        text: >-
          `concept.md` doit s'ouvrir sur son titre, son seul titre `#`, `# Concept <n> : <titre>`
          (une annexe, `# Annexe <id> : <titre>`, les mots `block_kinds.concept` et
          `block_kinds.annex` du lexique), le titre celui que `course.yaml` donne au concept, qui le
          garde aussi.
      - id: tree-ids-in-order
        level: requirement
        check: concept-file
        text: >-
          L'id d'une section, dans son titre `##` de `concept.md`, doit être le numéro du concept
          suivi d'une lettre, à partir de `a`, dans l'ordre ; l'id d'une unité d'une section, dans
          son titre `###`, l'id de la section suivi d'un chiffre, à partir de `1`, dans l'ordre :
          neuf unités au plus.
      - id: section-has-a-unit
        level: requirement
        check: concept-file
        text: >-
          Une section doit tenir au moins une unité, un titre `###`, même quand elle n'en a
          qu'une : une section n'est jamais elle-même une unité, et un type est toujours au même
          niveau.
      - id: tree-ids-unique
        level: requirement
        check: concept-file
        text: Les ids de section et d'unité doivent être uniques dans le cours.
      - id: heading-has-a-title
        level: requirement
        check: concept-file
        text: >-
          Le titre d'une section ou d'une unité doit commencer par son type, le mot
          `block_kinds.section` ou `block_kinds.unit` du lexique, puis tenir son id et un titre,
          séparés par « : » : `## Section <id> : <titre>`, `### Unité <id> : <titre>`.
      - id: unit-fits-one-message
        level: recommendation
        category: pedagogy
        method: inspection
        text: >-
          Il convient qu'une unité, un titre `### Unité <id> : <titre>`, tienne en un message du
          professeur avec sa question.

  - title: Le frontmatter de concept.md (course/README.md section 3.1)
    purpose: >-
      Ce que le concept déclare en tête de `concept.md` : ses positions et ses voisins, chacun
      sourcé dans son propre élément, la preuve à côté de ce qu'elle prouve, et ses schémas,
      chacun à son unité.
    category: structure
    method: test
    rules:
      - id: concept-frontmatter-valid-against-schema
        level: requirement
        check: concept-file
        text: >-
          Le frontmatter de `concept.md` doit être valide selon
          `course/schemas/concept-frontmatter.schema.yaml` : ses clés, un élément et une entrée de
          schéma, leur présence et leur forme.
      - id: item-text-inline-markdown
        level: requirement
        check: concept-file
        text: >-
          Le `text` d'un élément du frontmatter doit être du Markdown en ligne : gras et italique
          seulement.
      - id: stance-item-has-author
        level: recommendation
        category: sources
        method: inspection
        text: >-
          Il convient qu'un élément de `stances.consensus` ou de `stances.school` ait un
          `author` : le texte ou l'auteur à qui l'affirmation appartient.
      - id: verified-parallel-to-refs
        level: requirement
        check: concept-file
        text: >-
          Le `verified` d'un élément doit être présent quand `refs` n'est pas vide et absent
          sinon : une liste parallèle à `refs`, une entrée par référence, dans le même ordre.
      - id: item-verified-quotes-source
        level: requirement
        category: sources
        method: inspection
        text: >-
          Chaque entrée de `verified` doit être la plus courte citation qui établit l'élément,
          entre « », puis sa place entre parenthèses, comme la cellule de vérification d'une ligne
          de « Affirmations ».
      - id: no-stances-section
        level: requirement
        check: concept-file
        text: >-
          Le corps de `concept.md` ne doit pas avoir de section de positions : `stances` et
          `neighbors` sont le seul endroit des positions et des voisins du concept.
        why: >-
          Sans elle, la migration écrivait les positions deux fois, dans le frontmatter et dans
          une section du corps, et les deux copies divergeaient (prototype du concept 9 ; décision
          stances-in-frontmatter-only).
      - id: published-text-stance-markers
        level: permission
        category: writing
        method: inspection
        text: >-
          Un champ publié peut marquer une affirmation d'un marqueur de position, en plus des
          positions du frontmatter.
      - id: diagrams-declared-and-present
        level: requirement
        category: diagrams
        check: drawing-contract
        text: >-
          Chaque fichier de schéma déclaré doit exister, son `unit` doit être l'id d'une unité du
          concept, et chaque SVG du dossier doit être déclaré.

  - title: Le corps de concept.md (course/README.md section 3.2)
    purpose: >-
      Le concept en un fichier, dans un ordre fixe : son titre ; sa tête, « Ouverture », qui tient
      « L'essentiel », le résumé écrit du concept ; ses sections et leurs unités, une par message
      du professeur ; son pied, « Clôture », qui tient « Se vérifier » et l'approfondissement que
      le site publie, puis la consigne du concept, que seul le professeur lit. L'objectif et les
      pièges du concept n'y sont pas écrits : le build les compose, depuis `course.yaml` et depuis
      les « Pièges » de ses unités.
    category: pedagogy
    method: inspection
    rules:
      - id: concept-parts-in-order
        level: requirement
        category: structure
        method: test
        check: concept-file
        text: >-
          Le corps de `concept.md` doit être, après son titre et dans cet ordre, sa tête, ses
          sections, puis son pied ; la tête et le pied sont chacun un titre `##`, « Ouverture » et
          « Clôture » (`headings.head` et `headings.foot` du lexique), qui ne tient que ses blocs,
          des titres `###` dont le texte est le titre du lexique, présents ou au choix comme
          `concept_file` de `course/form.yaml` le dit (la tête, « L'essentiel » ; le pied, « Se
          vérifier », « Approfondissement » et « Consigne », chacun au choix, « Clôture » présente
          quand elle en tient un) ; aucune autre section `##` ne doit exister, ni l'objectif ni les
          pièges, que le build compose.
      - id: concept-has-sections
        level: requirement
        category: structure
        method: test
        check: concept-file
        text: >-
          `concept.md` doit tenir au moins une section, et un titre `###` n'existe que dans une
          section, une unité de cette section, ou dans la tête et le pied, l'un de leurs blocs :
          les titres de `concept.md` sont l'arbre du concept.
      - id: essentials-define-concept
        level: requirement
        text: >-
          « L'essentiel » doit donner la définition du concept et ce qui la rend importante, en
          quelques lignes : c'est le seul résumé écrit du concept.
      - id: landmarks-whole-concept
        level: requirement
        text: >-
          « Se vérifier » du pied doit porter sur le concept entier : la question que l'apprenant
          se pose pour vérifier sa réponse, ce qui sert à reconnaître ou à appliquer le concept.
      - id: deepening-beyond-units
        level: requirement
        text: >-
          « Approfondissement » doit tenir de la matière en plus sur le concept, au-delà de ce
          qu'enseignent ses unités, pour l'apprenant qui demande à aller plus loin.
      - id: no-unit-relies-on-deepening
        level: requirement
        text: >-
          Aucune unité ni aucun cas supplémentaire ne doit reposer sur « Approfondissement ».
      - id: concept-instruction-content
        level: requirement
        text: >-
          « Consigne » du pied doit tenir ce que la méthode a de propre au concept entier, ce
          qu'aucune unité ne dit pour elle seule ; l'ordre et le découpage du concept sont ses
          sections et ses unités, jamais une consigne.

  - title: L'unité (course/README.md section 3.3)
    purpose: >-
      L'unité est le contenu d'un cours, écrit une fois : un message du professeur, une feuille du
      concept. Elle tient quatre blocs, dans l'ordre où le créateur l'écrit : enseigner, demander,
      prévoir les erreurs, donner la consigne. Sa « Leçon » tient sa matière, ce qui est vrai, les
      mêmes mots pour le site et le professeur, et son ancrage dans le fil rouge ; son « Exercice »,
      sa question et sa réponse attendue ; ses « Pièges », ses idées fausses, chacune avec sa
      correction ; sa « Consigne », ce que la méthode a de propre à l'unité. Puis viennent ses cas
      supplémentaires, « En stock », de rechange quand l'apprenant échoue, d'entraînement pour
      s'exercer ou retrouver un concept validé, d'aparté pour une question fréquente hors du
      parcours. Chaque bloc est publié ou non, une propriété de la spec (`course/form.yaml`) que son
      titre dit par son lecteur, « pour tous » ou « teacher seulement », jamais un choix du cours.
    category: pedagogy
    rules:
      - id: section-holds-its-units
        level: requirement
        method: test
        check: unit-contract
        text: >-
          Une section ne doit rien tenir d'autre que ses titres `###` d'unité et leurs blocs.
      - id: unit-blocks-with-their-reader
        level: requirement
        method: test
        check: unit-contract
        text: >-
          Une unité doit tenir ses blocs `####`, chacun titré par son mot puis son lecteur entre
          parenthèses, dans cet ordre et chacun une fois : `#### Leçon (pour tous)`,
          `#### Exercice (teacher seulement)`, `#### Pièges (pour tous)`, obligatoires, puis
          `#### Consigne (teacher seulement)` au choix ; ses cas supplémentaires viennent après
          (`blocks` de `unit` dans `course/form.yaml`).
        why: >-
          Une unité était une liste de champs étiquetés dont la publication se savait par cœur, et
          un cas ne se distinguait d'une partie de son unité que par sa parenthèse : le titre du
          bloc dit ce que le site publie, et l'ordre des blocs est celui de l'écriture (idée #642,
          epic #647).
      - id: unit-fields-labelled
        level: requirement
        method: test
        check: unit-contract
        text: >-
          « Leçon » et « Exercice » doivent être chacun une liste de champs, chacun ouvert par
          `- **<label>** :`, le libellé l'un des `unit_fields` du lexique ; le texte d'un champ
          suit son libellé, et ses lignes suivantes sont en retrait de deux espaces (paragraphes,
          listes imbriquées). « Pièges » et « Consigne » n'ont pas de libellé : le mot de leur bloc
          en tient lieu.
      - id: no-line-outside-a-field
        level: requirement
        method: test
        check: unit-contract
        text: >-
          Aucune ligne d'une unité ne doit se trouver hors d'un bloc, ni, dans « Leçon » et
          « Exercice », hors d'un champ : le site ne publie que les blocs publiés, et une ligne
          qu'aucun bloc ne porte n'est ni publiée ni lue.
      - id: field-qualifier-on-question-only
        level: requirement
        method: test
        check: unit-contract
        text: >-
          Seul le libellé « Question » peut porter un qualificatif à lui avant les deux-points
          (« **Question**, en deux parties : »).
      - id: unit-fields-present-once
        level: requirement
        method: test
        check: unit-contract
        text: >-
          « Leçon » doit tenir « Matière » et « Ancrage », « Exercice » « Question » et
          « Réponse attendue », « Pièges » une idée fausse au moins, « Consigne », quand l'unité en
          a une, sa prose ; aucun champ deux fois et aucun vide (`fields` de chaque bloc de `unit`
          dans `course/form.yaml`).
      - id: unit-fields-in-order
        level: requirement
        method: test
        check: unit-contract
        text: >-
          Les champs d'un bloc doivent venir dans l'ordre de `course/form.yaml` : « Matière » puis
          « Ancrage » dans « Leçon », « Question » puis « Réponse attendue » dans « Exercice ».
      - id: misconception-form
        level: requirement
        method: test
        check: unit-contract
        text: >-
          « Pièges » doit tenir au moins une idée fausse, chacune `- « <misconception> » :
          <correction>`, et rien d'autre : aucune puce imbriquée sous elle. Dans une unité, ses
          idées fausses sont les puces du bloc ; dans un cas supplémentaire, elles sont imbriquées
          sous son champ `- **Pièges** :`.
      - id: supplementary-case-form
        level: requirement
        method: test
        check: unit-contract
        text: >-
          Un cas supplémentaire doit être un titre `####` après les blocs de son unité,
          `#### En stock, <qualifier> (teacher seulement) : <title>`, le qualificatif seul entre la
          virgule et le lecteur ; sa question est celle que l'unité tient en stock. Ses champs,
          étiquetés, dans cet ordre et tous obligatoires : « Ancrage », « Question », « Réponse
          attendue », « Pièges » (`supplementary_case` de `course/form.yaml`).
      - id: case-qualifier-from-lexicon
        level: requirement
        method: test
        check: unit-contract
        text: Le qualificatif d'un cas supplémentaire doit être une valeur du groupe `qualifiers` du lexique.
      - id: case-titles-unique
        level: requirement
        method: test
        check: unit-contract
        text: Les titres des cas supplémentaires doivent être uniques dans le concept.
      - id: unit-length-under-threshold
        level: recommendation
        method: test
        check: unit-length
        text: >-
          Il convient qu'une unité tienne en 12 lignes au plus de « Matière », « Ancrage » et
          « Question », comptées en lignes de 100 caractères (`length` de `unit` dans
          `course/form.yaml`) : au-delà, elle tient mal en un message.
      - id: unit-field-content
        level: requirement
        method: inspection
        text: >-
          Chaque champ d'une unité doit tenir ce que son libellé, ou le mot de son bloc, annonce :
          « Matière », ce qui est vrai, l'explication telle que le site la publie et que le
          professeur la dit ;
          « Ancrage », la situation du fil rouge où la matière se voit, ses acteurs, ses faits et
          son déroulé (qui dit quoi, quand) ; « Question », la question que pose l'unité ;
          « Réponse attendue », la bonne réponse avec ses nuances, la position du cours telle que la
          matière l'énonce ; « Pièges », les réponses fausses fréquentes, chacune avec sa
          correction ; « Consigne », ce que la méthode a de propre à l'unité (quand poser un cas
          supplémentaire, une formulation qui a marché, un renvoi à ne pas réenseigner).
      - id: course-question-in-instruction
        level: requirement
        method: inspection
        text: >-
          Une question que le cours pose et repose, sa façon propre de faire réfléchir l'apprenant
          (« et alors ? », « d'où vient ce chiffre ? »), doit être écrite dans la « Consigne » de
          son unité, ou dans celle du concept quand elle vaut pour le concept entier, ou dans une
          section libre de `plan.md` quand elle vaut pour le cours entier ; jamais sous une idée
          fausse, qui ne tient que sa correction.
        why: >-
          La forme d'avant tenait sous chaque idée fausse une question de plus, que le professeur
          posait après la correction : sur les 37 d'un cours de deux concepts, environ 22 redisaient la
          correction, environ 11 appliquaient une technique du professeur, environ 5 étaient des
          questions du cours ; le professeur écrit les siennes, et celles du cours se perdaient
          sous une idée fausse (idée #642, epic #647).
      - id: question-within-matter
        level: requirement
        method: inspection
        text: >-
          La question d'une unité et celle de ses cas ne doivent porter que sur ce que sa matière,
          et celle des unités d'avant, énoncent : ce que la matière n'énonce pas est une lacune de
          l'unité, comblée dans sa matière.
      - id: no-restatement-matter-and-cases
        level: requirement
        method: inspection
        text: >-
          La matière d'une unité doit rester générale : elle ne reprend pas la situation de son
          ancrage ni celle d'un de ses cas supplémentaires, et n'énonce pas le verdict de sa
          réponse attendue ; dans l'autre sens, son ancrage, ses questions et ses réponses
          attendues, les siens et ceux de ses cas, ne redisent pas sa matière.
        why: >-
          Sans elle, sur un cours de deux concepts, les douze « Explication » des cas du premier
          concept, dans la forme d'avant les unités, répétaient mot pour mot le texte de son
          `concept.md`, à 37 à 91 %
          (epic #475) ; la règle ne vivait que dans le prompt du workflow `course-batch.js`, retiré
          par #625.
      - id: fallback-case-stands-alone
        level: requirement
        method: inspection
        text: >-
          Un cas de rechange doit se suffire : son propre ancrage et sa propre question, rien
          d'emprunté à la question échouée.
      - id: instruction-contradicts-no-protocol
        level: requirement
        method: inspection
        text: >-
          Une « Consigne », d'une unité ou du concept, ne doit contredire aucune règle du
          protocole : le fichier de concept dit quoi enseigner, le protocole dit comment et quand ;
          une consigne qui contredit une règle est un défaut du concept.
      - id: case-asks-what-was-taught
        level: recommendation
        method: analysis
        check: taught-check
        text: >-
          Il convient qu'une question, d'une unité ou d'un cas, ne demande que ce que l'apprenant a
          appris avant elle, dans le parcours.

  - title: Le fichier sources.md (course/README.md section 3.4)
    purpose: >-
      `sources.md` montre que le concept est fondé, et permet à chacun de remonter d'une
      affirmation de ce que le site publie du concept à ce sur quoi elle repose. « Références » sert d'abord le lecteur
      du site ; « Affirmations » sert l'audit (le relecteur, le mainteneur, le professeur sur
      demande). La traçabilité vaut par sa re-vérification, pas par son volume.
    category: sources
    method: test
    rules:
      - id: claims-hold-no-device
        level: requirement
        method: inspection
        text: >-
          Une ligne de « Affirmations » ne doit porter ni un fait du fil rouge (inventé, dans
          `storyline.md`), ni un procédé d'enseignement (un exemple inventé, la déduction d'un
          cas), ni une formulation du cours.
      - id: stance-sourced-in-item
        level: requirement
        check: sources
        text: >-
          Une position ou un voisin doit être sourcé dans son élément du frontmatter, jamais par
          une ligne de « Affirmations ».
      - id: unpublished-states-nothing-new
        level: requirement
        method: inspection
        text: >-
          Un champ non publié ne doit rien affirmer que les champs publiés n'affirment pas : une
          affirmation qu'il serait seul à faire est une lacune de la matière, ajoutée d'abord à un
          champ publié, ou n'est pas une affirmation à sourcer.
      - id: concept-file-cites-no-reference
        level: requirement
        check: sources
        text: >-
          `concept.md` ne doit citer aucune référence : les références vivent dans les `refs` du
          frontmatter et dans `sources.md`.
      - id: sources-no-introduction
        level: requirement
        check: sources
        text: >-
          `sources.md` ne doit pas avoir d'introduction : il s'ouvre sur « Affirmations ».
      - id: sources-sections-in-order
        level: requirement
        check: sources
        text: >-
          Les sections de `sources.md` doivent être des titres `##` dont le texte est le titre du
          lexique, « Affirmations », « Références », « Non vérifié », dans cet ordre, toutes
          présentes, et aucune autre section `##` ne doit exister.
      - id: sources-no-h1
        level: requirement
        check: sources
        text: "`sources.md` ne doit pas avoir de H1 : le titre est dans `course.yaml`."
      - id: sources-no-frontmatter
        level: requirement
        check: sources
        text: >-
          `sources.md` ne doit pas avoir de frontmatter : le Markdown d'un cours n'a de frontmatter
          YAML que là où la spec le dit.
      - id: sources-tables-five-columns
        level: requirement
        check: sources
        text: >-
          « Affirmations » et « Références » de `sources.md` doivent tenir chacune un tableau de
          cinq colonnes, dans cet ordre : pour « Affirmations », affirmation, section, source,
          vérifié, nature ; pour « Références », id, source, lien, type, consulté le.
      - id: claim-states-claim
        level: requirement
        check: sources
        text: Une ligne de « Affirmations » doit énoncer l'affirmation en quelques mots.
      - id: claim-section-exists
        level: requirement
        check: sources
        text: >-
          La cellule section d'une affirmation doit tenir des ids de section ou d'unité et les
          parties publiées de la tête et du pied par leur valeur du lexique (« L'essentiel »,
          « Se vérifier », « Approfondissement »), séparés par des virgules, jamais le texte d'un
          titre, chacun existant dans `concept.md`.
      - id: claim-source-cell-form
        level: requirement
        check: sources
        text: >-
          La cellule source d'une affirmation doit tenir des ids de référence `[S1]`, séparés par
          des virgules, ou le mot `markers.course` ; rien d'autre : pas de texte libre, pas de
          chemin vers un autre concept.
        why: >-
          Sans elle, l'agent qui écrivait le concept 9 donnait du texte libre pour source,
          « fil rouge » et « aucune » (décision where-a-claim-goes, remplacée par
          sources-trace-the-concept).
      - id: claim-verified-cell-filled
        level: requirement
        check: sources
        text: >-
          La cellule vérifié d'une affirmation ne doit être vide que pour une affirmation
          « cours ».
      - id: claim-verified-cell-form
        level: requirement
        method: inspection
        text: >-
          La cellule vérifié doit tenir, par référence de la cellule source et dans le même
          ordre, la plus courte citation qui établit l'affirmation, entre « », puis sa place
          entre parenthèses (section, page, titre) ; pour une absence, « absent de » et la place
          cherchée ; pour une affirmation « cours », une ligne qui dit d'où elle découle, ou
          rien ; aucun raisonnement, aucune mention de « Non vérifié » : ce qui ne peut être
          cité va dans « Non vérifié ».
      - id: claim-nature-closed
        level: requirement
        check: sources
        text: >-
          La nature d'une affirmation doit être `consensus`, `école`, `cours`
          (`markers.consensus`, `markers.school`, `markers.course`) ou `fait` (`natures.fact`).
      - id: claim-nature-matches-marker
        level: requirement
        method: inspection
        text: >-
          Une affirmation qu'un champ publié marque d'un marqueur de position doit avoir la
          nature de ce marqueur ; une source « cours » doit avoir la nature `cours`.
      - id: reference-id-form
        level: requirement
        check: sources
        text: >-
          L'id d'une référence doit être `S<n>`, suivi au choix d'une lettre minuscule, unique
          dans le concept.
      - id: reference-names-source
        level: requirement
        check: sources
        text: La cellule source d'une référence doit nommer la source (auteur, titre, date).
      - id: reference-description-copied
        level: requirement
        method: inspection
        text: >-
          La description d'une source reprise d'un autre concept doit être copiée à l'identique.
      - id: reference-link-one-url
        level: requirement
        check: sources
        text: >-
          Le lien d'une référence doit être une URL ou vide : une seconde place est une seconde
          référence.
      - id: reference-type-from-lexicon
        level: requirement
        check: sources
        text: >-
          Le type d'une référence doit être un ou plusieurs de `primary`, `secondary`,
          `marketing`, écrits comme les mots du lexique et séparés par des virgules, puis au
          choix une remarque entre parenthèses.
      - id: reference-consulted-date
        level: requirement
        check: sources
        text: La cellule « consulté le » d'une référence doit commencer par `YYYY-MM-DD`.
      - id: references-per-concept
        level: requirement
        method: inspection
        text: >-
          Les références doivent être propres au concept : chaque concept cite les siennes.
      - id: unverified-entry-anchored
        level: requirement
        check: sources
        text: >-
          Chaque entrée de « Non vérifié » doit s'ouvrir sur sa section, sous les formes de la
          colonne section ou `headings.stances`, puis « : ».
      - id: unverified-entry-content
        level: requirement
        method: inspection
        text: >-
          « Non vérifié » doit être une liste, vide au besoin ; chaque entrée dit, après sa
          section, ce qu'aucune source consultée ne confirme, pourquoi et, au besoin, la consigne
          qui suit (« écrire X, pas Y »).
      - id: unverified-keeps-no-removed
        level: requirement
        method: inspection
        text: >-
          « Non vérifié » ne doit garder aucune trace d'une affirmation retirée : l'historique git
          en est la trace.
      - id: cited-ids-exist
        level: requirement
        check: sources
        text: >-
          Chaque id cité (`refs` du frontmatter, colonne source) doit exister dans « Références ».
      - id: every-reference-cited
        level: requirement
        check: sources
        text: >-
          Chaque référence doit être citée par une affirmation ou un élément du frontmatter.

  - title: Les conventions du texte (course/README.md section 3.5)
    purpose: >-
      Les conventions sous lesquelles `concept.md` reste du Markdown simple : le site fait de
      chacune son HTML et ses classes, le professeur les lit comme du Markdown ordinaire, et un
      message d'échec nomme la convention. Elles valent dans ce que l'apprenant lit ou entend
      (`readers` de `course/form.yaml`), la consigne exceptée.
    category: writing
    method: test
    rules:
      - id: concept-reference-resolves
        level: requirement
        check: conventions
        text: >-
          Une référence de concept doit nommer un concept, une section ou une unité existant du
          cours ; une référence à une annexe, un numéro d'annexe ou l'id d'une section ou d'une
          unité d'annexe.
      - id: stance-marker-plain-text
        level: requirement
        check: conventions
        text: >-
          Un marqueur de position doit être du texte simple juste après l'affirmation qu'il
          qualifie ; aucune définition de référence de lien ne porte l'étiquette d'un marqueur.
      - id: no-image-in-concept-file
        level: requirement
        check: conventions
        text: >-
          `concept.md` ne doit tenir aucune image : le build place chaque schéma à son unité,
          depuis `diagrams` du frontmatter.

  - title: Les ajouts d'une unité (course/README.md section 3.6)
    purpose: >-
      Ce qu'écrire une unité ajoute hors du fichier de concept : un fait de son ancrage aux
      « Faits fixés » de `storyline.md`, un terme qu'elle met en gras à `glossary.md`, et, une
      fois les sources écrites, une affirmation d'un champ publié à « Affirmations » de
      `sources.md`. `unit-additions` dit au créateur, au moment où il écrit l'unité, ce qu'un
      programme peut dire (le gras) ; la revue lit le reste.
    category: pedagogy
    method: inspection
    rules:
      - id: bold-term-in-glossary
        level: recommendation
        method: test
        check: unit-additions
        text: >-
          Il convient qu'un passage en gras (`**…**`) d'un champ d'une unité ou d'un cas
          supplémentaire que l'apprenant lit ou entend (`readers` de `course/form.yaml` : tout sauf
          la consigne), libellés exceptés, soit un terme de `glossary.md`, ou l'une de ses
          variantes, casse ignorée : un gras qui n'en est pas un est signalé, au cas où le terme
          manquerait au glossaire.
      - id: anchor-uses-storyline-facts
        level: requirement
        method: inspection
        text: >-
          Un ancrage ne doit reprendre que des faits de `storyline.md` ; il ajoute le déroulé (qui
          dit quoi, quand), jamais un fait nouveau : un fait qui manque est d'abord ajouté à
          `storyline.md`, aux « Faits fixés » avec l'id de l'unité qui le fixe.
      - id: published-claims-in-claims
        level: requirement
        category: sources
        method: inspection
        text: >-
          Seuls les champs publiés de `concept.md` sont sourcés : « Affirmations » doit couvrir
          les affirmations vérifiables de « Matière », de « L'essentiel », de « Se vérifier », de
          « Approfondissement » et des corrections des idées fausses (une définition, une date, un chiffre, une citation, ce
          qu'un guide dit ou ne dit pas).

  - title: Les fichiers de domaine (course/README.md section 4)
    purpose: >-
      Un fichier de domaine est l'entrée d'un domaine : le problème qu'il règle et une situation
      du fil rouge qui le traverse, rien de ce que `course.yaml` ou « Progression » de `plan.md`
      dit déjà. Le même texte sert le lecteur et le professeur.
    category: structure
    method: test
    rules:
      - id: domain-files-listed
        level: requirement
        check: course-files
        text: Chaque fichier de `domains/` doit être le `file` d'un domaine de `course.yaml`.
      - id: domain-file-no-frontmatter
        level: requirement
        check: course-files
        text: >-
          Un fichier de domaine ne doit pas avoir de frontmatter : son titre et son objectif sont
          dans `course.yaml`.
      - id: domain-file-no-h1
        level: requirement
        check: course-files
        text: Un fichier de domaine ne doit pas avoir de H1.
      - id: domain-sections-in-order
        level: requirement
        check: course-files
        text: >-
          Le corps d'un fichier de domaine doit être « Le problème », puis « Un cas qui traverse
          le domaine », toutes deux présentes et non vides, et aucune autre section `##` :
          l'enchaînement de ses concepts n'y est pas écrit, le build le compose depuis
          `course.yaml`.
      - id: domain-section-content
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          Chaque section d'un fichier de domaine doit dire ce que son titre annonce : « Le
          problème », la difficulté rencontrée sans les concepts du domaine ; « Un cas qui
          traverse le domaine », une situation du fil rouge où chaque concept du domaine sert,
          dans l'ordre, sans donner la réponse.
      - id: domain-text-for-reader
        level: requirement
        category: writing
        method: inspection
        text: >-
          Un fichier de domaine ne doit tenir aucun texte que seul le professeur lit : tout son texte
          est pour le lecteur.
      - id: domain-teaches-no-concept
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          Un fichier de domaine ne doit enseigner aucun concept ni faire d'affirmation qu'un
          concept du domaine ne fait pas : il n'a pas de fichier de sources.

  - title: Les fichiers du cours (course/README.md section 5)
    purpose: >-
      Les fichiers qui tiennent ce qui couvre tout le cours, et rien de ce qu'une unité ou
      `course.yaml` dit déjà : à qui il s'adresse, comment le professeur accueille un apprenant et
      la progression du cours (`plan.md`), ses termes (`glossary.md`), le monde où vivent ses cas
      et les faits que ses unités ont fixés (`storyline.md`), son histoire (`CHANGELOG.md`).
    category: structure
    method: test
    rules:
      - id: plan-audience-first
        level: requirement
        check: course-files
        text: >-
          La première section `##` de `plan.md` doit être « Public cible », la prose complète du
          public, non vide : le seul endroit où le cours dit à qui il s'adresse.
      - id: plan-onboarding-section
        level: requirement
        check: course-files
        text: >-
          `plan.md` doit avoir une section « Accueil » : un paragraphe qui donne la posture du
          professeur, puis une liste numérotée des questions d'accueil, qui clôt la section.
      - id: onboarding-question-form
        level: requirement
        check: course-files
        text: >-
          Une question d'accueil doit être `<n>. **<question label>** : <question>`, au moins
          une, les libellés de question distincts.
      - id: onboarding-asks-no-pace
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          « Accueil » ne doit poser aucune question sur le rythme : le professeur ajuste le rythme
          en cours de route.
      - id: plan-progression-after-onboarding
        level: requirement
        check: course-files
        text: >-
          `plan.md` doit avoir une section « Progression », non vide, la section `##` qui suit
          « Accueil ».
      - id: progression-content
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          « Progression » doit dire les domaines dans l'ordre du cours, ce que chacun donne et
          comment l'un mène au suivant, une fois pour tout le cours.
      - id: plan-optional-sections
        level: permission
        method: inspection
        text: >-
          `plan.md` peut avoir un H1 et, après « Progression », d'autres sections `##` que le
          professeur lit : les partis pris du cours (« Parti pris : une équipe en sprints »), ses
          propres règles d'écriture, les questions qu'il pose et repose dans tout le cours.
      - id: glossary-table-four-columns
        level: requirement
        check: course-files
        text: >-
          `glossary.md` doit tenir un tableau, avant toute section `##`, de quatre colonnes,
          chaque ligne avec un terme.
      - id: glossary-intro-and-h1
        level: permission
        method: inspection
        text: "`glossary.md` peut avoir un H1 et une introduction avant son tableau."
      - id: glossary-english-term
        level: requirement
        category: writing
        method: inspection
        text: >-
          La deuxième colonne d'une ligne du glossaire doit donner le terme anglais du terme du
          cours, vide quand le terme n'a pas d'équivalent anglais utile ou quand le terme du cours
          est déjà le mot anglais.
      - id: glossary-defining-concept-form
        level: requirement
        check: course-files
        text: >-
          La quatrième cellule d'une ligne du glossaire doit être un numéro de concept de
          `course.yaml`, le concept de définition.
      - id: glossary-defining-concept-teaches
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          Le concept de définition d'un terme doit être celui qu'un apprenant ouvre pour creuser le
          terme, celui dont la matière l'enseigne (son objectif ou l'une de ses unités en
          traite), pas un concept qui l'emploie ou le définit en passant avec une
          référence de concept vers un autre ; de deux concepts qui l'enseignent aussi à fond, le
          premier dans l'ordre du cours.
      - id: glossary-term-taught
        level: requirement
        category: pedagogy
        method: inspection
        text: Chaque terme du glossaire doit être enseigné par un concept du cours.
      - id: glossary-definition-from-concept
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          La définition d'un terme doit résumer la matière de son concept de définition et ne
          rien affirmer qu'elle n'affirme pas.
      - id: glossary-no-usage-list
        level: requirement
        method: inspection
        text: >-
          Le glossaire ne doit pas lister les concepts qui emploient un terme : un script ou le
          site le calcule à partir des variantes.
      - id: glossary-variant-in-one-row
        level: requirement
        check: course-files
        text: >-
          Une variante doit appartenir à une seule ligne : deux lignes ne tiennent pas la même
          variante, casse ignorée, qualificatif compris.
      - id: glossary-avoid-section
        level: requirement
        check: course-files
        text: >-
          La seule section `##` de `glossary.md` doit être « Termes à éviter », un tableau de
          trois colonnes.
      - id: glossary-term-after-defining-concept
        level: recommendation
        category: pedagogy
        check: glossary-order
        text: >-
          Il convient qu'un terme du glossaire soit employé après son concept de définition, dans
          l'ordre du cours, dans le `concept.md` de chaque concept, dans ce que l'apprenant en lit
          ou en entend (`readers` de `course/form.yaml` : tout sauf la consigne) et dans son
          frontmatter ; avant ce concept, seulement dans une phrase qui porte une référence de
          concept vers le concept de définition ou vers l'une de ses sections ou unités.
      - id: qualified-term-order-reviewed
        level: recommendation
        category: pedagogy
        method: inspection
        text: >-
          Il convient qu'un terme dont la cellule porte un qualificatif de sens, entre
          parenthèses, soit lui aussi employé après son concept de définition : `glossary-order`
          ne lit pas sa ligne, faute de distinguer les sens d'un homonyme, et la revue le fait.
      - id: term-defined-in-passing
        level: permission
        category: pedagogy
        method: inspection
        text: >-
          Avant son concept de définition, un terme du glossaire peut figurer dans une phrase qui
          le définit en passant.
      - id: storyline-fixed-facts-last
        level: requirement
        check: course-files
        text: >-
          Quand `storyline.md` a une section « Faits fixés », elle doit être sa dernière section
          `##` et ne tenir qu'une liste à puces, un fait par puce ; le monde (le titre et les
          sections avant elle) vient d'abord.
      - id: fixed-fact-names-its-unit
        level: requirement
        check: course-files
        text: >-
          Chaque fait fixé doit finir par l'id de l'unité qui l'a fixé, entre parenthèses
          (« (0d1) », un point final permis après), l'id d'une unité du cours.
      - id: storyline-holds-what-units-use
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          `storyline.md` ne doit rien tenir qu'aucune unité n'emploie : chaque fait fixé est fixé
          par l'unité qu'il nomme, et chaque partie du monde (un acteur, une source, un trait du
          cadre) sert à l'ancrage ou à un cas d'au moins une unité.
      - id: storyline-names-learner-role
        level: requirement
        category: pedagogy
        method: inspection
        text: "`storyline.md` doit nommer le rôle que l'apprenant y tient."
      - id: storyline-in-spec-language
        level: requirement
        category: writing
        method: inspection
        text: "`storyline.md` doit être écrit dans la langue de la spec."
      - id: cases-follow-storyline
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          Les ancrages et les cas supplémentaires doivent prendre leurs acteurs et leurs faits dans
          `storyline.md`, sans le contredire.
      - id: changelog-unreleased-first
        level: requirement
        check: course-files
        text: La première section `##` de `CHANGELOG.md` doit être « Non publié ».
      - id: changelog-release-sections
        level: requirement
        check: course-files
        text: >-
          Après « Non publié », `CHANGELOG.md` doit tenir une section par version publiée, la plus
          récente d'abord, `## X.Y.Z, YYYY-MM-DD`.
      - id: changelog-entry-form
        level: requirement
        check: course-files
        text: >-
          Une entrée du changelog doit être une ligne `- MAJOR|MINOR|PATCH, <where> : <what>`.
      - id: changelog-intro-and-closing
        level: permission
        method: inspection
        text: >-
          `CHANGELOG.md` peut avoir une introduction et, en dernier, un paragraphe libre (la ligne
          qui relie le cours à son histoire d'avant 0.1.0).

  - title: Le contrat de dessin (course/README.md section 6.1)
    purpose: >-
      Les règles qui gardent un SVG sûr et lisible chez chacun de ses consommateurs :
      `drawing-contract` vérifie ce qu'un script peut dire, une revue le reste.
    category: diagrams
    method: test
    rules:
      - id: svg-file-form
        level: requirement
        check: drawing-contract
        text: >-
          Un schéma doit être `<stem>.svg`, le radical en mots ASCII minuscules joints par des
          traits d'union ; du XML bien formé ; 32 Ko au plus.
      - id: svg-frame
        level: requirement
        check: drawing-contract
        text: >-
          La racine `<svg>` doit avoir `xmlns` et un `viewBox`, et ni `width` ni `height`.
      - id: svg-colour
        level: requirement
        check: drawing-contract
        text: >-
          La racine doit avoir `fill="currentColor"` ; chaque `fill` et chaque `stroke` est
          `currentColor` ou `none` ; aucune autre valeur de couleur, aucun attribut `style`, aucun
          élément `<style>` ; les seules classes sont `primary`, `secondary` et `muted`.
      - id: svg-text
        level: requirement
        check: drawing-contract
        text: >-
          Les mots doivent être des `<text>` (et des `<tspan>`), jamais des tracés, avec au moins
          un `<text>` ; les polices seulement par l'attribut `font-family` avec des familles
          génériques (`system-ui`, `sans-serif`, `serif`, `monospace`), aucun fichier de police,
          aucun `@font-face`.
      - id: svg-accessibility
        level: requirement
        check: drawing-contract
        text: >-
          La racine doit avoir `role="img"` et `aria-labelledby` nommant son `<title>` (et sa
          `<desc>` si elle est là) ; `<title>` est le premier enfant de la racine et égal au
          `title` du frontmatter ; leurs ids commencent par le radical.
      - id: svg-groups
        level: requirement
        check: drawing-contract
        text: >-
          Chaque enfant dessiné de la racine doit être un `<g>` d'`id` `<id>-<element>` : un id
          de section ou d'unité du concept, un trait d'union, des lettres ASCII minuscules et des
          chiffres joints par des traits d'union (`9a1-couches`, `9a1-tranche-1`), jamais un id
          de section ou d'unité nu, qui est l'ancre du texte publié ; cet id est unique parmi les
          schémas du concept. Un `<defs>`, qui n'est pas dessiné, peut se tenir à la racine à
          côté d'eux, et ce qu'il tient suit ce contrat.
      - id: svg-forbidden-elements
        level: requirement
        check: drawing-contract
        text: >-
          Un schéma ne doit tenir aucun `<script>`, aucun attribut `on*`, aucune `<image>`, aucun
          `<foreignObject>`, aucun `href` ni `xlink:href` qui ne commence pas par `#`, et aucune
          ressource externe.
      - id: diagram-shows-caption
        level: requirement
        method: inspection
        text: Un schéma doit montrer ce que dit sa légende.

  - title: Le style des schémas (course/README.md section 6.2)
    purpose: >-
      Une signification par classe et six principes, pour qu'un même rôle ait le même aspect d'un
      concept à l'autre, quel que soit qui dessine.
    category: diagrams
    method: inspection
    rules:
      - id: class-meanings
        level: requirement
        text: >-
          Chaque classe doit signifier la même chose dans chaque schéma d'un cours : `primary` ce
          que le schéma enseigne, son foyer ; `secondary` le contraste, un second élément opposé
          au premier ; `muted` le contexte et le texte ordinaire.
      - id: one-idea-per-diagram
        level: requirement
        text: >-
          Un schéma doit porter une seule idée : une légende qui demande deux phrases fait deux
          schémas.
      - id: diagram-roles
        level: requirement
        text: >-
          Un schéma doit avoir un sujet, au plus un contraste, un contexte et du texte ; une série
          est le sujet en niveaux ; un état (fait, pas fait, refusé) se dit par la forme.
      - id: role-rendering
        level: requirement
        text: >-
          Chaque rôle doit être rendu ainsi : le sujet en `primary`, opacité 1 ; une série en
          `primary` à opacité décroissante (1, 0.7, 0.4) ; le contraste en `secondary` ; le
          contexte en `muted`, une opacité basse pour les remplissages, moyenne pour les traits ;
          le texte en `muted`, opacité 1, `primary` seulement quand le mot est le sujet ; l'état
          plein pour fait, en tirets pour pas fait ou incertain, barré pour refusé. En une
          couleur, rien n'est plus marqué que le sujet ; le contraste diffère du sujet par
          l'opacité ou la forme, pas par la teinte seule.
      - id: readable-in-one-colour
        level: requirement
        text: >-
          L'opacité et la forme doivent porter chaque distinction, jamais la teinte seule ; le
          texte reste toujours lisible : jamais en réserve dans un remplissage, jamais sur un
          remplissage plus sombre que lui.
      - id: diagram-default-width
        level: recommendation
        text: Il convient que le `viewBox` d'un schéma fasse 600 unités de large.
      - id: diagram-composition
        level: requirement
        text: >-
          Un schéma doit se lire de gauche à droite ou de haut en bas, et tenir peu d'éléments,
          espacés ; son texte est dans les mots du cours, jamais sous 14 unités.
      - id: diagram-text-content
        level: requirement
        text: >-
          Le texte d'un schéma doit se limiter à ses étiquettes et, quand une distinction de forme
          ou d'opacité doit être nommée, à une clé (un échantillon et un mot) ; aucune
          phrase d'enseignement, qui est la `caption` ; aucune décoration, icône ni dégradé.
