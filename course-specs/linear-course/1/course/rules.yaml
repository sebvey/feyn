# Les règles d'un cours de linear-course (decisions rules-with-level-and-method and
# spec-files-by-product): the rules of course/README.md sections 1, 2, 4 and 5, those the checks
# verify and those verified by inspection, the review; and of its other sections, the rules the
# checks verify, taught-check included, and one rule verified by inspection. A course conforms when
# it holds every requirement of this file, whatever its method (spec-directives/1/README.md section
# 2). The tables of fields are the schemas of course/schemas/, each one rule here. The other rules
# of course/README.md join this file at the extraction of #318.
#
# A group: title, purpose (what the group is for, optional), category and method (declared once
# for its rules; a rule may override them), rules. A rule: id (a slug), level, category, method,
# check (the check that implements the method, when one exists), text, why (optional: what a
# competent model does without the rule, as observed). The texts of the groups of sections 1, 2, 4
# and 5 are French, the language of the spec (decision language-policy).
# check-spec (rule-files) verifies this file.
groups:
  - title: Le dossier du cours (course/README.md section 1)
    purpose: >-
      L'arborescence dont un cours est fait : chaque build et chaque check trouve un fichier par
      sa place dans cette arborescence, et la section que chaque ligne nomme donne la forme du
      fichier.
    category: structure
    method: test
    rules:
      - id: course-yaml-present
        level: requirement
        check: course-yaml
        text: "`course.yaml` doit exister à la racine du dossier du cours."
      - id: course-files-present
        level: requirement
        check: course-files
        text: "`plan.md`, `glossary.md`, `storyline.md` et `CHANGELOG.md` doivent exister."
      - id: course-decisions-folder
        level: permission
        method: inspection
        text: >-
          Un cours peut avoir un dossier `decisions/`, ses propres décisions ; aucun build ne le
          lit.
      - id: plain-markdown
        level: requirement
        category: writing
        check: conventions
        text: >-
          Le Markdown d'un cours doit être du CommonMark simple : pas de HTML, pas d'`import` ni
          d'`export` MDX, pas de directive `:::` ; un fichier de concept n'a ni H1 ni titre `####`
          ou plus profond.
      - id: no-banned-character
        level: recommendation
        category: writing
        check: typography
        text: >-
          Il convient que le texte d'un cours n'emploie pas les caractères interdits du lexique
          (`typography.banned`).

  - title: Le fichier course.yaml (course/README.md section 2)
    purpose: >-
      La carte du cours : son identité, ses domaines, ses concepts dans l'ordre du cours avec
      leurs prérequis et leurs arbres de sous-concepts, et les identifiants que citent la mémoire
      de l'apprenant et les adresses du site.
    category: structure
    method: test
    rules:
      - id: course-yaml-valid-against-schema
        level: requirement
        check: course-yaml
        text: >-
          `course.yaml` doit être valide selon `course/schemas/course.schema.yaml` : les champs
          du cours, d'une entrée de domaine, d'une entrée de concept et d'un nœud de
          sous-concept, leur présence et leur forme.
      - id: course-id-equals-folder
        level: requirement
        check: course-yaml
        text: L'`id` du cours doit être égal au nom de son dossier.
      - id: course-yaml-paths-exist
        level: requirement
        check: course-yaml
        text: >-
          Les chemins de `course.yaml` doivent exister dans le dossier du cours : `site.icon`,
          `storyline`, `glossary`, le `file` de chaque domaine et le `dir` de chaque concept.
      - id: domain-file-named-by-number
        level: requirement
        check: course-yaml
        text: >-
          Le `file` d'un domaine doit être `domains/<number>-<slug>.md`, de son propre numéro et
          de son propre slug.
      - id: domains-numbered-in-order
        level: requirement
        check: course-yaml
        text: Les domaines doivent être numérotés 1, 2, 3… dans l'ordre de la liste.
      - id: concept-dir-named-by-number
        level: requirement
        check: course-yaml
        text: >-
          Le `dir` d'un concept doit être `concepts/<NN>-<slug>`, `NN` son numéro sur deux
          chiffres ; une annexe garde son numéro (`concepts/A1-<slug>`).
      - id: subconcept-ids-in-order
        level: requirement
        check: course-yaml
        text: >-
          L'id d'un sous-concept de premier niveau doit être le numéro du concept suivi d'une
          lettre, à partir de `a`, dans l'ordre ; l'id d'un sous-concept de second niveau, l'id
          de son parent suivi d'un chiffre, à partir de `1`, dans l'ordre.
      - id: course-identifiers-unique
        level: requirement
        check: course-yaml
        text: Les numéros de concept et les ids de sous-concept doivent être uniques.
      - id: concepts-in-course-order
        level: requirement
        check: course-yaml
        text: >-
          Les concepts doivent venir dans l'ordre du cours : les concepts numérotés par numéro
          croissant, puis les annexes.
      - id: concept-in-one-domain
        level: requirement
        check: course-yaml
        text: >-
          Chaque concept numéroté doit appartenir à exactement un domaine, et un domaine ne doit
          lister que des concepts de `concepts`.
      - id: domain-concepts-consecutive
        level: requirement
        check: course-yaml
        text: >-
          Les concepts de chaque domaine doivent être consécutifs et suivre ceux du domaine
          précédent.
      - id: annexes-in-no-domain
        level: requirement
        check: course-yaml
        text: Les annexes ne doivent appartenir à aucun domaine.
      - id: annexes-are-a-numbers
        level: requirement
        check: course-yaml
        text: "`annexes` doit lister exactement les numéros `A` des concepts."
      - id: prerequisite-comes-earlier
        level: requirement
        check: course-yaml
        text: >-
          Un prérequis doit être un concept numéroté existant qui vient avant (n'importe quel
          concept numéroté pour une annexe).
      - id: concept-folders-listed
        level: requirement
        check: course-yaml
        text: Chaque dossier de `concepts/` doit être le `dir` d'une entrée de concept.
      - id: summaries-in-one-sentence
        level: requirement
        category: writing
        method: inspection
        text: >-
          L'`audience` du cours, l'`objective` d'un domaine et l'`objective` d'un concept doivent
          tenir chacun en une phrase.
      - id: leaf-fits-one-message
        level: recommendation
        category: pedagogy
        method: inspection
        text: >-
          Il convient qu'un sous-concept feuille, un nœud sans `children`, tienne en un message du
          professeur avec une question.

  - title: The concept folder (course/README.md section 3)
    category: structure
    method: test
    rules:
      - id: concept-folder-files
        level: requirement
        check: concept-folder
        text: >-
          A concept folder shall hold `concept.md`, `teaching.md`, `sources.md` and its `.svg`
          diagrams, and nothing else.
      - id: concept-sections-in-order
        level: requirement
        check: concept-folder
        text: >-
          The sections of `concept.md`, `teaching.md` and `sources.md` shall be `##` headings
          whose text is the lexicon's heading, in the order given, the mandatory ones
          present, and no other `##` section shall exist.
      - id: teaching-sources-no-h1
        level: requirement
        check: concept-folder
        text: "`teaching.md` and `sources.md` shall have no H1: the title is in `course.yaml`."
      - id: teaching-sources-no-frontmatter
        level: requirement
        check: concept-folder
        text: >-
          `teaching.md` and `sources.md` shall have no frontmatter: course Markdown has YAML
          frontmatter where stated only.
      - id: concept-frontmatter-valid-against-schema
        level: requirement
        check: concept-folder
        text: >-
          The frontmatter of `concept.md` shall be valid against
          `course/schemas/concept-frontmatter.schema.yaml`: its keys, an item and a diagram entry,
          their presence and their form.
      - id: item-text-inline-markdown
        level: requirement
        check: concept-folder
        text: "The `text` of a frontmatter item shall be inline Markdown: bold and italics only."
      - id: verified-parallel-to-refs
        level: requirement
        check: concept-folder
        text: >-
          An item's `verified` shall be present when `refs` is not empty and absent otherwise,
          a list parallel to `refs`, one entry per reference in the same order.
      - id: no-stances-section
        level: requirement
        check: concept-folder
        text: >-
          The body of `concept.md` shall have no stances section: `stances` and `neighbors` are
          the one place for the concept's stances and neighbours.
        why: >-
          Without it, the migration wrote the stances twice, in the frontmatter and in a body
          section, and the two copies drifted (concept 9 prototype; decision
          stances-in-frontmatter-only).
      - id: subconcept-sections-follow-tree
        level: requirement
        check: concept-folder
        text: >-
          `concept.md` shall hold one section per first-level sub-concept, in `course.yaml`
          order, and inside each, one `###` section per second-level sub-concept.
      - id: objective-restated-verbatim
        level: requirement
        check: concept-folder
        text: >-
          « Objectif » shall be the concept's `objective`, verbatim, give or take line breaks,
          written with a capital first letter and ending with a period where the field ends
          with no `.`, `!` or `?`.
      - id: sources-tables-five-columns
        level: requirement
        check: concept-folder
        text: >-
          « Affirmations » and « Références » of `sources.md` shall each hold one table of
          five columns.

  - title: The cases of teaching.md (course/README.md section 3.3)
    category: pedagogy
    rules:
      - id: case-heading-form
        level: requirement
        method: test
        check: case-contract
        text: >-
          A case heading shall be `### <title> (<sub-concept>)`, the parenthesis holding a
          sub-concept id of the concept, at any level, and at most one qualifier, before or
          after the id, separated by a comma; nothing else.
      - id: case-qualifier-from-lexicon
        level: requirement
        method: test
        check: case-contract
        text: A case's qualifier shall be a value of the lexicon's `qualifiers` group.
      - id: case-titles-unique
        level: requirement
        method: test
        check: case-contract
        text: Case titles shall be unique in the concept.
      - id: case-fields-labelled
        level: requirement
        method: test
        check: case-contract
        text: >-
          A case shall be a list of fields, each item opening with `**<label>** :`, the label
          one of the lexicon's `case_fields`.
      - id: field-qualifier-on-question-only
        level: requirement
        method: test
        check: case-contract
        text: Only the « Question » label may carry a qualifier of its own before the colon.
      - id: case-mandatory-fields
        level: requirement
        method: test
        check: case-contract
        text: >-
          A case shall hold « Situation », « Question », « Réponse attendue » and « Erreurs
          fréquentes », and no field twice.
      - id: case-fields-in-order
        level: requirement
        method: test
        check: case-contract
        text: >-
          The four mandatory fields of a case shall come in the order of the table, the
          optional fields before « Situation » before it, and « Ce qui marche » last.
      - id: leaf-has-a-case
        level: requirement
        method: test
        check: case-contract
        text: Every leaf sub-concept shall have at least one case.
      - id: case-cited-in-instructions
        level: requirement
        method: test
        check: case-contract
        text: >-
          Every case of the bank shall be cited in « Consignes » by its title in « » (« » and
          “ ” count as the same quotes, spaces inside them ignored).
      - id: case-restates-storyline-facts-only
        level: requirement
        method: inspection
        text: >-
          A case shall restate only the storyline facts listed in « Faits du fil rouge
          utilisés »; it adds the unfolding (who says what, when), never a new fact.
      - id: case-asks-what-was-taught
        level: recommendation
        method: analysis
        check: taught-check
        text: >-
          A case should ask only what the learner has been taught before it, on the course
          path.

  - title: Reader-text conventions (course/README.md section 3.5)
    category: writing
    method: test
    rules:
      - id: subconcept-section-form
        level: requirement
        check: conventions
        text: >-
          A sub-concept section shall be `## <id> <title>`, then one paragraph entirely in
          italics, the promise; a first-level sub-concept with children holds nothing else, one
          without children holds its reader text after the promise.
      - id: leaf-heading-form
        level: requirement
        check: conventions
        text: A leaf heading shall be `### <id> <title>`, then the reader text.
      - id: heading-title-from-course-yaml
        level: requirement
        check: conventions
        text: The `<title>` of a sub-concept heading shall equal its `title` in `course.yaml`.
      - id: concept-reference-resolves
        level: requirement
        check: conventions
        text: >-
          A concept reference shall name an existing concept or sub-concept of the course; a
          reference to an annex, an annex number or the sub-concept id of an annex.
      - id: stance-marker-plain-text
        level: requirement
        check: conventions
        text: >-
          A stance marker shall be plain text right after the claim it qualifies; no link
          reference definition carries a marker's label.
      - id: storyline-blockquote-form
        level: requirement
        check: conventions
        text: >-
          In the sub-concept sections, a blockquote shall be a storyline blockquote, its first
          line starting with `**Fil rouge :**` (`markers.storyline`).
      - id: diagram-image-form
        level: requirement
        check: conventions
        text: >-
          A diagram image shall be `![<title>](<file>)` alone in its paragraph, `<file>` a
          declared diagram and `<title>` its declared `title`; each declared diagram appears
          once in the body.
      - id: pitfalls-form
        level: requirement
        check: conventions
        text: >-
          « Pièges » shall be one bulleted list, each item opening with the pitfall in bold.
      - id: quick-test-form
        level: requirement
        check: conventions
        text: >-
          « Le test rapide » shall be one blockquote (the question), then at most one paragraph
          (the note).

  - title: Diagrams (course/README.md sections 3.1 and 6.1)
    category: diagrams
    method: test
    rules:
      - id: diagrams-declared-and-present
        level: requirement
        check: svg-contract
        text: >-
          Every declared diagram file shall exist, its `subconcept` shall be a sub-concept of
          the concept, and every SVG of the folder shall be declared.
      - id: svg-file-form
        level: requirement
        check: svg-contract
        text: >-
          A diagram shall be `<stem>.svg`, the stem lowercase ASCII words joined by hyphens;
          well-formed XML; 32 KB at most.
      - id: svg-frame
        level: requirement
        check: svg-contract
        text: The root `<svg>` shall have `xmlns` and a `viewBox`, and no `width` or `height`.
      - id: svg-colour
        level: requirement
        check: svg-contract
        text: >-
          The root shall have `fill="currentColor"`; every `fill` and `stroke` is `currentColor`
          or `none`; no other colour value, no `style` attribute, no `<style>` element; the only
          classes are `primary`, `secondary` and `muted`.
      - id: svg-text
        level: requirement
        check: svg-contract
        text: >-
          Words shall be `<text>` (and `<tspan>`), never paths, with at least one `<text>`;
          fonts only by the attribute `font-family` with generic families, no font file, no
          `@font-face`.
      - id: svg-accessibility
        level: requirement
        check: svg-contract
        text: >-
          The root shall have `role="img"` and `aria-labelledby` naming its `<title>` (and
          `<desc>` if present); `<title>` is the root's first child and equals the frontmatter
          `title`; their ids start with the stem.
      - id: svg-groups
        level: requirement
        check: svg-contract
        text: >-
          Every drawn child of the root shall be a `<g>` with an `id` `<sub-concept>-<element>`,
          unique across the concept's diagrams; a `<defs>` may sit at the root beside them.
      - id: svg-forbidden-elements
        level: requirement
        check: svg-contract
        text: >-
          A diagram shall hold no `<script>`, no `on*` attribute, no `<image>`, no
          `<foreignObject>`, no `href` or `xlink:href` not starting with `#`, and no external
          resource.

  - title: sources.md (course/README.md section 3.4)
    category: sources
    method: test
    rules:
      - id: sources-no-introduction
        level: requirement
        check: sources
        text: "`sources.md` shall have no introduction: it opens on « Affirmations »."
      - id: claim-states-claim
        level: requirement
        check: sources
        text: A row of « Affirmations » shall state the claim in a few words.
      - id: claim-section-exists
        level: requirement
        check: sources
        text: >-
          The section cell of a claim shall hold sub-concept ids and fixed sections by their
          lexicon value, separated by commas, each existing in `concept.md`.
      - id: stance-sourced-in-item
        level: requirement
        check: sources
        text: >-
          A stance or a neighbour shall be sourced in its frontmatter item, never by a row of
          « Affirmations ».
      - id: claim-source-cell-form
        level: requirement
        check: sources
        text: >-
          The source cell of a claim shall hold reference ids `[S1]`, separated by commas, or
          the `markers.course` word; nothing else: no free text, no path to another concept.
        why: >-
          Without it, the agent that wrote concept 9 gave free text as sources, « fil rouge »
          and « aucune » (decision where-a-claim-goes, superseded by
          sources-trace-the-concept).
      - id: claim-verified-cell-filled
        level: requirement
        check: sources
        text: The verified cell of a claim shall be empty only for a « cours » claim.
      - id: claim-nature-closed
        level: requirement
        check: sources
        text: >-
          The nature of a claim shall be `consensus`, `école`, `cours` (`markers.consensus`,
          `markers.school`, `markers.course`) or `fait` (`natures.fact`).
      - id: reference-id-form
        level: requirement
        check: sources
        text: >-
          A reference id shall be `S<n>`, optionally followed by a lowercase letter, unique in
          the concept.
      - id: reference-names-source
        level: requirement
        check: sources
        text: The source cell of a reference shall name the source (author, title, date).
      - id: reference-link-one-url
        level: requirement
        check: sources
        text: >-
          The link of a reference shall be one URL or empty: a second place is a second
          reference.
      - id: reference-type-from-lexicon
        level: requirement
        check: sources
        text: >-
          The type of a reference shall be one or more of `primary`, `secondary`, `marketing`,
          written as the lexicon's words and separated by commas, then an optional remark
          in parentheses.
      - id: reference-consulted-date
        level: requirement
        check: sources
        text: The « consulted on » cell of a reference shall start with `YYYY-MM-DD`.
      - id: unverified-entry-anchored
        level: requirement
        check: sources
        text: >-
          Each entry of « Non vérifié » shall open with its section, in the forms of the section
          column or `headings.stances`, then « : ».
      - id: cited-ids-exist
        level: requirement
        check: sources
        text: >-
          Every id cited (frontmatter `refs`, source column) shall exist in « Références ».
      - id: every-reference-cited
        level: requirement
        check: sources
        text: Every reference shall be cited by a claim or a frontmatter item.
      - id: reader-files-cite-no-reference
        level: requirement
        check: sources
        text: >-
          `concept.md` and `teaching.md` shall cite no reference: references live in the
          frontmatter `refs` and in `sources.md`.

  - title: Les fichiers de domaine (course/README.md section 4)
    purpose: >-
      Un fichier de domaine est l'entrée d'un domaine : le problème qu'il règle, l'enchaînement
      de ses concepts, sa place dans le cours, et une situation du fil rouge qui le traverse. Le
      même texte sert le lecteur et le professeur.
    category: structure
    method: test
    rules:
      - id: domain-files-listed
        level: requirement
        check: course-files
        text: Chaque fichier de `domains/` doit être le `file` d'un domaine de `course.yaml`.
      - id: domain-frontmatter-description
        level: requirement
        check: course-files
        text: >-
          Le frontmatter d'un fichier de domaine doit être `description`, une phrase pour le site,
          et rien d'autre.
      - id: domain-file-no-h1
        level: requirement
        check: course-files
        text: Un fichier de domaine ne doit pas avoir de H1.
      - id: domain-sections-in-order
        level: requirement
        check: course-files
        text: >-
          Le corps d'un fichier de domaine doit être « Le problème », « Le fil des concepts »,
          « D'où l'on vient, où l'on va », « Un cas qui traverse le domaine », toutes présentes
          et non vides, dans cet ordre.
      - id: concept-thread-paragraphs
        level: requirement
        check: course-files
        text: >-
          « Le fil des concepts » doit tenir un paragraphe par concept du domaine, dans l'ordre,
          ouvert par `**<number>. <concept title>.**`, le titre tel que dans `course.yaml` ; un
          domaine d'un seul concept, un paragraphe pour le concept, puis un par sous-concept de
          premier niveau, ouvert par `**<id>. <title>.**`.
      - id: domain-section-content
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          Chaque section d'un fichier de domaine doit dire ce que son titre annonce : « Le
          problème », la difficulté rencontrée sans les concepts du domaine ; « Le fil des
          concepts », un court paragraphe par concept ; « D'où l'on vient, où l'on
          va », ce que le domaine précédent donne à celui-ci et ce que celui-ci donne au suivant ;
          « Un cas qui traverse le domaine », une situation du fil rouge où chaque concept du
          domaine sert, dans l'ordre, sans donner la réponse.
      - id: domain-text-for-reader
        level: requirement
        category: writing
        method: inspection
        text: >-
          Un fichier de domaine ne doit tenir aucun texte pour le professeur seul : tout son texte
          est pour le lecteur.
      - id: domain-teaches-no-concept
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          Un fichier de domaine ne doit enseigner aucun concept ni faire d'affirmation qu'un
          concept du domaine ne fait pas : il n'a pas de fichier de sources.
      - id: domain-first-sentence-ends
        level: requirement
        category: writing
        check: domain-first-sentence
        text: >-
          La première phrase de chaque paragraphe de « Le fil des concepts », après l'amorce, doit
          finir par `.`, `?` ou `!` dans les 300 caractères qui suivent l'amorce.
      - id: domain-first-sentence-stands-alone
        level: recommendation
        category: writing
        check: domain-first-sentence-standalone
        text: >-
          Il convient que la première phrase de chaque paragraphe de « Le fil des concepts », après
          l'amorce, ne s'ouvre pas sur un mot de la liste `checks.anaphora` du lexique.

  - title: Les fichiers du cours (course/README.md section 5)
    purpose: >-
      Les fichiers qui tiennent ce qui couvre tout le cours : à qui il s'adresse et comment le
      professeur accueille un apprenant (`plan.md`), ses termes (`glossary.md`), le monde où vivent
      ses cas (`storyline.md`), son histoire (`CHANGELOG.md`).
    category: structure
    method: test
    rules:
      - id: plan-audience-first
        level: requirement
        check: course-files
        text: >-
          La première section `##` de `plan.md` doit être « Public cible », la prose complète du
          public.
      - id: plan-onboarding-section
        level: requirement
        check: course-files
        text: >-
          `plan.md` doit avoir une section « Accueil » : un paragraphe qui donne la posture du
          professeur, puis une liste numérotée des questions d'accueil, qui clôt la section.
      - id: onboarding-question-form
        level: requirement
        check: course-files
        text: >-
          Une question d'accueil doit être `<n>. **<question label>** : <question>`, au moins
          une, les libellés de question distincts.
      - id: onboarding-asks-no-pace
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          « Accueil » ne doit poser aucune question sur le rythme : le professeur ajuste le rythme
          au fil du cours.
      - id: plan-optional-sections
        level: permission
        method: inspection
        text: >-
          `plan.md` peut avoir un H1 et, après « Accueil », d'autres sections `##` que le professeur
          lit : les partis pris du cours (« Parti pris : une équipe en sprints »), ses propres
          règles d'écriture.
      - id: glossary-table-four-columns
        level: requirement
        check: course-files
        text: >-
          `glossary.md` doit tenir un tableau, avant toute section `##`, de quatre colonnes,
          chaque ligne avec un terme.
      - id: glossary-intro-and-h1
        level: permission
        method: inspection
        text: "`glossary.md` peut avoir un H1 et une introduction avant son tableau."
      - id: glossary-english-term
        level: requirement
        category: writing
        method: inspection
        text: >-
          La deuxième colonne d'une ligne du glossaire doit donner le terme anglais du terme du
          cours, vide quand le terme n'a pas d'équivalent anglais utile ou quand le terme du cours
          est déjà le mot anglais.
      - id: glossary-defining-concept-form
        level: requirement
        check: course-files
        text: >-
          La quatrième cellule d'une ligne du glossaire doit être un numéro de concept de
          `course.yaml`, le concept de définition.
      - id: glossary-defining-concept-teaches
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          Le concept de définition d'un terme doit être celui qu'un apprenant ouvre pour creuser le
          terme, celui dont le texte lecteur l'enseigne (son objectif ou l'un de ses
          sous-concepts en traite), pas un concept qui l'emploie ou le définit en passant avec une
          référence de concept vers un autre ; de deux concepts qui l'enseignent aussi à fond, le
          premier dans l'ordre du cours.
      - id: glossary-term-taught
        level: requirement
        category: pedagogy
        method: inspection
        text: Chaque terme du glossaire doit être enseigné par un concept du cours.
      - id: glossary-definition-from-concept
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          La définition d'un terme doit résumer le texte lecteur de son concept de définition et
          ne rien affirmer qu'il n'affirme pas.
      - id: glossary-no-usage-list
        level: requirement
        method: inspection
        text: >-
          Le glossaire ne doit pas lister les concepts qui emploient un terme : un script ou le
          site le calcule à partir des variantes.
      - id: glossary-variant-in-one-row
        level: requirement
        check: course-files
        text: >-
          Une variante doit appartenir à une seule ligne : deux lignes ne tiennent pas la même
          variante, casse ignorée, qualificatif compris.
      - id: glossary-avoid-section
        level: requirement
        check: course-files
        text: >-
          La seule section `##` de `glossary.md` doit être « Termes à éviter », un tableau de
          trois colonnes.
      - id: glossary-term-after-defining-concept
        level: recommendation
        category: pedagogy
        check: glossary-order
        text: >-
          Il convient qu'un terme du glossaire soit employé après son concept de définition, dans
          l'ordre du cours, dans le `concept.md` de chaque concept, son corps et son frontmatter ;
          avant ce concept, seulement dans une phrase qui porte une référence de concept vers le
          concept de définition ou vers l'un de ses sous-concepts.
      - id: qualified-term-order-reviewed
        level: recommendation
        category: pedagogy
        method: inspection
        text: >-
          Il convient qu'un terme dont la cellule porte un qualificatif de sens, entre
          parenthèses, soit lui aussi employé après son concept de définition : `glossary-order`
          ne lit pas sa ligne, faute de distinguer les sens d'un homonyme, et la revue le fait.
      - id: term-defined-in-passing
        level: permission
        category: pedagogy
        method: inspection
        text: >-
          Avant son concept de définition, un terme du glossaire peut figurer dans une phrase qui
          le définit en passant.
      - id: storyline-names-learner-role
        level: requirement
        category: pedagogy
        method: inspection
        text: "`storyline.md` doit nommer le rôle que l'apprenant y tient."
      - id: cases-follow-storyline
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          Les cas doivent prendre leurs acteurs et leurs faits dans `storyline.md`, sans le
          contredire.
      - id: changelog-unreleased-first
        level: requirement
        check: course-files
        text: La première section `##` de `CHANGELOG.md` doit être « Non publié ».
      - id: changelog-release-sections
        level: requirement
        check: course-files
        text: >-
          Après « Non publié », `CHANGELOG.md` doit tenir une section par version publiée, la plus
          récente d'abord, `## X.Y.Z, YYYY-MM-DD`.
      - id: changelog-entry-form
        level: requirement
        check: course-files
        text: >-
          Une entrée du changelog doit être une ligne `- MAJOR|MINOR|PATCH, <where> : <what>`.
      - id: changelog-intro-and-closing
        level: permission
        method: inspection
        text: >-
          `CHANGELOG.md` peut avoir une introduction et, en dernier, un paragraphe libre (la ligne
          qui relie le cours à son histoire d'avant 0.1.0).
