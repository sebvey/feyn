# Les règles d'un cours de linear-course (decisions rules-with-level-and-method and
# spec-files-by-product): every rule of a course, those the checks verify, taught-check
# included, and those verified by inspection, the review; one group per section or sub-section
# of course/README.md that points to rules, in its order (section 6 points to the groups of 6.1 and
# 6.2; section 7 states no rule of a course). A course conforms when it holds every requirement of
# this file, whatever its method (spec-directives/1/README.md section 2). The tables of fields are
# the schemas of course/schemas/, each one rule here.
#
# A group: title, purpose (what the group is for), category and method (declared once for its
# rules; a rule may override them), rules. A rule: id (a slug), level, category, method, check
# (the check that implements the method, when one exists), text, why (optional: what a competent
# model does without the rule, as observed). The texts are French, the language of the spec
# (decision language-policy).
# check-spec (rule-files) verifies this file.
groups:
  - title: Le dossier du cours (course/README.md section 1)
    purpose: >-
      L'arborescence dont un cours est fait : chaque build et chaque check trouve un fichier par
      sa place dans cette arborescence, et la section que chaque ligne nomme donne la forme du
      fichier.
    category: structure
    method: test
    rules:
      - id: course-yaml-present
        level: requirement
        check: course-yaml
        text: "`course.yaml` doit exister à la racine du dossier du cours."
      - id: course-files-present
        level: requirement
        check: course-files
        text: "`plan.md`, `glossary.md`, `storyline.md` et `CHANGELOG.md` doivent exister."
      - id: course-decisions-folder
        level: permission
        method: inspection
        text: >-
          Un cours peut avoir un dossier `decisions/`, ses propres décisions ; aucun build ne le
          lit.
      - id: plain-markdown
        level: requirement
        category: writing
        check: conventions
        text: >-
          Le Markdown d'un cours doit être du CommonMark simple : pas de HTML, pas d'`import` ni
          d'`export` MDX, pas de directive `:::` ; un fichier de concept n'a ni H1 ni titre `####`
          ou plus profond.
      - id: no-banned-character
        level: recommendation
        category: writing
        check: typography
        text: >-
          Il convient que le texte d'un cours n'emploie pas les caractères interdits du lexique
          (`typography.banned`).

  - title: Le fichier course.yaml (course/README.md section 2)
    purpose: >-
      La carte du cours : son identité, ses domaines, ses concepts dans l'ordre du cours avec
      leurs prérequis et leurs arbres de sous-concepts, et les identifiants que citent la mémoire
      de l'apprenant et les adresses du site.
    category: structure
    method: test
    rules:
      - id: course-yaml-valid-against-schema
        level: requirement
        check: course-yaml
        text: >-
          `course.yaml` doit être valide selon `course/schemas/course.schema.yaml` : les champs
          du cours, d'une entrée de domaine, d'une entrée de concept et d'un nœud de
          sous-concept, leur présence et leur forme.
      - id: course-id-equals-folder
        level: requirement
        check: course-yaml
        text: L'`id` du cours doit être égal au nom de son dossier.
      - id: course-yaml-paths-exist
        level: requirement
        check: course-yaml
        text: >-
          Les chemins de `course.yaml` doivent exister dans le dossier du cours : `site.icon`,
          `storyline`, `glossary`, le `file` de chaque domaine et le `dir` de chaque concept.
      - id: domain-file-named-by-number
        level: requirement
        check: course-yaml
        text: >-
          Le `file` d'un domaine doit être `domains/<number>-<slug>.md`, de son propre numéro et
          de son propre slug.
      - id: domains-numbered-in-order
        level: requirement
        check: course-yaml
        text: Les domaines doivent être numérotés 1, 2, 3… dans l'ordre de la liste.
      - id: concept-dir-named-by-number
        level: requirement
        check: course-yaml
        text: >-
          Le `dir` d'un concept doit être `concepts/<NN>-<slug>`, `NN` son numéro sur deux
          chiffres ; une annexe garde son numéro (`concepts/A1-<slug>`).
      - id: subconcept-ids-in-order
        level: requirement
        check: course-yaml
        text: >-
          L'id d'un sous-concept de premier niveau doit être le numéro du concept suivi d'une
          lettre, à partir de `a`, dans l'ordre ; l'id d'un sous-concept de second niveau, l'id
          de son parent suivi d'un chiffre, à partir de `1`, dans l'ordre.
      - id: course-identifiers-unique
        level: requirement
        check: course-yaml
        text: Les numéros de concept et les ids de sous-concept doivent être uniques.
      - id: concepts-in-course-order
        level: requirement
        check: course-yaml
        text: >-
          Les concepts doivent venir dans l'ordre du cours : les concepts numérotés par numéro
          croissant, puis les annexes.
      - id: concept-in-one-domain
        level: requirement
        check: course-yaml
        text: >-
          Chaque concept numéroté doit appartenir à exactement un domaine, et un domaine ne doit
          lister que des concepts de `concepts`.
      - id: domain-concepts-consecutive
        level: requirement
        check: course-yaml
        text: >-
          Les concepts de chaque domaine doivent être consécutifs et suivre ceux du domaine
          précédent.
      - id: annexes-in-no-domain
        level: requirement
        check: course-yaml
        text: Les annexes ne doivent appartenir à aucun domaine.
      - id: annexes-are-a-numbers
        level: requirement
        check: course-yaml
        text: "`annexes` doit lister exactement les numéros `A` des concepts."
      - id: prerequisite-comes-earlier
        level: requirement
        check: course-yaml
        text: >-
          Un prérequis doit être un concept numéroté existant qui vient avant (n'importe quel
          concept numéroté pour une annexe).
      - id: concept-folders-listed
        level: requirement
        check: course-yaml
        text: Chaque dossier de `concepts/` doit être le `dir` d'une entrée de concept.
      - id: summaries-in-one-sentence
        level: requirement
        category: writing
        method: inspection
        text: >-
          L'`audience` du cours, l'`objective` d'un domaine et l'`objective` d'un concept doivent
          tenir chacun en une phrase.
      - id: leaf-fits-one-message
        level: recommendation
        category: pedagogy
        method: inspection
        text: >-
          Il convient qu'un sous-concept feuille, un nœud sans `children`, tienne en un message du
          professeur avec une question.

  - title: Le dossier de concept (course/README.md section 3)
    purpose: >-
      Les fichiers dont un concept est fait et la forme commune de leurs sections : chaque concept
      est une source, que le site construit et que le professeur lit, sans réécriture.
    category: structure
    method: test
    rules:
      - id: concept-folder-files
        level: requirement
        check: concept-folder
        text: >-
          Un dossier de concept doit tenir `concept.md`, `teaching.md`, `sources.md` et ses
          schémas `.svg`, et rien d'autre.
      - id: concept-sections-in-order
        level: requirement
        check: concept-folder
        text: >-
          Les sections fixes de `concept.md`, `teaching.md` et `sources.md` doivent être des
          titres `##` dont le texte est le titre du lexique, dans cet ordre, toutes présentes sauf
          celles dites au choix, et aucune autre section `##` ne doit exister : pour `concept.md`,
          « Objectif », « L'essentiel », les sections de sous-concept, « Pièges », « Le test
          rapide », puis « Approfondissement » au choix ; pour `teaching.md`, « Consignes »,
          « Faits du fil rouge utilisés » au choix, « Banque d'exemples », « Schéma » au choix ;
          pour `sources.md`, « Affirmations », « Références », « Non vérifié ».
      - id: teaching-sources-no-h1
        level: requirement
        check: concept-folder
        text: >-
          `teaching.md` et `sources.md` ne doivent pas avoir de H1 : le titre est dans
          `course.yaml`.
      - id: teaching-sources-no-frontmatter
        level: requirement
        check: concept-folder
        text: >-
          `teaching.md` et `sources.md` ne doivent pas avoir de frontmatter : le Markdown d'un
          cours n'a de frontmatter YAML que là où la spec le dit.

  - title: Le frontmatter de concept.md (course/README.md section 3.1)
    purpose: >-
      Ce que le concept déclare en tête de `concept.md` : sa description pour le site, ses
      positions et ses voisins, chacun sourcé dans son propre élément, la preuve à côté de ce
      qu'elle prouve, et ses schémas.
    category: structure
    method: test
    rules:
      - id: concept-frontmatter-valid-against-schema
        level: requirement
        check: concept-folder
        text: >-
          Le frontmatter de `concept.md` doit être valide selon
          `course/schemas/concept-frontmatter.schema.yaml` : ses clés, un élément et une entrée de
          schéma, leur présence et leur forme.
      - id: item-text-inline-markdown
        level: requirement
        check: concept-folder
        text: >-
          Le `text` d'un élément du frontmatter doit être du Markdown en ligne : gras et italique
          seulement.
      - id: stance-item-has-author
        level: recommendation
        category: sources
        method: inspection
        text: >-
          Il convient qu'un élément de `stances.consensus` ou de `stances.school` ait un
          `author` : le texte ou l'auteur à qui l'affirmation appartient.
      - id: verified-parallel-to-refs
        level: requirement
        check: concept-folder
        text: >-
          Le `verified` d'un élément doit être présent quand `refs` n'est pas vide et absent
          sinon : une liste parallèle à `refs`, une entrée par référence, dans le même ordre.
      - id: item-verified-quotes-source
        level: requirement
        category: sources
        method: inspection
        text: >-
          Chaque entrée de `verified` doit être la plus courte citation qui établit l'élément,
          entre « », puis sa place entre parenthèses, comme la cellule de vérification d'une ligne
          de « Affirmations ».
      - id: no-stances-section
        level: requirement
        check: concept-folder
        text: >-
          Le corps de `concept.md` ne doit pas avoir de section de positions : `stances` et
          `neighbors` sont le seul endroit des positions et des voisins du concept.
        why: >-
          Sans elle, la migration écrivait les positions deux fois, dans le frontmatter et dans
          une section du corps, et les deux copies divergeaient (prototype du concept 9 ; décision
          stances-in-frontmatter-only).
      - id: reader-text-stance-markers
        level: permission
        category: writing
        method: inspection
        text: >-
          Le texte lecteur peut marquer une affirmation d'un marqueur de position, en plus des
          positions du frontmatter.
      - id: diagrams-declared-and-present
        level: requirement
        category: diagrams
        check: svg-contract
        text: >-
          Chaque fichier de schéma déclaré doit exister, son `subconcept` doit être un
          sous-concept du concept, et chaque SVG du dossier doit être déclaré.

  - title: Le corps de concept.md (course/README.md section 3.2)
    purpose: >-
      Le texte lecteur du concept, dans un ordre fixe : son objectif, l'essentiel, une section par
      sous-concept, ses pièges et son test rapide, puis, pour l'apprenant qui veut aller plus
      loin, un approfondissement.
    category: pedagogy
    method: inspection
    rules:
      - id: objective-restated-verbatim
        level: requirement
        category: structure
        method: test
        check: concept-folder
        text: >-
          « Objectif » doit être l'`objective` du concept, mot pour mot, aux sauts de ligne près,
          écrit avec une majuscule initiale et fini par un point quand le champ ne finit ni par
          `.`, ni par `!`, ni par `?`.
      - id: essentials-define-concept
        level: requirement
        text: >-
          « L'essentiel » doit donner la définition du concept et ce qui la rend importante, en
          quelques lignes.
      - id: subconcept-sections-follow-tree
        level: requirement
        category: structure
        method: test
        check: concept-folder
        text: >-
          `concept.md` doit tenir une section par sous-concept de premier niveau, dans l'ordre de
          `course.yaml`, et dans chacune une section `###` par sous-concept de second niveau.
      - id: pitfalls-whole-concept
        level: requirement
        text: « Pièges » doit porter sur le concept entier.
      - id: quick-test-whole-concept
        level: requirement
        text: « Le test rapide » doit porter sur le concept entier.
      - id: deepening-beyond-subconcepts
        level: requirement
        text: >-
          « Approfondissement » doit tenir de la matière en plus sur le concept, au-delà de ce
          qu'enseignent ses sections de sous-concept, pour l'apprenant qui demande à aller plus
          loin.
      - id: no-case-relies-on-deepening
        level: requirement
        text: >-
          Aucun cas, de quelque type qu'il soit, ne doit reposer sur « Approfondissement ».

  - title: Le fichier teaching.md (course/README.md section 3.3)
    purpose: >-
      `teaching.md` tient ce dont le professeur a besoin au-delà du texte lecteur, avant tout les
      cas. Un cas est la question préparée de la boucle : le professeur la pose à un sous-concept
      et corrige la réponse. Il apporte la couverture (chaque sous-concept feuille en a un,
      vérifié), la position propre du cours (sa réponse attendue est la position que le concept
      énonce : consensus, école ou cours), l'expérience (il anticipe les erreurs des apprenants),
      l'ancrage (il vit dans le fil rouge) et la testabilité (taught-check et les fresh tests le
      citent par son titre). Un cas répond à l'un de quatre besoins, son type : un par
      sous-concept feuille, au fil ; un cas de rechange, quand l'apprenant échoue au
      premier ; un cas d'entraînement, pour l'apprenant qui veut s'exercer sur un concept validé,
      ou pour retrouver à la reprise un concept validé lors d'une session précédente ; un aparté,
      pour une question fréquente hors du fil.
    category: pedagogy
    rules:
      - id: case-within-reader-text
        level: requirement
        method: inspection
        text: >-
          Un cas ne doit porter que sur ce que le texte lecteur énonce : ce que le texte lecteur
          n'énonce pas est une lacune du concept, comblée dans `concept.md`.
      - id: instructions-content
        level: requirement
        method: inspection
        text: >-
          « Consignes » doit donner l'ordre d'enseignement et le découpage en messages, quel cas
          poser à quel sous-concept et lequel en rechange, les renvois à ne pas réenseigner et les
          points de vigilance propres au concept.
      - id: case-cited-in-instructions
        level: requirement
        method: test
        check: case-contract
        text: >-
          Chaque cas de la banque doit être cité dans « Consignes » par son titre entre « » (« »
          et “ ” comptent comme les mêmes guillemets, les espaces à l'intérieur ignorées).
      - id: storyline-facts-section-content
        level: requirement
        method: inspection
        text: >-
          « Faits du fil rouge utilisés » doit tenir les faits de `storyline.md` que les cas
          emploient, et ce que le fil rouge laisse non fixé.
      - id: drawing-section-content
        level: requirement
        method: inspection
        text: >-
          « Schéma » doit tenir la consigne de dessin derrière les schémas du concept : la
          métaphore, ce qu'elle montre.
      - id: teaching-contradicts-no-protocol
        level: requirement
        method: inspection
        text: >-
          `teaching.md` ne doit contredire aucune règle du protocole : il dit quoi enseigner, le
          protocole dit comment et quand (« Schéma » dit quoi dessiner, pas quand envoyer un
          schéma) ; une « Consignes » qui contredit une règle est un défaut du concept.
      - id: case-restates-storyline-facts-only
        level: requirement
        method: inspection
        text: >-
          Un cas ne doit reprendre que les faits du fil rouge listés dans « Faits du fil rouge
          utilisés » ; il ajoute le déroulé (qui dit quoi, quand), jamais un fait nouveau.
      - id: case-heading-form
        level: requirement
        method: test
        check: case-contract
        text: >-
          Le titre d'un cas doit être `### <title> (<sub-concept>)`, la parenthèse tenant un id
          de sous-concept du concept, de n'importe quel niveau, et au plus un qualificatif, avant
          ou après l'id, séparé par une virgule ; rien d'autre.
      - id: case-qualifier-from-lexicon
        level: requirement
        method: test
        check: case-contract
        text: Le qualificatif d'un cas doit être une valeur du groupe `qualifiers` du lexique.
      - id: fallback-case-stands-alone
        level: requirement
        method: inspection
        text: >-
          Un cas de rechange doit se suffire : sa propre situation et sa propre question, rien
          d'emprunté au cas échoué.
      - id: case-titles-unique
        level: requirement
        method: test
        check: case-contract
        text: Les titres des cas doivent être uniques dans le concept.
      - id: leaf-has-a-case
        level: requirement
        method: test
        check: case-contract
        text: Chaque sous-concept feuille doit avoir au moins un cas.
      - id: case-fields-labelled
        level: requirement
        method: test
        check: case-contract
        text: >-
          Un cas doit être une liste de champs, chaque élément ouvert par `**<label>** :`, le
          libellé l'un des `case_fields` du lexique, son texte sur la même ligne ou dans une liste
          imbriquée.
      - id: field-qualifier-on-question-only
        level: requirement
        method: test
        check: case-contract
        text: >-
          Seul le libellé « Question » peut porter un qualificatif à lui avant les deux-points
          (« **Question**, en deux parties : »).
      - id: case-mandatory-fields
        level: requirement
        method: test
        check: case-contract
        text: >-
          Un cas doit tenir « Situation », « Question », « Réponse attendue » et « Erreurs
          fréquentes », et aucun champ deux fois.
      - id: case-optional-fields
        level: permission
        method: inspection
        text: Un cas peut tenir « Usage », « Explication » et « Ce qui marche ».
      - id: case-fields-in-order
        level: requirement
        method: test
        check: case-contract
        text: >-
          Les quatre champs requis d'un cas doivent venir dans l'ordre « Situation », « Question »,
          « Réponse attendue », « Erreurs fréquentes », « Usage » et « Explication » avant eux, dans
          n'importe quel ordre, et « Ce qui marche » en dernier.
      - id: case-field-content
        level: requirement
        method: inspection
        text: >-
          Chaque champ d'un cas doit tenir ce que son libellé annonce : « Usage », quand poser un
          cas hors du fil (rechange, entraînement, aparté) ; « Explication », ce que le
          professeur dit avant le cas, la source de son explication du sous-concept ;
          « Situation », les acteurs et les faits du fil rouge posés d'emblée, et le déroulé (qui
          dit quoi, quand) ; « Question », la question que pose le cas ; « Réponse attendue », la
          bonne réponse avec ses nuances, la position du cours telle que `concept.md` l'énonce ;
          « Erreurs fréquentes », les réponses fréquentes et comment les corriger, relances
          comprises ; « Ce qui marche », une formulation ou une relance qu'un professeur a vue
          marcher.
      - id: what-works-from-observation
        level: requirement
        method: inspection
        text: >-
          « Ce qui marche » doit être vide dans un nouveau cours : le mainteneur l'ajoute à partir
          de ce que le professeur note dans la mémoire de l'apprenant.
      - id: case-asks-what-was-taught
        level: recommendation
        method: analysis
        check: taught-check
        text: >-
          Il convient qu'un cas ne demande que ce que l'apprenant a appris avant lui, au fil.

  - title: Le fichier sources.md (course/README.md section 3.4)
    purpose: >-
      `sources.md` montre que le concept est fondé, et permet à chacun de remonter d'une
      affirmation de son corps à ce sur quoi elle repose. « Références » sert d'abord le lecteur
      du site ; « Affirmations » sert l'audit (le relecteur, le mainteneur, le professeur sur
      demande). La traçabilité vaut par sa re-vérification, pas par son volume.
    category: sources
    method: test
    rules:
      - id: body-claims-in-claims
        level: requirement
        method: inspection
        text: >-
          Seul `concept.md` est sourcé : « Affirmations » doit couvrir les affirmations
          vérifiables de son corps (une définition, une date, un chiffre, une citation, ce qu'un
          guide dit ou ne dit pas).
      - id: claims-hold-no-device
        level: requirement
        method: inspection
        text: >-
          Une ligne de « Affirmations » ne doit porter ni un fait du fil rouge (inventé, dans
          `storyline.md`), ni un procédé d'enseignement (un exemple inventé, la déduction d'un
          cas), ni une formulation du cours.
      - id: stance-sourced-in-item
        level: requirement
        check: sources
        text: >-
          Une position ou un voisin doit être sourcé dans son élément du frontmatter, jamais par
          une ligne de « Affirmations ».
      - id: teaching-claim-to-concept
        level: requirement
        method: inspection
        text: >-
          Une affirmation que seul `teaching.md` fait est une lacune du concept : elle doit
          d'abord être ajoutée à `concept.md`, ou n'est pas une affirmation à sourcer.
      - id: reader-files-cite-no-reference
        level: requirement
        check: sources
        text: >-
          `concept.md` et `teaching.md` ne doivent citer aucune référence : les références vivent
          dans les `refs` du frontmatter et dans `sources.md`.
      - id: sources-no-introduction
        level: requirement
        check: sources
        text: >-
          `sources.md` ne doit pas avoir d'introduction : il s'ouvre sur « Affirmations ».
      - id: sources-tables-five-columns
        level: requirement
        category: structure
        check: concept-folder
        text: >-
          « Affirmations » et « Références » de `sources.md` doivent tenir chacune un tableau de
          cinq colonnes, dans cet ordre : pour « Affirmations », affirmation, section, source,
          vérifié, nature ; pour « Références », id, source, lien, type, consulté le.
      - id: claim-states-claim
        level: requirement
        check: sources
        text: Une ligne de « Affirmations » doit énoncer l'affirmation en quelques mots.
      - id: claim-section-exists
        level: requirement
        check: sources
        text: >-
          La cellule section d'une affirmation doit tenir des ids de sous-concept et des sections
          fixes par leur valeur du lexique (« L'essentiel », « Pièges », « Le test rapide »,
          « Approfondissement »), séparés par des virgules, jamais le texte d'un titre, chacun
          existant dans `concept.md`. « Objectif » n'en est pas une : il énonce ce que
          l'apprenant fera, pas une affirmation.
      - id: claim-source-cell-form
        level: requirement
        check: sources
        text: >-
          La cellule source d'une affirmation doit tenir des ids de référence `[S1]`, séparés par
          des virgules, ou le mot `markers.course` ; rien d'autre : pas de texte libre, pas de
          chemin vers un autre concept.
        why: >-
          Sans elle, l'agent qui écrivait le concept 9 donnait du texte libre pour source,
          « fil rouge » et « aucune » (décision where-a-claim-goes, remplacée par
          sources-trace-the-concept).
      - id: claim-verified-cell-filled
        level: requirement
        check: sources
        text: >-
          La cellule vérifié d'une affirmation ne doit être vide que pour une affirmation
          « cours ».
      - id: claim-verified-cell-form
        level: requirement
        method: inspection
        text: >-
          La cellule vérifié doit tenir, par référence de la cellule source et dans le même
          ordre, la plus courte citation qui établit l'affirmation, entre « », puis sa place
          entre parenthèses (section, page, titre) ; pour une absence, « absent de » et la place
          cherchée ; pour une affirmation « cours », une ligne qui dit d'où elle découle, ou
          rien ; aucun raisonnement, aucune mention de « Non vérifié » : ce qui ne peut être
          cité va dans « Non vérifié ».
      - id: claim-nature-closed
        level: requirement
        check: sources
        text: >-
          La nature d'une affirmation doit être `consensus`, `école`, `cours`
          (`markers.consensus`, `markers.school`, `markers.course`) ou `fait` (`natures.fact`).
      - id: claim-nature-matches-marker
        level: requirement
        method: inspection
        text: >-
          Une affirmation que le texte lecteur marque d'un marqueur de position doit avoir la
          nature de ce marqueur ; une source « cours » doit avoir la nature `cours`.
      - id: reference-id-form
        level: requirement
        check: sources
        text: >-
          L'id d'une référence doit être `S<n>`, suivi au choix d'une lettre minuscule, unique
          dans le concept.
      - id: reference-names-source
        level: requirement
        check: sources
        text: La cellule source d'une référence doit nommer la source (auteur, titre, date).
      - id: reference-description-copied
        level: requirement
        method: inspection
        text: >-
          La description d'une source reprise d'un autre concept doit être copiée à l'identique.
      - id: reference-link-one-url
        level: requirement
        check: sources
        text: >-
          Le lien d'une référence doit être une URL ou vide : une seconde place est une seconde
          référence.
      - id: reference-type-from-lexicon
        level: requirement
        check: sources
        text: >-
          Le type d'une référence doit être un ou plusieurs de `primary`, `secondary`,
          `marketing`, écrits comme les mots du lexique et séparés par des virgules, puis au
          choix une remarque entre parenthèses.
      - id: reference-consulted-date
        level: requirement
        check: sources
        text: La cellule « consulté le » d'une référence doit commencer par `YYYY-MM-DD`.
      - id: references-per-concept
        level: requirement
        method: inspection
        text: >-
          Les références doivent être propres au concept : chaque concept cite les siennes.
      - id: unverified-entry-anchored
        level: requirement
        check: sources
        text: >-
          Chaque entrée de « Non vérifié » doit s'ouvrir sur sa section, sous les formes de la
          colonne section ou `headings.stances`, puis « : ».
      - id: unverified-entry-content
        level: requirement
        method: inspection
        text: >-
          « Non vérifié » doit être une liste, vide au besoin ; chaque entrée dit, après sa
          section, ce qu'aucune source consultée ne confirme, pourquoi et, au besoin, la consigne
          qui suit (« écrire X, pas Y »).
      - id: unverified-keeps-no-removed
        level: requirement
        method: inspection
        text: >-
          « Non vérifié » ne doit garder aucune trace d'une affirmation retirée : l'historique git
          en est la trace.
      - id: cited-ids-exist
        level: requirement
        check: sources
        text: >-
          Chaque id cité (`refs` du frontmatter, colonne source) doit exister dans « Références ».
      - id: every-reference-cited
        level: requirement
        check: sources
        text: >-
          Chaque référence doit être citée par une affirmation ou un élément du frontmatter.

  - title: Les conventions du texte lecteur (course/README.md section 3.5)
    purpose: >-
      Les conventions sous lesquelles la structure de `concept.md` reste du Markdown simple : le
      site fait de chacune son HTML et ses classes, le professeur les lit comme du Markdown
      ordinaire, et un message d'échec nomme la convention.
    category: writing
    method: test
    rules:
      - id: subconcept-section-form
        level: requirement
        check: conventions
        text: >-
          Une section de sous-concept doit être `## <id> <title>`, puis un paragraphe tout en
          italique, la promesse ; un sous-concept de premier niveau qui a des enfants ne tient
          rien d'autre, un sans enfant tient son texte lecteur après la promesse.
      - id: leaf-heading-form
        level: requirement
        check: conventions
        text: Un titre de feuille doit être `### <id> <title>`, puis le texte lecteur.
      - id: heading-title-from-course-yaml
        level: requirement
        check: conventions
        text: >-
          Le `<title>` d'un titre de sous-concept doit être égal à son `title` dans
          `course.yaml`.
      - id: concept-reference-resolves
        level: requirement
        check: conventions
        text: >-
          Une référence de concept doit nommer un concept ou un sous-concept existant du cours ;
          une référence à une annexe, un numéro d'annexe ou l'id d'un sous-concept d'annexe.
      - id: teaching-concept-reference-form
        level: requirement
        method: inspection
        text: >-
          Dans `teaching.md`, une référence de concept doit suivre la même forme que dans
          `concept.md`.
      - id: stance-marker-plain-text
        level: requirement
        check: conventions
        text: >-
          Un marqueur de position doit être du texte simple juste après l'affirmation qu'il
          qualifie ; aucune définition de référence de lien ne porte l'étiquette d'un marqueur.
      - id: storyline-blockquote-form
        level: requirement
        check: conventions
        text: >-
          Dans les sections de sous-concept, une citation en bloc doit être une citation du fil
          rouge, sa première ligne commençant par `**Fil rouge :**` (`markers.storyline`).
      - id: diagram-image-form
        level: requirement
        check: conventions
        text: >-
          Une image de schéma doit être `![<title>](<file>)` seule dans son paragraphe, `<file>`
          un schéma déclaré et `<title>` son `title` déclaré ; chaque schéma déclaré apparaît une
          fois dans le corps.
      - id: diagram-image-placed
        level: requirement
        method: inspection
        text: >-
          Une image de schéma doit se trouver dans la section de son `subconcept` (l'une de ses
          sections `###` comprise) ou dans « L'essentiel ».
      - id: pitfalls-form
        level: requirement
        check: conventions
        text: >-
          « Pièges » doit être une liste à puces, chaque élément ouvert par le piège en gras.
      - id: quick-test-form
        level: requirement
        check: conventions
        text: >-
          « Le test rapide » doit être une citation en bloc (la question), puis au plus un
          paragraphe (la note).

  - title: Les fichiers de domaine (course/README.md section 4)
    purpose: >-
      Un fichier de domaine est l'entrée d'un domaine : le problème qu'il règle, l'enchaînement
      de ses concepts, sa place dans le cours, et une situation du fil rouge qui le traverse. Le
      même texte sert le lecteur et le professeur.
    category: structure
    method: test
    rules:
      - id: domain-files-listed
        level: requirement
        check: course-files
        text: Chaque fichier de `domains/` doit être le `file` d'un domaine de `course.yaml`.
      - id: domain-frontmatter-description
        level: requirement
        check: course-files
        text: >-
          Le frontmatter d'un fichier de domaine doit être `description`, une phrase pour le site,
          et rien d'autre.
      - id: domain-file-no-h1
        level: requirement
        check: course-files
        text: Un fichier de domaine ne doit pas avoir de H1.
      - id: domain-sections-in-order
        level: requirement
        check: course-files
        text: >-
          Le corps d'un fichier de domaine doit être « Le problème », « Le fil des concepts »,
          « D'où l'on vient, où l'on va », « Un cas qui traverse le domaine », toutes présentes
          et non vides, dans cet ordre.
      - id: concept-thread-paragraphs
        level: requirement
        check: course-files
        text: >-
          « Le fil des concepts » doit tenir un paragraphe par concept du domaine, dans l'ordre,
          ouvert par `**<number>. <concept title>.**`, le titre tel que dans `course.yaml` ; un
          domaine d'un seul concept, un paragraphe pour le concept, puis un par sous-concept de
          premier niveau, ouvert par `**<id>. <title>.**`.
      - id: domain-section-content
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          Chaque section d'un fichier de domaine doit dire ce que son titre annonce : « Le
          problème », la difficulté rencontrée sans les concepts du domaine ; « Le fil des
          concepts », un court paragraphe par concept ; « D'où l'on vient, où l'on
          va », ce que le domaine précédent donne à celui-ci et ce que celui-ci donne au suivant ;
          « Un cas qui traverse le domaine », une situation du fil rouge où chaque concept du
          domaine sert, dans l'ordre, sans donner la réponse.
      - id: domain-text-for-reader
        level: requirement
        category: writing
        method: inspection
        text: >-
          Un fichier de domaine ne doit tenir aucun texte pour le professeur seul : tout son texte
          est pour le lecteur.
      - id: domain-teaches-no-concept
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          Un fichier de domaine ne doit enseigner aucun concept ni faire d'affirmation qu'un
          concept du domaine ne fait pas : il n'a pas de fichier de sources.
      - id: domain-first-sentence-ends
        level: requirement
        category: writing
        check: domain-first-sentence
        text: >-
          La première phrase de chaque paragraphe de « Le fil des concepts », après l'amorce, doit
          finir par `.`, `?` ou `!` dans les 300 caractères qui suivent l'amorce.
      - id: domain-first-sentence-stands-alone
        level: recommendation
        category: writing
        check: domain-first-sentence-standalone
        text: >-
          Il convient que la première phrase de chaque paragraphe de « Le fil des concepts », après
          l'amorce, ne s'ouvre pas sur un mot de la liste `checks.anaphora` du lexique.

  - title: Les fichiers du cours (course/README.md section 5)
    purpose: >-
      Les fichiers qui tiennent ce qui couvre tout le cours : à qui il s'adresse et comment le
      professeur accueille un apprenant (`plan.md`), ses termes (`glossary.md`), le monde où vivent
      ses cas (`storyline.md`), son histoire (`CHANGELOG.md`).
    category: structure
    method: test
    rules:
      - id: plan-audience-first
        level: requirement
        check: course-files
        text: >-
          La première section `##` de `plan.md` doit être « Public cible », la prose complète du
          public.
      - id: plan-onboarding-section
        level: requirement
        check: course-files
        text: >-
          `plan.md` doit avoir une section « Accueil » : un paragraphe qui donne la posture du
          professeur, puis une liste numérotée des questions d'accueil, qui clôt la section.
      - id: onboarding-question-form
        level: requirement
        check: course-files
        text: >-
          Une question d'accueil doit être `<n>. **<question label>** : <question>`, au moins
          une, les libellés de question distincts.
      - id: onboarding-asks-no-pace
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          « Accueil » ne doit poser aucune question sur le rythme : le professeur ajuste le rythme
          au fil du cours.
      - id: plan-optional-sections
        level: permission
        method: inspection
        text: >-
          `plan.md` peut avoir un H1 et, après « Accueil », d'autres sections `##` que le professeur
          lit : les partis pris du cours (« Parti pris : une équipe en sprints »), ses propres
          règles d'écriture.
      - id: glossary-table-four-columns
        level: requirement
        check: course-files
        text: >-
          `glossary.md` doit tenir un tableau, avant toute section `##`, de quatre colonnes,
          chaque ligne avec un terme.
      - id: glossary-intro-and-h1
        level: permission
        method: inspection
        text: "`glossary.md` peut avoir un H1 et une introduction avant son tableau."
      - id: glossary-english-term
        level: requirement
        category: writing
        method: inspection
        text: >-
          La deuxième colonne d'une ligne du glossaire doit donner le terme anglais du terme du
          cours, vide quand le terme n'a pas d'équivalent anglais utile ou quand le terme du cours
          est déjà le mot anglais.
      - id: glossary-defining-concept-form
        level: requirement
        check: course-files
        text: >-
          La quatrième cellule d'une ligne du glossaire doit être un numéro de concept de
          `course.yaml`, le concept de définition.
      - id: glossary-defining-concept-teaches
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          Le concept de définition d'un terme doit être celui qu'un apprenant ouvre pour creuser le
          terme, celui dont le texte lecteur l'enseigne (son objectif ou l'un de ses
          sous-concepts en traite), pas un concept qui l'emploie ou le définit en passant avec une
          référence de concept vers un autre ; de deux concepts qui l'enseignent aussi à fond, le
          premier dans l'ordre du cours.
      - id: glossary-term-taught
        level: requirement
        category: pedagogy
        method: inspection
        text: Chaque terme du glossaire doit être enseigné par un concept du cours.
      - id: glossary-definition-from-concept
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          La définition d'un terme doit résumer le texte lecteur de son concept de définition et
          ne rien affirmer qu'il n'affirme pas.
      - id: glossary-no-usage-list
        level: requirement
        method: inspection
        text: >-
          Le glossaire ne doit pas lister les concepts qui emploient un terme : un script ou le
          site le calcule à partir des variantes.
      - id: glossary-variant-in-one-row
        level: requirement
        check: course-files
        text: >-
          Une variante doit appartenir à une seule ligne : deux lignes ne tiennent pas la même
          variante, casse ignorée, qualificatif compris.
      - id: glossary-avoid-section
        level: requirement
        check: course-files
        text: >-
          La seule section `##` de `glossary.md` doit être « Termes à éviter », un tableau de
          trois colonnes.
      - id: glossary-term-after-defining-concept
        level: recommendation
        category: pedagogy
        check: glossary-order
        text: >-
          Il convient qu'un terme du glossaire soit employé après son concept de définition, dans
          l'ordre du cours, dans le `concept.md` de chaque concept, son corps et son frontmatter ;
          avant ce concept, seulement dans une phrase qui porte une référence de concept vers le
          concept de définition ou vers l'un de ses sous-concepts.
      - id: qualified-term-order-reviewed
        level: recommendation
        category: pedagogy
        method: inspection
        text: >-
          Il convient qu'un terme dont la cellule porte un qualificatif de sens, entre
          parenthèses, soit lui aussi employé après son concept de définition : `glossary-order`
          ne lit pas sa ligne, faute de distinguer les sens d'un homonyme, et la revue le fait.
      - id: term-defined-in-passing
        level: permission
        category: pedagogy
        method: inspection
        text: >-
          Avant son concept de définition, un terme du glossaire peut figurer dans une phrase qui
          le définit en passant.
      - id: storyline-names-learner-role
        level: requirement
        category: pedagogy
        method: inspection
        text: "`storyline.md` doit nommer le rôle que l'apprenant y tient."
      - id: storyline-in-spec-language
        level: requirement
        category: writing
        method: inspection
        text: "`storyline.md` doit être écrit dans la langue de la spec."
      - id: cases-follow-storyline
        level: requirement
        category: pedagogy
        method: inspection
        text: >-
          Les cas doivent prendre leurs acteurs et leurs faits dans `storyline.md`, sans le
          contredire.
      - id: changelog-unreleased-first
        level: requirement
        check: course-files
        text: La première section `##` de `CHANGELOG.md` doit être « Non publié ».
      - id: changelog-release-sections
        level: requirement
        check: course-files
        text: >-
          Après « Non publié », `CHANGELOG.md` doit tenir une section par version publiée, la plus
          récente d'abord, `## X.Y.Z, YYYY-MM-DD`.
      - id: changelog-entry-form
        level: requirement
        check: course-files
        text: >-
          Une entrée du changelog doit être une ligne `- MAJOR|MINOR|PATCH, <where> : <what>`.
      - id: changelog-intro-and-closing
        level: permission
        method: inspection
        text: >-
          `CHANGELOG.md` peut avoir une introduction et, en dernier, un paragraphe libre (la ligne
          qui relie le cours à son histoire d'avant 0.1.0).

  - title: Le contrat de dessin (course/README.md section 6.1)
    purpose: >-
      Les règles qui gardent un SVG sûr et lisible chez chacun de ses consommateurs :
      `svg-contract` vérifie ce qu'un script peut dire, une revue le reste.
    category: diagrams
    method: test
    rules:
      - id: svg-file-form
        level: requirement
        check: svg-contract
        text: >-
          Un schéma doit être `<stem>.svg`, le radical en mots ASCII minuscules joints par des
          traits d'union ; du XML bien formé ; 32 Ko au plus.
      - id: svg-frame
        level: requirement
        check: svg-contract
        text: >-
          La racine `<svg>` doit avoir `xmlns` et un `viewBox`, et ni `width` ni `height`.
      - id: svg-colour
        level: requirement
        check: svg-contract
        text: >-
          La racine doit avoir `fill="currentColor"` ; chaque `fill` et chaque `stroke` est
          `currentColor` ou `none` ; aucune autre valeur de couleur, aucun attribut `style`, aucun
          élément `<style>` ; les seules classes sont `primary`, `secondary` et `muted`.
      - id: svg-text
        level: requirement
        check: svg-contract
        text: >-
          Les mots doivent être des `<text>` (et des `<tspan>`), jamais des tracés, avec au moins
          un `<text>` ; les polices seulement par l'attribut `font-family` avec des familles
          génériques (`system-ui`, `sans-serif`, `serif`, `monospace`), aucun fichier de police,
          aucun `@font-face`.
      - id: svg-accessibility
        level: requirement
        check: svg-contract
        text: >-
          La racine doit avoir `role="img"` et `aria-labelledby` nommant son `<title>` (et sa
          `<desc>` si elle est là) ; `<title>` est le premier enfant de la racine et égal au
          `title` du frontmatter ; leurs ids commencent par le radical.
      - id: svg-groups
        level: requirement
        check: svg-contract
        text: >-
          Chaque enfant dessiné de la racine doit être un `<g>` d'`id` `<sub-concept>-<element>` :
          un id de sous-concept du concept, un trait d'union, des lettres ASCII minuscules et des
          chiffres joints par des traits d'union (`9a1-couches`, `9a1-tranche-1`), jamais un id
          de sous-concept nu, qui est l'ancre du texte lecteur ; cet id est unique parmi les
          schémas du concept. Un `<defs>`, qui n'est pas dessiné, peut se tenir à la racine à
          côté d'eux, et ce qu'il tient suit ce contrat.
      - id: svg-forbidden-elements
        level: requirement
        check: svg-contract
        text: >-
          Un schéma ne doit tenir aucun `<script>`, aucun attribut `on*`, aucune `<image>`, aucun
          `<foreignObject>`, aucun `href` ni `xlink:href` qui ne commence pas par `#`, et aucune
          ressource externe.
      - id: diagram-shows-caption
        level: requirement
        method: inspection
        text: Un schéma doit montrer ce que dit sa légende.

  - title: Le style des schémas (course/README.md section 6.2)
    purpose: >-
      Une signification par classe et six principes, pour qu'un même rôle ait le même aspect d'un
      concept à l'autre, quel que soit qui dessine.
    category: diagrams
    method: inspection
    rules:
      - id: class-meanings
        level: requirement
        text: >-
          Chaque classe doit signifier la même chose dans chaque schéma d'un cours : `primary` ce
          que le schéma enseigne, son foyer ; `secondary` le contraste, un second élément opposé
          au premier ; `muted` le contexte et le texte ordinaire.
      - id: one-idea-per-diagram
        level: requirement
        text: >-
          Un schéma doit porter une seule idée : une légende qui demande deux phrases fait deux
          schémas.
      - id: diagram-roles
        level: requirement
        text: >-
          Un schéma doit avoir un sujet, au plus un contraste, un contexte et du texte ; une série
          est le sujet en niveaux ; un état (fait, pas fait, refusé) se dit par la forme.
      - id: role-rendering
        level: requirement
        text: >-
          Chaque rôle doit être rendu ainsi : le sujet en `primary`, opacité 1 ; une série en
          `primary` à opacité décroissante (1, 0.7, 0.4) ; le contraste en `secondary` ; le
          contexte en `muted`, une opacité basse pour les remplissages, moyenne pour les traits ;
          le texte en `muted`, opacité 1, `primary` seulement quand le mot est le sujet ; l'état
          plein pour fait, en tirets pour pas fait ou incertain, barré pour refusé. En une
          couleur, rien n'est plus marqué que le sujet ; le contraste diffère du sujet par
          l'opacité ou la forme, pas par la teinte seule.
      - id: readable-in-one-colour
        level: requirement
        text: >-
          L'opacité et la forme doivent porter chaque distinction, jamais la teinte seule ; le
          texte reste toujours lisible : jamais en réserve dans un remplissage, jamais sur un
          remplissage plus sombre que lui.
      - id: diagram-default-width
        level: recommendation
        text: Il convient que le `viewBox` d'un schéma fasse 600 unités de large.
      - id: diagram-composition
        level: requirement
        text: >-
          Un schéma doit se lire de gauche à droite ou de haut en bas, et tenir peu d'éléments,
          espacés ; son texte est dans les mots du cours, jamais sous 14 unités.
      - id: diagram-text-content
        level: requirement
        text: >-
          Le texte d'un schéma doit se limiter à ses étiquettes et, quand une distinction de forme
          ou d'opacité doit être nommée, à une clé (un échantillon et un mot) ; aucune
          phrase d'enseignement, qui est la `caption` ; aucune décoration, icône ni dégradé.
