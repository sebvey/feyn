# The form of the files of a course of `linear-course`, as data (decision `unit-is-the-content-unit`):
# the concept file (the files of a concept folder, the parts of `concept.md`, its frontmatter, its
# title, its head, its sections and units, its foot, the blocks of a unit and their fields, its
# cases, the length of a teacher message), `sources.md` beside it and the course files (`course.yaml` as the
# map, `logo.svg`, `plan.md`, the domain file, `storyline.md`, `glossary.md`, `CHANGELOG.md`): their parts,
# their order, their presence, published or not, their readers.
# course/README.md sections 1 to 5 describe it, the rules of course/rules.yaml state it, the
# checks read it here (concept-file, unit-contract, teacher-message-length, and the text checks and
# unit-additions for their scope; course-yaml and course-files for the course files), and the
# spec half of the site build, site/build/render-site, reads `published` here (site/build/README.md).
#
# This file names words by their key in course/lexicon.yaml and holds none: `heading: essentials`
# is the lexicon's `headings.essentials`, a field `matter` is `unit_fields.matter`, a block `lesson`
# is `unit_blocks.lesson`, the kind word `case` of a case's heading is `block_kinds.case`. A spec of another
# language copies the lexicon, not this file.
#
# presence: mandatory or optional. published: the site build renders it (true) or never (false);
# the build is closed by default, so a part this file does not name, or names without
# `published: true`, is never rendered. No heading says who reads its part: this file does.
# readers: who reads it, among
#   site     the site reader, through the build (the published parts);
#   teacher  the teacher, which reads the whole file;
#   learner  the learner, who hears it from the teacher or reads it on the site: the text checks
#            (conventions, glossary-order) read every part of a concept file the learner reads,
#            and only those; unit-additions, the fields of a unit the learner reads.

# The files of a concept folder, and nothing else.
folder:
  files: [concept.md, sources.md]
  diagrams: "*.svg"

concept_file:
  file: concept.md
  # the frontmatter, its keys and their form: the schema, which concept-file validates it against
  frontmatter: course/schemas/concept-frontmatter.schema.yaml
  # the keys of the frontmatter, each published whole, an item with its author, its refs and its
  # verified: the stances, under the heading `headings.stances`; the neighbours; the diagrams, each
  # entry with its SVG file
  frontmatter_fields:
    stances:
      heading: stances
      published: true
      readers: [site, teacher, learner]
    neighbors:
      published: true
      readers: [site, teacher, learner]
    diagrams:
      published: true
      readers: [site, teacher, learner]
  # Every heading of the body starts with its kind, and one kind is always at one level: the
  # concept's title at #, the head, the sections and the foot at ##, the foot's blocks and the
  # units at ###, a unit's blocks at #### (`unit` below). A heading that carries an id is
  # `<kind word> <id><separator><title>`, the kind word and the separator of the lexicon's
  # `block_kinds`, the separator by its key.
  separator: separator
  # the title: the one # heading, the first line of the body, `# Concept <n> : <title>` (an annex
  # `# Annexe <id> : <title>`), the title the concept's `title` in course.yaml, which keeps it too
  title:
    heading_level: 1
    kind: concept
    annex_kind: annex
    presence: mandatory
    published: true
    readers: [site, teacher, learner]
  # the head: the ## heading `headings.essentials`, then its text, the one written summary of the
  # concept, and no ### heading
  head:
    heading: essentials
    presence: mandatory
    published: true
    readers: [site, teacher, learner]
  # the sections: `## Section <id> : <title>`, the id the concept number then a letter from a, in
  # order; a section holds its units, `### Unité <id> : <title>`, the id the section's then a digit
  # from 1, in order, one at least and nine at most: a section with a single unit keeps its ### heading.
  # Nothing else stands in a section: no line outside a unit. `published`: the headings of the
  # sections and units, their ids and titles; what a unit holds is its blocks' (`unit`).
  sections:
    kind: section
    unit_kind: unit
    presence: mandatory
    published: true
    readers: [site, teacher, learner]
    heading_level: 2
    unit_heading_level: 3
    max_units: 9
  # the foot: the ## heading `headings.foot`, then its ### blocks, in this order, and nothing else;
  # present when it holds a block; `published`: its heading, each block of its own
  foot:
    heading: foot
    presence: optional
    published: true
    readers: [site, teacher, learner]
    blocks:
      - heading: landmarks
        presence: optional
        published: true
        readers: [site, teacher, learner]
      - heading: deepening
        presence: optional
        published: true
        readers: [site, teacher, learner]
      - heading: instruction
        presence: optional
        published: false
        readers: [teacher]

# A unit: one teacher message. Its #### blocks, in this order, the order of writing (teach, ask,
# instruct); nothing else stands in a unit. A block's heading is its word alone, `#### Leçon`: the
# word `unit_blocks.<block>` for a block of labelled fields, the label of its one field for a block
# of one unlabelled field (`unit_fields.<field>`). Each block is of one publication: `published`
# and `readers` are the block's, its fields have none of their own.
#   labelled: true   its fields, `- **<label>** : <text>`, the label `unit_fields.<field>` and
#                    nothing between it and the colon, in the order of `fields`, a field's
#                    following lines indented two spaces; no line outside a field
#   labelled: false  its one field, unlabelled: the instruction, prose
#   misconceptions   in a block of labelled fields, the field `field` holds a list of
#                    misconceptions on the lines below its label, nothing after its colon: each
#                    `  - **<name>** : « <belief> »`, its name unique in its unit, then, indented
#                    four spaces, its parts of `parts`, each `    - **<label>** : <text>`, the label
#                    `unit_fields.<part>`, in that order, each once and mandatory, a part's
#                    following lines indented six spaces; nothing else under a misconception.
#                    The lesson's two fields are the matter of the unit: what is true, then what
#                    seems true and is not (decision `misconception-is-matter`)
#   cases            a block that holds a list of cases, one at least, each under its heading
#                    `##### <kind word><separator><title>` (heading_level, the kind word
#                    `block_kinds.<kind>`, the separator the concept file's), then its labelled
#                    fields, those of `fields` in their order, each once and mandatory; no line
#                    before the first case's heading. The first case is the unit's case, always
#                    posed; each other is a supplementary case, the unit's stock, among which the
#                    teacher picks (decision `cases-name-their-misconceptions`). A case's title is its id, unique
#                    among the cases of its concept: the learner's memory cites it. A case holds no
#                    misconception: its field `in_play.field` names, by their names, separated by
#                    `in_play.separator`, the misconceptions of its unit its situation makes
#                    tempting, one at least, only those of its unit; each misconception of the unit
#                    is named by one case at least; each one the unit's case names is, it is
#                    recommended, named by a supplementary case too. `revealed`: the fields the
#                    site shows hidden until the reader reveals them.
unit:
  heading_level: 4
  blocks:
    - block: lesson
      presence: mandatory
      # the site renders the matter, then the cases, then the misconceptions, each with its name,
      # its belief, its root and its correction: it does not give a misconception away before the
      # question
      published: true
      readers: [site, teacher, learner]
      labelled: true
      fields: [matter, misconceptions]
      misconceptions:
        field: misconceptions
        parts: [root, correction]
    - block: cases
      presence: mandatory
      # the site renders each case under its heading; it shows the expected answer hidden until
      # the reader reveals it, and with it the misconceptions in play, each name a link to its
      # misconception
      published: true
      readers: [site, teacher, learner]
      labelled: true
      fields: [anchor, question, expected_answer, misconceptions_in_play]
      cases:
        heading_level: 5
        kind: case
        in_play:
          field: misconceptions_in_play
          separator: ";"
        # the fields the site shows hidden until the reader reveals them; the teacher says the
        # expected answer only once the learner has answered
        revealed: [expected_answer, misconceptions_in_play]
    - block: instruction
      presence: optional
      published: false
      readers: [teacher]
      labelled: false
      fields: [instruction]
  # the length of one teacher message: the text of these fields, the unit's case's and not those
  # of a supplementary case, the misconceptions left out, counted in lines of `line` characters (its
  # characters, label and indentation left out, divided by `line`); above `max`,
  # teacher-message-length reports it (a signal, not an error)
  length:
    fields: [matter, anchor, question]
    line: 100
    max: 12

# sources.md, beside concept.md in each concept folder (course/README.md section 3.4): its three ##
# sections, in this order, each holding a table but the last (the check `sources` holds the order).
# The site builds every row of « Affirmations » and « Références », never « Non vérifié ».
sources:
  file: sources.md
  sections:
    - heading: claims
      presence: mandatory
      published: true
      readers: [site, teacher, learner]
    - heading: references
      presence: mandatory
      published: true
      readers: [site, teacher, learner]
    - heading: unverified
      presence: mandatory
      published: false
      readers: [teacher]

# The course files, beside the concept file: what spans the course, and nothing a unit or the map
# already says.

# course.yaml, the map of the course: its identity, its domains and its concepts, nothing below a
# concept (the tree of a concept is the headings of its concept.md). Its fields, their presence
# and their form: the schema, which course-yaml validates it against. The site renders its titles,
# objectives and order; the teacher reads the order it teaches in and the prerequisites.
course_map:
  file: course.yaml
  schema: course/schemas/course.schema.yaml
  published: true
  readers: [site, teacher]

# logo.svg, the logo of the course, at the root of the course folder, its name fixed here: one
# colour, currentColor, square, self-contained (course/README.md section 1); course-yaml checks it.
# The site shows it in its header, painted in the accent colour of the course (`site.accent_color`
# of course.yaml), and the build derives the favicon and the share image from it; render-site gives
# it to the engine as the file's text.
logo:
  file: logo.svg
  presence: mandatory
  published: true
  readers: [site]

# plan.md: an optional H1, then these ## headings, in this order; after them, optional ##
# sections of free titles that the teacher reads (the course's stances, its own writing rules, the
# questions it asks again and again across the course).
plan:
  file: plan.md
  sections:
    - heading: audience
      presence: mandatory
      published: true
      readers: [site, teacher, learner]
    - heading: onboarding
      presence: mandatory
      published: false
      readers: [teacher]
    - heading: progression
      presence: mandatory
      published: true
      readers: [site, teacher, learner]
  free_sections:
    presence: optional
    published: false
    readers: [teacher]

# A domain file, `domains/<number>-<slug>.md`: no frontmatter, no H1, these ## headings, in this
# order, and nothing else. Its thread of concepts is written nowhere: the build composes it from
# course.yaml (the domain's concepts, their titles and their objectives).
domain_file:
  folder: domains
  frontmatter: false
  sections:
    - heading: problem
      presence: mandatory
      published: true
      readers: [site, teacher, learner]
    - heading: crossing_case
      presence: mandatory
      published: true
      readers: [site, teacher, learner]

# storyline.md: the world, its H1 and the ## sections of free titles before the fixed facts (the
# setting, the actors, the sources); then the fixed facts, the last ## section, one bullet per
# fact, each ending with the id of the unit that fixed it in parentheses, `(0d1)`, a final period
# allowed after it. The fixed facts are optional while no unit is written. The site shows the
# world; the fixed facts are a writing aid, read by the teacher and the creator, never published.
storyline:
  file: storyline.md
  world:
    presence: mandatory
    published: true
    readers: [site, teacher, learner]
  fixed_facts:
    heading: fixed_facts
    presence: optional
    position: last
    published: false
    readers: [teacher]

# glossary.md: an H1 and an introduction, not published; its first table, one term per row, before
# any ## section; then « Termes à éviter », its one ## section, optional, a table of three columns.
glossary:
  file: glossary.md
  table:
    presence: mandatory
    published: true
    readers: [site, teacher, learner]
  sections:
    - heading: avoid
      presence: optional
      published: true
      readers: [site, teacher, learner]

# CHANGELOG.md: « Non publié » first (`headings.unreleased`), then the releases, newest first, each
# `## X.Y.Z, YYYY-MM-DD`. The site shows the latest release, its version and its date; « Non
# publié », the entries and the older releases are not named, never rendered. With no release, the
# site writes its own « version non publiée ».
changelog:
  file: CHANGELOG.md
  latest_release:
    published: true
    readers: [site]
