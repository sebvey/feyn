# The lexicon of the course files of `linear-course`: the one source of the words a program must
# recognise in a course file (headings, block kinds, unit fields, qualifiers, markers, natures, concept
# references, source types, typography), read by the checks, the classroom build and the site,
# none of which writes them again (course/README.md section 7;
# decision `lexicon-not-language-pack`). The spec is French (`language: fr` in spec.yaml): the
# values are course text, in French. The keys are those of course/README.md section 7
# (`lexicon-keys`, a test of check-spec, verifies them). Typography of these values: space before
# « : », « ; », « ? », « ! », quotes « »; no em-dash, no arrow (the list under `typography.banned`
# names them).

# Section titles of the course files.
headings:
  essentials: "L'essentiel"
  stances: "Consensus et choix d'école"
  deepening: "Approfondissement"
  landmarks: "Se vérifier"
  instruction: "Consigne"
  head: "Ouverture"
  foot: "Clôture"
  claims: "Affirmations"
  references: "Références"
  unverified: "Non vérifié"
  problem: "Le problème"
  crossing_case: "Un cas qui traverse le domaine"
  audience: "Public cible"
  onboarding: "Accueil"
  progression: "Progression"
  fixed_facts: "Faits fixés"
  avoid: "Termes à éviter"
  unreleased: "Non publié"

# The kind words that open the headings of a concept file (course/form.yaml): `# Concept 4 : <titre>`,
# `# Annexe A1 : <titre>`, `## Section 4a : <titre>`, `### Unité 4a1 : <titre>`.
block_kinds:
  concept: "Concept"
  annex: "Annexe"
  section: "Section"
  unit: "Unité"

# Labels of the fields of a unit of a concept file and of its supplementary cases
# (course/form.yaml).
unit_fields:
  matter: "Matière"
  anchor: "Ancrage"
  question: "Question"
  expected_answer: "Réponse attendue"
  misconceptions: "Idées fausses"
  instruction: "Consigne"

# The stance markers of the published text: `[cours]`, `[école]`, `[consensus]`.
markers:
  consensus: "consensus"
  school: "école"
  course: "cours"

# The nature of a claim of `sources.md` that is not a stance marker: what a source says with no
# stance (a tool's default, a date, a figure). The other natures are the markers consensus,
# school, course (course/README.md 3.4). Read by `sources` only: never a marker of the published text.
natures:
  fact: "fait"

# The qualifiers of a supplementary case, one in its heading and no other word (the group of
# course/rules.yaml for course/README.md section 3.3).
qualifiers:
  fallback: "rechange"
  practice: "entraînement"
  aside: "aparté"

# The words of a concept reference in the text of a course: « concept 4 », « concepts 5 et 7b »,
# « annexe A2 » (course/README.md 3.5).
concept_refs:
  concept: "concept"
  concepts: "concepts"
  and: "et"
  annex: "annexe"

# The types of a reference of `sources.md`.
source_types:
  primary: "primaire"
  secondary: "secondaire"
  marketing: "marketing"

# `rules`: what the teacher does, as a clause of a sentence (no final period). `banned`: the
# characters course text never uses, the em-dash and the arrows (the ASCII `->`, `<-` and `=>` included).
typography:
  rules: "espace avant « : », « ; », « ? » et « ! » ; guillemets « »"
  banned: ["—", "→", "←", "↔", "↑", "↓", "↕", "↗", "↘", "↖", "↙", "↦", "↳", "↪", "⇒", "⇐", "⇔", "⇨", "⟶", "⟵", "⟷", "⟹", "⟸", "⟺", "➜", "➔", "➝", "➞", "➡", "⬅", "⬆", "⬇", "->", "<-", "=>"]
