# The shape of what render-site prints (README.md, this folder): the published parts of one course
# (course/form.yaml, `published: true`), with the words and the URL scheme of the site, the contract
# between this spec MAJOR and the site engine, which validates the document against this schema
# before it lays out a page. A text is the course's Markdown as written (`markdown` below): no
# course text is rewritten, its stance markers and concept references stay in it as written,
# `concept_refs` naming what each reference points to. A part the form does not publish has no key:
# no key holds « Consigne au professeur », « Accueil » nor « Non vérifié ».
$schema: https://json-schema.org/draft/2020-12/schema
title: the published parts of a course, for its site
type: object
required: [spec, language, course, plan, domains, concepts, storyline, glossary, concept_refs, words, url_scheme]
additionalProperties: false
properties:
  spec:
    description: "<name>@<MAJOR>: the spec MAJOR that rendered the document"
    type: string
    pattern: '^linear-course@1$'
  language:
    description: the language of the courses of the spec MAJOR, `language` of its spec.yaml (ISO 639-1), that of every page of the site
    type: string
    pattern: '^[a-z]{2}$'
  course:
    description: the course, from course.yaml
    type: object
    required: [id, title, logo, accent_color, annexes]
    additionalProperties: false
    properties:
      id: { $ref: '#/$defs/slug' }
      title: { $ref: '#/$defs/line' }
      subtitle: { $ref: '#/$defs/line' }
      logo:
        description: the course's logo, the text of its logo.svg as written, one colour in currentColor
        type: string
        pattern: '<svg'
      accent_color:
        description: the course's accent colour, site.accent_color of course.yaml, one #rrggbb
        type: string
        pattern: '^#[0-9a-fA-F]{6}$'
      annexes:
        type: array
        items: { $ref: '#/$defs/number' }
  plan:
    description: the published ## sections of plan.md, in the order of the form
    $ref: '#/$defs/sections'
  domains:
    description: the domains, in the order of course.yaml
    type: array
    minItems: 1
    items:
      type: object
      required: [number, slug, title, objective, concepts, path, sections]
      additionalProperties: false
      properties:
        number: { type: integer, minimum: 1 }
        slug: { $ref: '#/$defs/slug' }
        title: { $ref: '#/$defs/line' }
        objective: { $ref: '#/$defs/line' }
        duration_min: { type: integer, minimum: 1 }
        concepts:
          description: the numbers of its concepts, in order
          type: array
          items: { $ref: '#/$defs/number' }
        path: { $ref: '#/$defs/path' }
        sections:
          description: the published ## sections of the domain file
          $ref: '#/$defs/sections'
  concepts:
    description: the concepts and the annexes, in the order of course.yaml
    type: array
    minItems: 1
    items: { $ref: '#/$defs/concept' }
  storyline:
    description: storyline.md; null when the course has none
    oneOf:
      - type: 'null'
      - type: object
        additionalProperties: false
        properties:
          world:
            description: its H1, the text under it and its ## sections of free titles; the only part of storyline.md the site shows
            type: object
            required: [title, text, sections]
            additionalProperties: false
            properties:
              title: { oneOf: [{ type: 'null' }, { $ref: '#/$defs/line' }] }
              text: { $ref: '#/$defs/markdown' }
              sections:
                type: array
                items:
                  type: object
                  required: [heading, text]
                  additionalProperties: false
                  properties:
                    heading: { $ref: '#/$defs/line' }
                    text: { $ref: '#/$defs/markdown' }
  glossary:
    description: glossary.md, its first table and its published ## sections; null when the course has none
    oneOf:
      - type: 'null'
      - type: object
        required: [sections]
        additionalProperties: false
        properties:
          table: { $ref: '#/$defs/table' }
          sections: { $ref: '#/$defs/tableSections' }
  release:
    description: the latest release of the course's CHANGELOG.md, null while it has none (the site then writes its own « version non publiée »); no key when the form does not publish it
    oneOf:
      - type: 'null'
      - type: object
        required: [version, date]
        additionalProperties: false
        properties:
          version: { type: string, pattern: '^\d+\.\d+\.\d+$' }
          date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
  concept_refs:
    description: each distinct concept reference of the published text, as written (« concept 0b », « annexe A1 »), with what it names
    type: array
    items:
      type: object
      required: [text, targets]
      additionalProperties: false
      properties:
        text: { $ref: '#/$defs/line' }
        targets:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, concept, path, anchor]
            additionalProperties: false
            properties:
              id: { type: string }
              concept: { oneOf: [{ type: 'null' }, { $ref: '#/$defs/number' }] }
              path: { oneOf: [{ type: 'null' }, { $ref: '#/$defs/path' }] }
              anchor:
                description: the id of the section or unit named, null for a whole concept
                oneOf: [{ type: 'null' }, { $ref: '#/$defs/id' }]
  words:
    description: the words of the site
    type: object
    required: [course, site]
    additionalProperties: false
    properties:
      course:
        description: of course/lexicon.yaml, the words the published parts carry, by group and key
        type: object
        required: [headings, block_kinds, unit_blocks, unit_fields, markers]
        additionalProperties: false
        properties:
          headings:
            $ref: '#/$defs/words'
            type: object
            propertyNames: { not: { enum: [instruction, onboarding, unverified, unreleased] } }
          block_kinds: { $ref: '#/$defs/words' }
          unit_blocks: { $ref: '#/$defs/words' }
          unit_fields:
            $ref: '#/$defs/words'
            type: object
            propertyNames: { not: { enum: [instruction] } }
          markers: { $ref: '#/$defs/words' }
      site:
        description: site/lexicon.yaml, as written
        type: object
        additionalProperties: { $ref: '#/$defs/words' }
  url_scheme:
    description: site/url-scheme.yaml, as written
    type: object
    required: [pages, placeholders]
    properties:
      pages:
        type: object
        additionalProperties: { type: string }
      placeholders:
        type: object
$defs:
  slug:
    type: string
    pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
  number:
    description: a concept number, or an annex id
    type: string
    pattern: '^(?:\d+|A\d+)$'
  id:
    description: the id of a section or a unit
    type: string
    pattern: '^(?:\d+|A\d+)[a-z]\d?$'
  anchor:
    description: the id of a misconception on its concept page, its unit's id then its name in lowercase ASCII words joined by hyphens
    type: string
    pattern: '^(?:\d+|A\d+)[a-z]\d-[a-z0-9-]+$'
  line:
    type: string
    minLength: 1
  markdown:
    description: a course text, Markdown as the course writes it
    type: string
  path:
    description: an address relative to the base path of the site (site/url-scheme.yaml)
    type: string
    pattern: '^[a-z0-9-]+/(?:[A-Za-z0-9]+/)?$'
  words:
    type: object
    additionalProperties: { type: string }
  sections:
    type: array
    items:
      type: object
      required: [key, heading, text]
      additionalProperties: false
      properties:
        key: { $ref: '#/$defs/key' }
        heading: { $ref: '#/$defs/line' }
        text: { $ref: '#/$defs/markdown' }
  key:
    description: a key of course/lexicon.yaml
    type: string
    pattern: '^[a-z_]+$'
  table:
    type: object
    required: [header, rows]
    additionalProperties: false
    properties:
      header:
        type: array
        items: { type: string }
      rows:
        type: array
        items:
          type: array
          items: { type: string }
  tableSections:
    type: array
    items:
      type: object
      required: [key, heading, header, rows]
      additionalProperties: false
      properties:
        key: { $ref: '#/$defs/key' }
        heading: { $ref: '#/$defs/line' }
        header:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: array
            items: { type: string }
  item:
    description: an item of the frontmatter (course/schemas/concept-frontmatter.schema.yaml), as written
    type: object
    required: [text, refs]
    properties:
      text: { $ref: '#/$defs/markdown' }
      author: { type: string }
      refs:
        type: array
        items: { type: string }
      verified:
        type: array
        items: { type: string }
  items:
    type: array
    items: { $ref: '#/$defs/item' }
  case:
    type: object
    required: [title, supplementary]
    additionalProperties: false
    properties:
      title:
        description: the title of its heading, its id, unique in the concept
        $ref: '#/$defs/line'
      anchor: { $ref: '#/$defs/markdown' }
      question: { $ref: '#/$defs/markdown' }
      revealed:
        description: >-
          what the site shows hidden until the reader reveals it: the expected answer, then the
          misconceptions in play, each a link to its misconception
        type: object
        additionalProperties: false
        properties:
          expected_answer: { $ref: '#/$defs/markdown' }
          misconceptions_in_play:
            description: >-
              the misconceptions of its unit the case makes tempting, each its name and the id of
              the misconception it names (absent for a name that matches none)
            type: array
            minItems: 1
            items:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { $ref: '#/$defs/line' }
                id: { $ref: '#/$defs/anchor' }
      supplementary:
        description: false for the unit's case, true for a supplementary case
        type: boolean
  unit:
    type: object
    required: [id, title, blocks]
    additionalProperties: false
    properties:
      id: { $ref: '#/$defs/id' }
      title: { $ref: '#/$defs/line' }
      blocks:
        description: >-
          its published blocks, by their key in course/form.yaml, in the order the site renders them:
          the lesson (its matter), the cases, then the misconceptions of the lesson; never the
          instruction
        type: object
        additionalProperties: false
        properties:
          lesson:
            type: object
            additionalProperties: false
            properties:
              matter: { $ref: '#/$defs/markdown' }
          cases:
            type: array
            minItems: 1
            items: { $ref: '#/$defs/case' }
          misconceptions:
            description: >-
              the misconceptions of the lesson, after the cases, the order the site renders them in:
              each its id (its anchor on the concept page, which the misconceptions in play of a
              case link to), its name, its belief, its root and its correction
            type: array
            minItems: 1
            items:
              type: object
              required: [id, name, belief, root, correction]
              additionalProperties: false
              properties:
                id: { $ref: '#/$defs/anchor' }
                name: { $ref: '#/$defs/line' }
                belief: { $ref: '#/$defs/markdown' }
                root: { $ref: '#/$defs/markdown' }
                correction: { $ref: '#/$defs/markdown' }
  concept:
    type: object
    required: [number, annex, slug, title, objective, prerequisites, domain, path]
    additionalProperties: false
    properties:
      number: { $ref: '#/$defs/number' }
      annex: { type: boolean }
      slug: { $ref: '#/$defs/slug' }
      title: { $ref: '#/$defs/line' }
      objective: { $ref: '#/$defs/line' }
      prerequisites:
        type: array
        items: { $ref: '#/$defs/number' }
      duration_min: { type: integer, minimum: 1 }
      domain:
        description: the number of the domain that lists it, null for an annex
        oneOf: [{ type: 'null' }, { type: integer, minimum: 1 }]
      path: { $ref: '#/$defs/path' }
      head:
        type: object
        required: [key, heading, text]
        additionalProperties: false
        properties:
          key: { $ref: '#/$defs/key' }
          heading: { $ref: '#/$defs/line' }
          text: { $ref: '#/$defs/markdown' }
      sections:
        description: its sections, in the order of concept.md, each with its units
        type: array
        items:
          type: object
          required: [id, title, units]
          additionalProperties: false
          properties:
            id: { $ref: '#/$defs/id' }
            title: { $ref: '#/$defs/line' }
            units:
              type: array
              items: { $ref: '#/$defs/unit' }
      foot:
        description: its foot, present when it holds a published block
        type: object
        required: [heading, blocks]
        additionalProperties: false
        properties:
          heading: { $ref: '#/$defs/line' }
          blocks: { $ref: '#/$defs/sections' }
      stances:
        description: the frontmatter's stances, under their heading
        type: object
        required: [heading, consensus, school, course]
        additionalProperties: false
        properties:
          heading: { $ref: '#/$defs/line' }
          consensus: { $ref: '#/$defs/items' }
          school: { $ref: '#/$defs/items' }
          course: { $ref: '#/$defs/items' }
      neighbors: { $ref: '#/$defs/items' }
      diagrams:
        type: array
        items:
          type: object
          required: [file, title, caption, unit, svg]
          additionalProperties: false
          properties:
            file: { type: string, pattern: '^[a-z0-9-]+\.svg$' }
            title: { $ref: '#/$defs/line' }
            caption: { $ref: '#/$defs/line' }
            unit: { $ref: '#/$defs/id' }
            svg:
              description: the SVG file, as written
              type: string
              pattern: '<svg[\s>]'
      sources:
        description: the published ## sections of sources.md, each its table
        $ref: '#/$defs/tableSections'
