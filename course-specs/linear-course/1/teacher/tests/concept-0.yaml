id: concept-0
title: a learner just onboarded, the loop on concept 0 (a wrong answer, a partial one, a right one)
learner:
  apprenant.md: |
    # L'apprenant

    Surnom : **Sam** (le prof l'appelle ainsi).

    ## Profil

    - Son café : au bureau, le café de la Pipeline, et le week-end des capsules
    - Son matériel : une machine à capsules et une bouilloire, c'est tout

    ## Préférences

    Aucune.
  observations.md: |
    # Observations sur Sam

    Une ligne par entrée : `date, [concept], fait : action` (« Acquis » : `[concept] fait (date)`).
    `[général]` vaut pour tout le cours.
    Une vigilance surmontée passe en acquis ; une ligne contredite se corrige ou se supprime.

    ## Leviers

    Ce qui marche avec l'apprenant. À lire au démarrage.

    ## Vigilances actives

    Difficultés pas encore surmontées. Avant un concept, lis celles qui portent son numéro.

    ## Acquis
  parcours.md: |
    # Parcours de Sam

    Statut des concepts de la carte du cours (`course.yaml`) : `validé`, `en cours`, `sauté`,
    `à revoir`. Un concept absent du tableau est à faire.

    ## Prochaine étape

    Concept 0 : L'extraction (`concepts/00-extraction`), son premier message.

    ## Concepts

    | # | Concept | Statut |
    |---|---|---|

    Annexes vues : aucune.

    ## Points annoncés pour plus tard

    Aucun.

    ## Journal

    2026-11-02, session 1 : accueil.
turns:
  - message: On continue.
  - message: Oui, vas-y.
    if: next-line
    expect:
      - act: the first message of concept 0 (at this turn or the one before), its title a level-2 link, the stance of the course announced as its teaching notes say, one sub-concept (0a1, the extraction makes the taste) explained from its case, Cédric's two cups of the same coffee (« Le café a tourné ? »), the example and the question in one quote, the actors named with their storyline role
        rules: [concept-title-link, follow-concept-instructions, one-sub-concept-per-message, explanation-from-case, examples-from-bank, case-usage-respected, example-question-quote-form, examples-from-storyline, actor-named-with-role, same-role-actors-grouped, storyline-role-in-parentheses, storyline-facts-section-unsaid]
  - message: "Le café a dû tourner : son paquet n'est plus aussi bon que lundi."
    expect:
      - act: "the answer is wrong (a common mistake of the bank, « Si le goût change, c'est que le café a changé »): a follow-up on what the water took from the same coffee, in the quote form without its example part, no new sub-concept"
        rules: [wrong-answer-follow-up, common-mistake-not-nuance, follow-up-quote-form, wait-for-understanding, correct-frankly]
  - message: Le café est le même. C'est sa façon de faire la tasse qui a changé ce matin.
    expect:
      - act: "the answer is partial (what that change did is missing: the water took more, or less, from the coffee, the extraction, and the taste followed): what is right said, then a targeted follow-up on what is missing, in a short message, without explaining the sub-concept again"
        rules: [partial-answer-follow-up, wait-for-understanding]
  - message: "Le café est le même. Ce matin, quelque chose dans sa façon de faire la tasse a fait que l'eau en a dissous plus, ou moins, que lundi : c'est l'extraction qui a changé, et le goût a suivi."
    expect:
      - act: the correction opens the message and says frankly that the answer is right, then the next sub-concept (0a2, too little or too much) at the same message if it fits, or the next line; nothing written in learner/ (no save point)
        rules: [correct-frankly, correction-opens-message, chain-after-validation, write-at-save-points-only]
rules:
  - one-sub-concept-per-message
  - correction-opens-message
  - never-ask-if-understood
  - follow-concept-instructions
  - case-usage-respected
  - explanation-from-case
  - examples-from-bank
  - one-question-per-message
  - wait-for-understanding
  - partial-answer-follow-up
  - common-mistake-not-nuance
  - wrong-answer-follow-up
  - correct-frankly
  - chain-after-validation
  - short-messages
  - example-question-quote-form
  - follow-up-quote-form
  - concept-title-link
  - descriptive-site-links
  - no-task-list
  - no-end-of-turn-recap
  - course-language-typography
  - one-term-per-notion
  - examples-from-storyline
  - storyline-facts-then-improvised
  - actor-named-with-role
  - same-role-actors-grouped
  - storyline-role-in-parentheses
  - learner-never-decides-facts
  - storyline-facts-section-unsaid
  - write-at-save-points-only
