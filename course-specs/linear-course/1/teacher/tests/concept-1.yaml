id: concept-1
title: the last sub-concept of concept 0 validated, the transition to concept 1 and its loop
learner:
  apprenant.md: |
    # L'apprenant

    Surnom : **Sam** (le prof l'appelle ainsi).

    ## Profil

    - Son café : au bureau, le café de la Pipeline, et le week-end des capsules
    - Son matériel : une machine à capsules et une bouilloire, c'est tout

    ## Préférences

    Aucune.
  observations.md: |
    # Observations sur Sam

    Une ligne par entrée : `date, [concept], fait : action` (« Acquis » : `[concept] fait (date)`).
    `[général]` vaut pour tout le cours.
    Une vigilance surmontée passe en acquis ; une ligne contredite se corrige ou se supprime.

    ## Leviers

    Ce qui marche avec l'apprenant. À lire au démarrage.

    ## Vigilances actives

    Difficultés pas encore surmontées. Avant un concept, lis celles qui portent son numéro.

    ## Acquis
  parcours.md: |
    # Parcours de Sam

    Statut des concepts de la carte du cours (`course.yaml`) : `validé`, `en cours`, `sauté`,
    `à revoir`. Un concept absent du tableau est à faire.

    ## Prochaine étape

    Concept 0 : L'extraction (`concepts/00-extraction`), sous-concept 0b1 (forte ou
    sur-extraite) : son message, cas « Verse de l'eau chaude dedans ». Les sous-concepts 0a1 et
    0a2 sont faits.

    ## Concepts

    | # | Concept | Statut |
    |---|---|---|
    | 0 | L'extraction | en cours |

    Annexes vues : aucune.

    ## Points annoncés pour plus tard

    Aucun.

    ## Journal

    2026-11-02, session 1 : accueil, concept 0 commencé (l'extraction fait le goût).
    2026-11-03, session 2 : concept 0, 0a1 et 0a2 faits (l'extraction fait le goût ; trop peu, ou trop).
turns:
  - message: On continue.
  - message: Oui.
    if: next-line
    expect:
      - act: the message of 0b1 (at this turn or the one before), from the case « Verse de l'eau chaude dedans », Aïmen's advice, its question in the quote form
        rules: [one-sub-concept-per-message, example-question-quote-form, examples-from-storyline, actor-named-with-role]
  - message: "En partie seulement. La tasse est forte, noire et épaisse, mais amère et sèche en bouche : elle est aussi sur-extraite. L'eau chaude baissera sa force, elle sera moins intense, mais elle restera sur-extraite, amère et sèche en plus léger. C'est la façon de faire la tasse suivante qu'il faut changer."
    expect:
      - act: the answer validated frankly, concept 0 validated, the link of its page on the site
        rules: [correct-frankly, validated-concept-page-link, descriptive-site-links]
      - act: "a short sentence before the first tool call, then the save point of a validated concept (the status of concept 0 validated, the next step, the journal line, what is acquired), each file of learner/ written once with the write tool, then a commit « Sam : concept 0 validé », none of it announced"
        rules: [waiting-sentence-first, save-points, save-concept-statuses, save-next-step, save-journal-line, save-acquired, one-write-per-file, write-tool-not-shell, write-only-in-learner, commit-after-save-point, writes-not-announced]
      - act: concept.md and teaching.md of concept 1 read; the message ends on the question of concept 1 chained at the same message, or on the next line naming concept 1
        rules: [read-each-new-concept, chain-after-validation, chained-message-ending]
  - message: Oui.
    if: next-line
    expect:
      - act: the first message of concept 1 (at this turn or the one before), its title a level-2 link, the sub-concept 1a1 from the case of Cédric's recipe « Chez moi, qu'est-ce que je choisis, au juste ? », a new situation in the same business
        rules: [concept-title-link, one-sub-concept-per-message, change-situation-not-business, examples-from-storyline]
  - message: "Il ne choisit que la mouture, moyenne, au moulin : le reste, il ne le mesure pas, donc il ne le choisit pas."
    expect:
      - act: "the answer counts only what Cédric measures (a common mistake of the bank, « Ce que je ne mesure pas, je ne le choisis pas »): a follow-up on what he chose without measuring it (the coffee for his water, the heat of the water, the time) or another angle, no new sub-concept"
        rules: [wrong-answer-follow-up, one-question-per-message]
