id: resume
title: a returning learner with a pending question, a greeting, then the course path
learner:
  apprenant.md: |
    # L'apprenant

    Surnom : **Sam** (le prof l'appelle ainsi).

    ## Profil

    - Rôle : data engineer, futur PO de la plateforme de données de son équipe
    - Avant le parcours : a lu le Scrum Guide il y a longtemps, n'a jamais tenu de backlog ni écrit de user story

    ## Préférences

    Aucune.
  observations.md: |
    # Observations sur Sam

    Une ligne par entrée : `date, [concept], fait : action` (« Acquis » : `[concept] fait (date)`).
    `[général]` vaut pour tout le cours.
    Une vigilance surmontée passe en acquis ; une ligne contredite se corrige ou se supprime.

    ## Leviers

    Ce qui marche avec l'apprenant. À lire au démarrage.

    ## Vigilances actives

    Difficultés pas encore surmontées. Avant un concept, lis celles qui portent son numéro.

    ## Acquis
  parcours.md: |
    # Parcours de Sam

    Statut des concepts de la carte du cours (`course.yaml`) : `validé`, `en cours`, `sauté`,
    `à revoir`. Un concept absent du tableau est à faire.

    ## Prochaine étape

    Concept 0 : Scrum en bref et l'incrément (`concepts/00-scrum`), sous-concept 0a1 (les
    responsabilités), le message sur le PO. Question en attente : cas « Diego écrit des éléments
    du backlog », question en deux parties, la première posée : « Odile a-t-elle raison de dire
    que ce n'est pas le rôle de Diego d'écrire ces éléments ? ». Rien de juste encore.

    ## Concepts

    | # | Concept | Statut |
    |---|---|---|
    | 0 | Scrum en bref et l'incrément | en cours |

    Annexes vues : aucune.

    ## Points annoncés pour plus tard

    Aucun.

    ## Journal

    2026-11-02, session 1 : accueil, concept 0 commencé (l'équipe en bref).
    2026-11-03, session 2 : concept 0, message sur le PO ; arrêt sur une question en attente.
turns:
  - message: Bonjour
    expect:
      - act: the resume skill is loaded, not the onboarding one; no onboarding question asked again
        rules: [new-or-returning-learner, teacher-loads-composition]
      - act: first « Je retrouve où on en était, un instant. », with no tool call before it
        rules: [resume-opening-sentence]
      - act: only learner/parcours.md read, then a recap in two lines (the concept in progress, the next step) naming the pending question without asking it
        rules: [resume-reads-progress-only, resume-recap-message]
      - act: on a greeting, the teacher asks whether the learner continues or practises, lists the domains one line each, gives the link of the domains map, and stops there
        rules: [resume-on-greeting, descriptive-site-links, one-question-per-message]
  - message: On continue le cours.
    expect:
      - act: the storyline and the files of concept 0 read before what follows
        rules: [read-before-what-follows]
      - act: the sub-concept taught again from its start (explanation, example of the case « Diego écrit des éléments du backlog »), then the pending question, its first part, in the quote form
        rules: [pending-question-retaught, example-question-quote-form, one-question-per-message]
rules:
  - new-or-returning-learner
  - teacher-loads-composition
  - resume-opening-sentence
  - resume-reads-progress-only
  - resume-recap-message
  - resume-on-greeting
  - read-before-what-follows
  - pending-question-retaught
  - example-question-quote-form
  - one-question-per-message
  - short-messages
  - descriptive-site-links
  - course-language-typography
