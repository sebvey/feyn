# The form of a test scenario of linear-fr (README.md, this folder): one YAML file per
# scenario in this folder, named after its id, run by teacher-builder/fresh-test. check-spec
# (scenarios) validates every scenario of this folder against this schema, and checks that every
# slug it names is a rule of the protocol (teacher/rules.yaml), when spec.yaml declares the
# teacher, which it does not while the teacher is frozen.
$schema: https://json-schema.org/draft/2020-12/schema
title: a test scenario of the teacher
type: object
required: [id, title, learner, turns, rules]
additionalProperties: false
$defs:
  slug:
    type: string
    pattern: '^[a-z0-9]+(?:-[a-z0-9]+){1,4}$'
  text:
    type: string
    minLength: 1
properties:
  id:
    description: the scenario's id, its file name without .yaml
    type: string
    pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
  title:
    description: what the scenario runs, in a few words
    $ref: '#/$defs/text'
  learner:
    description: >-
      the learner memory the classroom starts from: `new` (the learner templates, as the build
      writes them), or a map from a file of learner/ to its content, the files it does not name
      keeping their template
    oneOf:
      - const: new
      - type: object
        minProperties: 1
        additionalProperties: false
        properties:
          apprenant.md: { $ref: '#/$defs/text' }
          parcours.md: { $ref: '#/$defs/text' }
          observations.md: { $ref: '#/$defs/text' }
  turns:
    description: the learner's messages, in order, one teacher reply each, in one conversation
    type: array
    minItems: 1
    items:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          description: what the learner says, in French
          $ref: '#/$defs/text'
        if:
          description: >-
            a branch: the message is sent only when the teacher's previous reply ends on the next
            line (`next-line`: it holds phrases.continue_prompt) or asks a question (`question`: it
            holds phrases.question_lead); otherwise the turn is skipped
          enum: [next-line, question]
        expect:
          description: the observable acts of the teacher's reply to this message
          type: array
          minItems: 1
          items:
            type: object
            required: [act, rules]
            additionalProperties: false
            properties:
              act:
                description: the act, as the protocol's reader tables word it
                $ref: '#/$defs/text'
              rules:
                description: the slugs of the rules the act exercises
                type: array
                minItems: 1
                items: { $ref: '#/$defs/slug' }
  rules:
    description: every slug the scenario exercises, each judged observed or not observed
    type: array
    minItems: 1
    uniqueItems: true
    items: { $ref: '#/$defs/slug' }
