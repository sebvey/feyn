id: retrieval-at-resume
title: a returning learner who validated concept 0 in an earlier session, next step concept 1
learner:
  apprenant.md: |
    # L'apprenant

    Surnom : **Sam** (le prof l'appelle ainsi).

    ## Profil

    - Son café : au bureau, le café de la Pipeline, et le week-end des capsules
    - Son matériel : une machine à capsules et une bouilloire, c'est tout

    ## Préférences

    Aucune.
  observations.md: |
    # Observations sur Sam

    Une ligne par entrée : `date, [concept], fait : action` (« Acquis » : `[concept] fait (date)`).
    `[général]` vaut pour tout le cours.
    Une vigilance surmontée passe en acquis ; une ligne contredite se corrige ou se supprime.

    ## Leviers

    Ce qui marche avec l'apprenant. À lire au démarrage.

    ## Vigilances actives

    Difficultés pas encore surmontées. Avant un concept, lis celles qui portent son numéro.

    ## Acquis

    [0] l'extraction fait le goût, sous- et sur-extraction, force et extraction (2026-11-03)
  parcours.md: |
    # Parcours de Sam

    Statut des concepts de la carte du cours (`course.yaml`) : `validé`, `en cours`, `sauté`,
    `à revoir`. Un concept absent du tableau est à faire.

    ## Prochaine étape

    Concept 1 : Les réglages (`concepts/01-reglages`), son premier message.

    ## Concepts

    | # | Concept | Statut |
    |---|---|---|
    | 0 | L'extraction | validé |

    Annexes vues : aucune.

    ## Points annoncés pour plus tard

    Aucun.

    ## Journal

    2026-11-02, session 1 : accueil, concept 0 commencé (l'extraction fait le goût).
    2026-11-03, session 2 : concept 0, 0a2 avec son cas supplémentaire « Le jus de pneu », 0b1 ; concept 0 validé.
turns:
  - message: On continue.
    expect:
      - act: "before concept 1 (at this turn or the next, after the recap), one case of concept 0 for practice, from its bank, the supplementary case the journal does not name, « La tasse légère du Petit Noir » (no case carries « entraînement » any more), its question in the quote form; concept 1 not started before it"
        rules: [earlier-concept-retrieved-at-resume]
  - message: "Oui."
    if: next-line
  - message: "Non, il n'a pas raison. Légère, c'est sa force qui est basse, pas son extraction. Elle est douce, elle ne pique pas, elle n'est ni amère ni sèche, et son goût reste en bouche : elle n'est ni sous-extraite ni sur-extraite, elle est équilibrée. Inès veut dire qu'une tasse peut être légère sans être creuse."
    expect:
      - act: "the answer to the case corrected by the loop (validated frankly), then the next step of parcours.md, concept 1, at the same message or on the next line"
        rules: [earlier-concept-retrieved-at-resume]
  - message: On s'arrête là.
    expect:
      - act: the stop's save point notes the title of the case posed for practice in the journal line of the session
        rules: [earlier-concept-retrieved-at-resume]
rules:
  - earlier-concept-retrieved-at-resume
