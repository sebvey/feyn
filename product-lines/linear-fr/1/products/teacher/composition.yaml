# The composition of the teacher of linear-fr: the five parts a teacher is made of, each by
# when it is loaded and what it draws from, as data (decision spec-files-by-product). The classroom
# build reads it to know what goes into each part (products/teacher/build/render-parts renders the parts as
# text, teacher-builder/ realises them); the fresh tests judge a teacher against it, on
# what it loads and when. products/teacher/README.md, « Composition », describes it. It names no mechanism of
# a target: how a part is realised is the teacher build's (teacher-builder/).
#
# A part: `id`, `loads`, `draws`; the part `on-demand` adds `moments`.
# `loads`, when the part is loaded, one of:
#   every-message             present at every message of the teacher
#   at-a-moment               loaded when one of its moments comes, and only then
#   during-the-session        read by the teacher during a teaching session, when the protocol says
#   at-start-and-save-points  read at the start of a teaching session, written at each save point
#   always                    in force from the teacher build on, whatever the teacher does
# `draws`, a list of entries, each `from`, `source` and `what`. `from`, where the source lives, one
# of:
#   spec       a file or folder of this spec MAJOR (product-lines/linear-fr/1/)
#   course     a file of the course folder, copied as is into the classroom's course/
#   learner    a file of learner memory, the classroom's learner/
#   classroom  a file or folder the teacher build makes
# `source`, the file or folder read, relative to its `from`: `{course.<name>}` is a course
# parameter (those products/teacher/build/instructions.yaml cites), `<dir>` the `dir` of the concept at hand in
# course.yaml, `<file>` the `file` of the domain at hand. `what`, what is drawn, in a few words, in
# French, since the teacher reads it (decision language-policy); a lexicon key
# (`headings.onboarding`) names a heading of a course file.
# A moment of `on-demand`: `id`, `when` (in French, as `what`: the teacher reads it to recognise
# the moment), `rules` (the slugs of the groups, families or rules of the protocol loaded at that
# moment, a family by its category in products/teacher/build/instructions.yaml; empty while the protocol has none for it)
# and `draws`, as a part's.
#
# The rules of the protocol are named by their file, products/teacher/build/instructions.yaml, which
# products/teacher/build/render-parts reads by family and group. No test of check-spec verifies the
# form of this file since the test composition left the spec directives (#765); the fresh tests
# judge its sense.
parts:
  - id: permanent
    loads: every-message
    draws:
      - from: spec
        source: products/teacher/build/instructions.yaml
        what: les règles du protocole et le but de leurs familles et de leurs groupes, sauf les règles qu'une autre partie charge
      - from: course
        source: plan.md
        what: la posture, le paragraphe sous headings.onboarding
      - from: course
        source: course.yaml
        what: la carte du cours, une projection de ses domaines et de ses concepts
      - from: course
        source: course.yaml
        what: les noms des fichiers du cours (fil rouge, glossaire, fiches de domaine, dossiers de concept)
      - from: spec
        source: products/teacher/lexicon.yaml
        what: les phrases et les mots du professeur que les règles nomment par clé
      - from: spec
        source: course/lexicon.yaml
        what: les mots des fichiers du cours que les règles nomment par clé
      - from: classroom
        source: course.lock
        what: les paramètres de la classe, site_url et les adresses du site, le canal

  - id: on-demand
    loads: at-a-moment
    draws:
      - from: spec
        source: products/teacher/build/instructions.yaml
        what: les règles de chaque moment ci-dessous
    moments:
      - id: onboarding
        when: un nouvel apprenant, au premier message d'une session de cours
        rules: [onboarding]
        draws:
          - from: course
            source: plan.md
            what: les questions d'accueil sous headings.onboarding
      - id: resume
        when: un apprenant qui revient, au premier message d'une session de cours
        rules: [resume]
        draws:
          - from: learner
            source: parcours.md
            what: où en est l'apprenant, la prochaine étape et une question en attente
      - id: diagram
        when: l'apprenant demande un schéma, ou vient le message du sous-concept que nomme le subconcept d'un schéma déclaré par concept.md
        rules: [requested-diagram-shown, diagram-not-displayable]
        draws:
          - from: course
            source: <dir>/concept.md
            what: les schémas que le concept déclare, leur titre, leur légende et le sous-concept qu'ils illustrent
          - from: course
            source: <dir>/teaching.md
            what: la consigne de dessin sous frozen_form.drawing, quand aucun schéma n'est déclaré
      - id: stop
        when: l'apprenant dit que la session de cours s'arrête
        rules: [stop]
        draws:
          - from: learner
            source: parcours.md
            what: la mémoire de l'apprenant relue comme le prochain professeur la lit
      - id: reset
        when: l'apprenant demande à reprendre le cours au début
        rules: []
        draws:
          - from: spec
            source: products/teacher/templates/learner/
            what: les modèles de l'apprenant, où revient la mémoire de l'apprenant

  - id: course-reads
    loads: during-the-session
    draws:
      - from: course
        source: "{course.storyline}"
        what: le fil rouge
      - from: course
        source: <file>
        what: la fiche du domaine en cours
      - from: course
        source: <dir>/concept.md
        what: la matière du concept en cours
      - from: course
        source: <dir>/teaching.md
        what: la méthode, comment enseigner le concept en cours
      - from: course
        source: <dir>/sources.md
        what: les sources du concept, à la demande
      - from: course
        source: "{course.glossary}"
        what: les termes du cours, un par notion

  - id: learner-memory
    loads: at-start-and-save-points
    draws:
      - from: spec
        source: products/teacher/templates/learner/
        what: les modèles de l'apprenant, la forme de la mémoire de l'apprenant
      - from: spec
        source: products/teacher/build/instructions.yaml
        what: les règles de mémoire, la famille learner-memory
      - from: learner
        source: apprenant.md
        what: le profil et les préférences de l'apprenant
      - from: learner
        source: parcours.md
        what: le parcours, le statut des concepts et la prochaine étape
      - from: learner
        source: observations.md
        what: les leviers, les vigilances et les acquis

  - id: permissions
    loads: always
    draws:
      - from: spec
        source: products/teacher/build/instructions.yaml
        what: la règle write-only-in-learner
      - from: classroom
        source: learner/
        what: peut s'écrire, se commite dans le git de la classe, ne se pousse jamais
      - from: classroom
        source: course/
        what: en lecture seule, ne s'écrit jamais
