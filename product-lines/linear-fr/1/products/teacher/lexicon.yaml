# The lexicon of the teacher of `linear-fr`: the words the teacher says and writes (its
# literal phrases, what the learner says and the teacher reacts to, the lines and the headings of
# learner memory, the concept statuses), named `{group.key}` in products/teacher/rules.yaml (decision
# `lexicon-not-language-pack`). The spec is French (`language: fr` in spec.yaml). The keys are
# those the protocol uses, listed in products/teacher/README.md, « Clés et paramètres » (`lexicon-keys`, a
# test of check-spec, verifies them when spec.yaml declares the teacher, which it does not until
# epic #757 brings the teacher up to date). A value with a slot, `{n}`, `{title}`, is filled by whoever
# reads it. Typography of these values: space before « : », « ; », « ? », « ! », quotes « »; no
# em-dash, no arrow.

# Literal phrases the teacher says (products/teacher/README.md, « Clés et paramètres »).
phrases:
  concept_title: "Concept {n} : {title}"
  domain_title: "Domaine {n} : {title}"
  site_link: "le site web"
  domains_map_link: "la carte des domaines"
  domains_one: "son domaine"
  domains_many: "ses {n} domaines"
  concept_page_link: "la page du concept {n}"
  example_lead: "Exemple :"
  question_lead: "Question pour toi :"
  next_lead: "La suite :"
  continue_prompt: "Des questions ? J'enchaîne ?"
  questions_announce: "J'ai {count} questions pour toi, voici la première :"  # {count} in words
  why: "pourquoi ?"
  banned_question: "as-tu compris ?"
  reference_model: "{name}, au concept {n}"  # a model: « la DoD, au concept 11 »
  waiting_example: "Parfait {nickname}, je prépare le concept {n}."  # a model
  onboarding_setup: "Je mets en place le cours."
  onboarding_ready: "C'est prêt, on démarre."
  resume_opening: "Je retrouve où on en était, un instant."
  stop_opening: "Je sauvegarde ta progression, un instant."

# What the learner says and the teacher reacts to (lists: models, not fixed strings).
learner_says:
  faster: "plus vite"
  slower: "plus lent"
  example: "exemple"
  exercise: "exercice"
  continue: ["on continue", "la suite"]
  resume: ["on reprend"]
  stop: ["on s'arrête", "fin de session", "je dois y aller", "on reprendra"]
  hurry: ["je dois filer", "vite"]

# Headings of the learner memory files; those of products/teacher/templates/learner/.
memory_headings:
  next_step: "Prochaine étape"
  concepts: "Concepts"
  announced: "Points annoncés pour plus tard"
  journal: "Journal"
  levers: "Leviers"
  vigilances: "Vigilances actives"
  acquired: "Acquis"
  preferences: "Préférences"

# Concept statuses in `learner/parcours.md`.
status:
  validated: "validé"
  in_progress: "en cours"
  skipped: "sauté"
  to_review: "à revoir"

# Line formats written to learner memory and to the commit messages.
memory:
  observation_line: "date, [concept], fait : action"
  acquired_line: "[concept] fait (date)"
  profile_line: "- {label} : {answer}"
  journal_line: "{date}, session {k} : {events}."  # date YYYY-MM-DD
  minirecap_entry: "mini-récap {from}-{to}"
  commit_message: "{nickname} : {what}"
  commit_validated: "concept {n} validé"
  commit_stop: "arrêt"
  onboarding: "accueil"

# The words of the course form the protocol still cites, which course/lexicon.yaml no
# longer holds: moved here with their values unchanged until epic #757 rewrites the rules that
# cite them; `fallback`, `practice` and `aside`, the former qualifiers of a supplementary case,
# which no case of a course carries any more.
frozen_form:
  instructions: "Consignes"
  bank: "Banque d'exemples"
  drawing: "Schéma"
  storyline_facts: "Faits du fil rouge utilisés"
  usage: "Usage"
  explanation: "Explication"
  fallback: "rechange"
  practice: "entraînement"
  aside: "aparté"
