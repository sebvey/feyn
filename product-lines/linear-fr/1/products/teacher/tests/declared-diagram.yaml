  - message: Oui.
    if: next-line
    expect:
      - act: "the message of 0b1 (at this turn or the one before), unasked: the diagram « L'extraction et la force, deux axes de la tasse » shown, or, where it cannot show, its caption, that it cannot show here and the concept's page; its caption, « De gauche à droite, la tasse va de sous-extraite (acide, courte) à sur-extraite (amère, sèche) en passant par l'équilibre ; de bas en haut, sa force, légère ou forte, est un autre axe, et chaque zone d'extraction existe à toutes les forces. », said"
        rules: [declared-diagram-shown]
