id: declared-diagram
title: a learner at sub-concept 0b of concept 0, which declares a diagram, who never asks for one
learner:
  apprenant.md: |
    # L'apprenant

    Surnom : **Sam** (le prof l'appelle ainsi).

    ## Profil

    - Son café : au bureau, le café de la Pipeline, et le week-end des capsules
    - Son matériel : une machine à capsules et une bouilloire, c'est tout

    ## Préférences

    Aucune.
  observations.md: |
    # Observations sur Sam

    Une ligne par entrée : `date, [concept], fait : action` (« Acquis » : `[concept] fait (date)`).
    `[général]` vaut pour tout le cours.
    Une vigilance surmontée passe en acquis ; une ligne contredite se corrige ou se supprime.

    ## Leviers

    Ce qui marche avec l'apprenant. À lire au démarrage.

    ## Vigilances actives

    Difficultés pas encore surmontées. Avant un concept, lis celles qui portent son numéro.

    ## Acquis
  parcours.md: |
    # Parcours de Sam

    Statut des concepts de la carte du cours (`course.yaml`) : `validé`, `en cours`, `sauté`,
    `à revoir`. Un concept absent du tableau est à faire.

    ## Prochaine étape

    Concept 0 : L'extraction (`concepts/00-extraction`), sous-concept 0b1 (forte ou
    sur-extraite) : son message, cas « Verse de l'eau chaude dedans ». Les sous-concepts 0a1 et
    0a2 sont faits.

    ## Concepts

    | # | Concept | Statut |
    |---|---|---|
    | 0 | L'extraction | en cours |

    Annexes vues : aucune.

    ## Points annoncés pour plus tard

    Aucun.

    ## Journal

    2026-11-02, session 1 : accueil, concept 0 commencé (l'extraction fait le goût).
    2026-11-03, session 2 : concept 0, 0a1 et 0a2 faits (l'extraction fait le goût ; trop peu, ou trop).
turns:
