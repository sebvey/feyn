# The lexicon the check fixtures use (check-course --lexicon): the groups of course/README.md
# section 7, with the values of the spec's own course/lexicon.yaml. Change both together.

# Section titles of the course files.
headings:
  essentials: "L'essentiel"
  stances: "Consensus et choix d'école"
  deepening: "Approfondissement"
  landmarks: "Se vérifier"
  teacher_note: "Consigne au professeur"
  foot: "Clôture"
  problem: "Le problème"
  crossing_case: "Un cas qui traverse le domaine"
  audience: "Public cible"
  onboarding: "Accueil"
  progression: "Progression"
  fixed_facts: "Faits fixés"
  avoid: "Termes à éviter"
  unreleased: "Non publié"

# The kind words that open the headings of a concept file (course/form.yaml): `# Concept 4 : <titre>`,
# `# Annexe A1 : <titre>`, `## Section 4a : <titre>`, `### Unité 4a1 : <titre>`, `##### Cas : <titre>`;
# `separator` stands between the id and the title, or between the kind word of a case and its
# title (French typography, a space before « : »).
block_kinds:
  concept: "Concept"
  annex: "Annexe"
  section: "Section"
  unit: "Unité"
  case: "Cas"
  separator: " : "

# Labels of the fields of a unit of a concept file, those of its cases and of its misconceptions
# among them (course/form.yaml); `teacher_note` is also the word of the unit's block « Consigne au
# professeur », unlabelled.
unit_fields:
  matter: "Matière"
  misconceptions: "Idées fausses"
  root: "Racine"
  correction: "Correction"
  anchor: "Ancrage"
  question: "Question"
  expected_answer: "Réponse attendue"
  misconceptions_in_play: "Idées fausses en jeu"
  teacher_note: "Consigne au professeur"

# The words of the two blocks of a unit that hold labelled fields (course/form.yaml, `unit`).
unit_blocks:
  lesson: "Leçon"
  cases: "Cas du fil rouge"

# The natures of a claim, the words of the destination of its mark in the published text,
# `[le texte affirmé](consensus:S1 "nom")` (course/README.md 3.4; course/claims.js): a fact, which
# a source states and no one has to hold, or one of the three stances, the field's consensus, a
# school (someone named) and the course's own choice or conclusion.
natures:
  consensus: "consensus"
  school: "école"
  fact: "fait"
  course: "cours"

# The words of a concept reference in the text of a course: « concept 4 », « concepts 5 et 7b »,
# « annexe A2 » (course/README.md 3.5).
concept_refs:
  concept: "concept"
  concepts: "concepts"
  and: "et"
  annex: "annexe"

# What describes a source of `sources.yaml` (course/README.md 3.4), three closed lists: its kind,
# the form of the document; its control, the review it went through before publication; its
# independence from what it says.
source_kinds:
  study: "étude"
  review: "revue de littérature"
  standard: "norme"
  survey: "enquête"
  article: "article"
  post: "billet"
  guide: "guide"
  dictionary: "dictionnaire"
  sales_page: "page de vente"
source_controls:
  peers: "pairs"
  editorial: "éditorial"
  none: "aucun"
source_independence:
  independent: "indépendante"
  interested: "intéressée"

# `rules`: what the teacher does, as a clause of a sentence (no final period). `banned`: the
# characters course text never uses, the em-dash and the arrows (the ASCII `->`, `<-` and `=>` included).
typography:
  rules: "espace avant « : », « ; », « ? » et « ! » ; guillemets « »"
  banned: ["—", "→", "←", "↔", "↑", "↓", "↕", "↗", "↘", "↖", "↙", "↦", "↳", "↪", "⇒", "⇐", "⇔", "⇨", "⟶", "⟵", "⟷", "⟹", "⟸", "⟺", "➜", "➔", "➝", "➞", "➡", "⬅", "⬆", "⬇", "->", "<-", "=>"]
