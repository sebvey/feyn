# Template of courses/<id>/course.yaml (course/README.md section 2). Copy it to the course folder.
#
# How to use: replace every <placeholder>; delete these header lines; keep the comments that
# help, they are YAML and harmless. Repeat the domain block per domain and the concept block
# per concept, in course order. Concept `<n>` is 0, 1, 2... for a concept, A1, A2... for an
# annex (an annex is also listed in `annexes`); `<NN>` is the number on two digits (09), an
# annex keeps its number (A1).
# course.yaml is the map: domains and concepts, nothing below a concept; the sections and units
# of a concept are the headings of its concept.md (template concept.md); whom the course is for
# is « Public cible » of plan.md (template plan.md). The rules of course.yaml are
# the group « Le fichier course.yaml » of course/rules.yaml, to which course/README.md section 2
# points.
# Identifiers (numbers, section and unit ids, titles of cases, dir and file names) are cited by
# learner memory and site addresses: changing one is a course MAJOR (course/README.md section 3,
# spec-directives/1/README.md section 3).
id: <course-id>
spec: linear-fr@1
title: "<course title>"
subtitle: "<one line under the title>"
# who answers for the course, one name or more; and the licence it is published under, an SPDX
# licence identifier as the SPDX list writes it (https://spdx.org/licenses/). Its dates and its
# version are no keys: the site takes them from git and CHANGELOG.md (course/README.md section 2)
maintainers: ["<maintainer name>"]
license: <SPDX licence identifier>
# the course's look on its site; its logo is the file logo.svg beside this one (course/README.md
# section 1), named by no key
site:
  accent_color: "<#rrggbb>"
storyline: storyline.md
glossary: glossary.md
# annexes: [A1]
domains:
  - number: 1
    slug: <domain-slug>
    title: "<domain title>"
    objective: "<what the learner can do at the end of the domain, one sentence>"
    duration_min: <domain minutes>
    file: domains/1-<domain-slug>.md
    concepts: [<n>]
concepts:
  - number: <n>
    slug: <concept-slug>
    title: "<concept title>"
    objective: "<concept objective>"
    prerequisites: []
    duration_min: <concept minutes>
    dir: concepts/<NN>-<concept-slug>
