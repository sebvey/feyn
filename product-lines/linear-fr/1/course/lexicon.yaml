# The lexicon of the course files of `linear-fr`: the one source of the words a program must
# recognise in a course file (headings, block kinds, unit fields, unit blocks, markers,
# natures, concept references, source types, typography), read by the checks, the teacher build and the site,
# none of which writes them again (course/README.md section 7;
# decision `lexicon-not-language-pack`). The spec is French (`language: fr` in spec.yaml): the
# values are course text, in French. The keys are those `lists.lexicons.course` of spec.yaml
# lists, which the table of course/README.md section 7 lists too, with what each is used for
# (`lexicon-keys`, a test of check-spec, holds this file and that table to the manifest).
# Typography of these values: space before « : », « ; », « ? », « ! », quotes « »; no em-dash, no
# arrow (the list under `typography.banned` names them).

# Section titles of the course files.
headings:
  essentials: "L'essentiel"
  stances: "Consensus et choix d'école"
  deepening: "Approfondissement"
  landmarks: "Se vérifier"
  teacher_note: "Consigne au professeur"
  foot: "Clôture"
  claims: "Affirmations"
  references: "Références"
  unverified: "Non vérifié"
  problem: "Le problème"
  crossing_case: "Un cas qui traverse le domaine"
  audience: "Public cible"
  onboarding: "Accueil"
  progression: "Progression"
  fixed_facts: "Faits fixés"
  avoid: "Termes à éviter"
  unreleased: "Non publié"

# The kind words that open the headings of a concept file (course/form.yaml): `# Concept 4 : <titre>`,
# `# Annexe A1 : <titre>`, `## Section 4a : <titre>`, `### Unité 4a1 : <titre>`, `##### Cas : <titre>`;
# `separator` stands between the id and the title, or between the kind word of a case and its
# title (French typography, a space before « : »).
block_kinds:
  concept: "Concept"
  annex: "Annexe"
  section: "Section"
  unit: "Unité"
  case: "Cas"
  separator: " : "

# Labels of the fields of a unit of a concept file, those of its cases and of its misconceptions
# among them (course/form.yaml); `teacher_note` is also the word of the unit's block « Consigne au
# professeur », unlabelled.
unit_fields:
  matter: "Matière"
  misconceptions: "Idées fausses"
  root: "Racine"
  correction: "Correction"
  anchor: "Ancrage"
  question: "Question"
  expected_answer: "Réponse attendue"
  misconceptions_in_play: "Idées fausses en jeu"
  teacher_note: "Consigne au professeur"

# The words of the two blocks of a unit that hold labelled fields (course/form.yaml, `unit`).
unit_blocks:
  lesson: "Leçon"
  cases: "Cas du fil rouge"

# The stance markers of the published text: `[cours]`, `[école]`, `[consensus]`.
markers:
  consensus: "consensus"
  school: "école"
  course: "cours"

# The nature of a claim of `sources.md` that is not a stance marker: what a source says with no
# stance (a tool's default, a date, a figure). The other natures are the markers consensus,
# school, course (course/README.md 3.4). Read by `sources` only: never a marker of the published text.
natures:
  fact: "fait"

# The words of a concept reference in the text of a course: « concept 4 », « concepts 5 et 7b »,
# « annexe A2 » (course/README.md 3.5).
concept_refs:
  concept: "concept"
  concepts: "concepts"
  and: "et"
  annex: "annexe"

# The types of a reference of `sources.md`.
source_types:
  primary: "primaire"
  secondary: "secondaire"
  marketing: "marketing"

# `rules`: what the teacher does, as a clause of a sentence (no final period). `banned`: the
# characters course text never uses, the em-dash and the arrows (the ASCII `->`, `<-` and `=>` included).
typography:
  rules: "espace avant « : », « ; », « ? » et « ! » ; guillemets « »"
  banned: ["—", "→", "←", "↔", "↑", "↓", "↕", "↗", "↘", "↖", "↙", "↦", "↳", "↪", "⇒", "⇐", "⇔", "⇨", "⟶", "⟵", "⟷", "⟹", "⟸", "⟺", "➜", "➔", "➝", "➞", "➡", "⬅", "⬆", "⬇", "->", "<-", "=>"]
