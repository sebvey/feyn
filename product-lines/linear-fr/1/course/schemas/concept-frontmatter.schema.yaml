# The fields of the concept.md frontmatter, to which course/README.md section 3.1 points: its keys,
# a diagram entry, their presence and their form. The frontmatter holds metadata only, the
# diagrams; a concept with no diagram has no frontmatter. A claim is marked in the published text
# and its sources are `sources.yaml` (course/README.md 3.4). What the schema does not say (a
# declared diagram that exists and names a unit of the concept) is a rule of course/rules.yaml.
# concept-file validates the frontmatter against it through Ajv2020.
$schema: https://json-schema.org/draft/2020-12/schema
title: concept.md frontmatter
type: object
additionalProperties: false
properties:
  diagrams:
    description: the concept's diagrams
    type: array
    items:
      $ref: '#/$defs/diagram'
$defs:
  text:
    type: string
    pattern: '\S'
  diagram:
    description: a diagram entry, all keys mandatory
    type: object
    required: [file, title, caption, unit]
    additionalProperties: false
    properties:
      file:
        description: the SVG's file name
        $ref: '#/$defs/text'
      title:
        description: "one line: the SVG <title>, and the text a consumer shows in place of the drawing"
        $ref: '#/$defs/text'
      caption:
        description: what the diagram shows
        $ref: '#/$defs/text'
      unit:
        description: the id of the unit it illustrates, where the build places it
        $ref: '#/$defs/text'
